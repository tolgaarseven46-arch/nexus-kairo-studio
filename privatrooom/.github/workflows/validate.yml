name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Room conversation contract proof
        run: npm run test:room-contract

      - name: Room transcript authority proof
        run: npm run test:room-history

      - name: Kaira explicit invite contract proof
        run: npm run test:kaira-invite

      - name: Room Firestore security proof
        run: npm run test:room-firestore-security

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build
