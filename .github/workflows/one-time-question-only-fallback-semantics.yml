name: One-time question-only fallback semantics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch question-only fallback
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/services/kairoResponseConsistency.ts'); s=p.read_text(encoding='utf-8'); old=\"text = withoutQuestions || fallbackForTrace(trace);\"; new=\"text = withoutQuestions || (continueConversation ? 'tamam' : fallbackForTrace(trace));\"; assert old in s, 'question fallback marker missing'; p.write_text(s.replace(old,new,1),encoding='utf-8')"
          rm .github/workflows/one-time-question-only-fallback-semantics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/kairoResponseConsistency.ts .github/workflows/one-time-question-only-fallback-semantics.yml
          git commit -m "fix(kaira): keep question suppression conversation-open"
          git push
