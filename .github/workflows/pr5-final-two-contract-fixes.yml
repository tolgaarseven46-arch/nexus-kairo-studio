name: PR5 Final Two Contract Fixes

on:
  push:
    branches: [chatgpt/pr5-remove-canonical-compatibility]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chatgpt/pr5-remove-canonical-compatibility
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Apply and self-remove
        run: |
          node scripts/pr5-final-two-contract-fixes.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(kaira): finalize canonical PR5 contracts'
          git push origin HEAD:chatgpt/pr5-remove-canonical-compatibility
