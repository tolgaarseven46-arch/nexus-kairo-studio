name: one-time-epistemic-contract-v2
on:
  push:
    paths:
      - '.github/workflows/one-time-epistemic-contract-v2.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Patch registry and contract gate
        run: |
          node <<'NODE'
          const fs = require('fs');
          const registryPath = 'src/services/kairaContractRegistry.ts';
          let registry = fs.readFileSync(registryPath, 'utf8');
          const oldBlock = `  {
              id: "epistemic-access",
              version: 1,
              status: "active",
              ownerLayer: "epistemic-gate",
              consumerLayers: ["appraisal", "behavior-policy", "response-generation"],
              summary: "Model knowledge and Kaira knowledge are separate concepts. Until real knowledge state is connected, one compatibility gate returns known; future knowledge decisions must plug into this seam rather than scatter checks across layers.",
            },`;
          const newBlock = `  {
              id: "epistemic-access",
              version: 1,
              status: "superseded",
              ownerLayer: "epistemic-gate",
              consumerLayers: ["appraisal", "behavior-policy", "response-generation"],
              summary: "Model knowledge and Kaira knowledge are separate concepts. Until real knowledge state is connected, one compatibility gate returns known; future knowledge decisions must plug into this seam rather than scatter checks across layers.",
              revisionReason: "V2 adds explicit knowledge-profile coverage semantics so absence can mean unknown only when the profile declares a complete bounded catalogue.",
            },
            {
              id: "epistemic-access",
              version: 2,
              status: "active",
              ownerLayer: "epistemic-gate",
              consumerLayers: ["appraisal", "behavior-policy", "response-generation", "observability"],
              summary: "Knowledge decisions consume an explicit per-instance knowledge profile. Known concepts retain provenance/confidence, low-confidence concepts remain partial, and absence becomes unknown only under bounded_catalog coverage; open or absent profiles preserve legacy broad-model compatibility.",
              supersedes: "epistemic-access@1",
            },`;
          if (!registry.includes(oldBlock)) throw new Error('epistemic registry block not found');
          registry = registry.replace(oldBlock, newBlock);
          fs.writeFileSync(registryPath, registry);

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          const test = 'src/services/kairaEpistemicGateContracts.test.ts';
          if (!pkg.scripts['test:contracts'].includes(test)) {
            pkg.scripts['test:contracts'] += ` ${test}`;
          }
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          NODE
      - name: Focused regressions
        run: npx vitest run src/services/kairaEpistemicGateContracts.test.ts src/services/kairaContractRegistry.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Commit product and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-epistemic-contract-v2.yml
          git add src/services/kairaContractRegistry.ts package.json
          git commit -m "feat(kaira): version epistemic access contract"
          git push
