name: One-time conversation authority compatibility removal

on:
  push:
    paths:
      - ".github/workflows/one-time-conversation-authority-compatibility-removal.yml"
      - "scripts/applyConversationAuthorityCompatibilityRemoval.mjs"
      - "src/services/kairaConversationStateLockContracts.test.ts"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove retired compatibility response name
        run: node scripts/applyConversationAuthorityCompatibilityRemoval.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: State lock contract
        run: npm test -- --run src/services/kairaConversationStateLockContracts.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- server.ts src/services/kairaConversationStateLockContracts.test.ts; then
            echo "conversation authority compatibility already removed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/kairaConversationStateLockContracts.test.ts
          git commit -m "refactor(kaira): remove conversation authority compatibility name"
          git pull --rebase origin main
          git push origin main
