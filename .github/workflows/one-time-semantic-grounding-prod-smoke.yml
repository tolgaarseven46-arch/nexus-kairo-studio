name: One-time Semantic Grounding Production Smoke

on:
  push:
    branches:
      - diag/semantic-grounding-prod-smoke

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diag/semantic-grounding-prod-smoke
          fetch-depth: 0
      - name: Verify warm-context continuation, genuine routine, and short-token grounding
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nexus-kairo-studio.onrender.com/api/language-understanding'
          post() {
            local outfile="$1"
            local body="$2"
            curl --fail-with-body --silent --show-error --max-time 120 \
              -H 'Content-Type: application/json' --data "$body" "$URL" > "$outfile"
          }
          for i in 1 2 3 4 5 6 7 8; do
            post "/tmp/match_${i}.json" '{"userMessage":"iyi maç izliyorum","userName":"Mert","characterName":"Kaira","history":[{"role":"user","content":"naber"},{"role":"assistant","content":"iyi valla sen nasılsın"}],"provider":"openrouter"}'
          done
          for i in 1 2 3; do
            post "/tmp/naber_${i}.json" '{"userMessage":"naber","userName":"Mert","characterName":"Kaira","history":[{"role":"user","content":"selam"},{"role":"assistant","content":"selam"}],"provider":"openrouter"}'
          done
          post /tmp/sg.json '{"userMessage":"sg","userName":"Mert","characterName":"Kaira","history":[{"role":"user","content":"seni sevdim"},{"role":"assistant","content":"bunu duymak güzel"}],"provider":"openrouter"}'
          node <<'NODE'
          const fs = require('fs');
          const load = (p) => JSON.parse(fs.readFileSync(p, 'utf8')).interpretation;
          const summary = { match: [], naber: [], sg: null };
          let observedRoutineRejection = 0;
          for (let i=1;i<=8;i++) {
            const x = load(`/tmp/match_${i}.json`);
            summary.match.push({intent:x.primaryIntent,routine:x.discourseFacets?.socialRoutine,grounding:x.grounding});
            if (x.primaryIntent !== 'smalltalk') throw new Error(`match ${i}: intent=${x.primaryIntent}`);
            if (x.discourseFacets?.socialRoutine !== 'none') throw new Error(`match ${i}: routine=${x.discourseFacets?.socialRoutine}`);
            if (x.grounding) {
              if (!x.grounding.adjudicatedAgainstContextFree) throw new Error(`match ${i}: malformed grounding`);
              if (!x.grounding.rejectedContextFields?.includes('socialRoutine')) throw new Error(`match ${i}: grounding exists without socialRoutine rejection`);
              observedRoutineRejection += 1;
            }
          }
          for (let i=1;i<=3;i++) {
            const x = load(`/tmp/naber_${i}.json`);
            summary.naber.push({intent:x.primaryIntent,routine:x.discourseFacets?.socialRoutine,grounding:x.grounding});
            if (x.primaryIntent !== 'greeting') throw new Error(`naber ${i}: intent=${x.primaryIntent}`);
            if (x.discourseFacets?.socialRoutine !== 'how_are_you') throw new Error(`naber ${i}: routine=${x.discourseFacets?.socialRoutine}`);
            if (!x.grounding?.adjudicatedAgainstContextFree) throw new Error(`naber ${i}: expected grounding comparison`);
            if (x.grounding.rejectedContextFields?.length) throw new Error(`naber ${i}: unexpected rejected fields ${x.grounding.rejectedContextFields}`);
          }
          const sg = load('/tmp/sg.json');
          summary.sg = {intent:sg.primaryIntent,valence:sg.valence,affection:sg.affection,routine:sg.discourseFacets?.socialRoutine,grounding:sg.grounding};
          if (sg.primaryIntent !== 'other' || sg.valence !== 'neutral') throw new Error(`sg drift: ${sg.primaryIntent}/${sg.valence}`);
          if ((sg.affection || 0) > 0.2) throw new Error(`sg affection=${sg.affection}`);
          if (!sg.grounding?.adjudicatedAgainstContextFree) throw new Error('sg grounding missing');
          console.log(JSON.stringify({...summary, observedRoutineRejection}, null, 2));
          console.log('PRODUCTION_SEMANTIC_GROUNDING_PASS');
          NODE
      - name: Self-remove diagnostic workflow
        shell: bash
        run: |
          git rm .github/workflows/one-time-semantic-grounding-prod-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove semantic grounding production smoke'
          git push origin HEAD:diag/semantic-grounding-prod-smoke
