name: Phase3 Behavior Contract

on:
  push:
    paths:
      - '.github/workflows/phase3-behavior-contract.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wire binding behavior contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.ts')
          s=p.read_text()
          imp='import { applyConversationStateAuthority } from "./src/services/conversationStateAuthority";'
          newimp=imp+'\nimport { buildBehaviorContract, behaviorContractInstruction } from "./src/services/behaviorContract";'
          if 'behaviorContractInstruction' not in s:
              assert imp in s
              s=s.replace(imp,newimp,1)
          anchor='      conversationAuthority = applyConversationStateAuthority(safePersonality, kdm.nextDynamicState),\n      authoritativePersonality = conversationAuthority.personality,\n      behaviorProfile = kdm.behaviorProfile,'
          replacement='      conversationAuthority = applyConversationStateAuthority(safePersonality, kdm.nextDynamicState),\n      authoritativePersonality = conversationAuthority.personality,\n      behaviorContract = buildBehaviorContract(kdm.nextDynamicState, kdm.trace),\n      behaviorProfile = kdm.behaviorProfile,'
          if 'behaviorContract = buildBehaviorContract' not in s:
              assert anchor in s
              s=s.replace(anchor,replacement,1)
          old='        continueConversation: runtimeFlag(authoritativePersonality, "runtimeContinueConversation", true),\n        humorAllowed: runtimeFlag(authoritativePersonality, "runtimeHumorAllowed", true),\n        askQuestion: runtimeFlag(authoritativePersonality, "runtimeAskQuestion", true),'
          new='        continueConversation: behaviorContract.continueConversation && runtimeFlag(authoritativePersonality, "runtimeContinueConversation", true),\n        humorAllowed: behaviorContract.playfulness === "allowed" && runtimeFlag(authoritativePersonality, "runtimeHumorAllowed", true),\n        askQuestion: behaviorContract.questions === "allowed" && runtimeFlag(authoritativePersonality, "runtimeAskQuestion", true),\n        behaviorContract,'
          if '        behaviorContract,' not in s:
              assert old in s
              s=s.replace(old,new,1)
          prompt='${relationshipInstruction}\\nKDM: niyet='
          if '${behaviorContractInstruction(behaviorContract)}' not in s:
              assert prompt in s
              s=s.replace(prompt,'${relationshipInstruction}\\n${behaviorContractInstruction(behaviorContract)}\\nKDM: niyet=',1)
          oldk='kdm: { trace: kdm.trace, dynamicState: kdm.nextDynamicState, semanticEvent: canonicalSemantic.event, semanticSource: canonicalSemantic.source },'
          newk='kdm: { trace: kdm.trace, dynamicState: kdm.nextDynamicState, semanticEvent: canonicalSemantic.event, semanticSource: canonicalSemantic.source, behaviorContract, conversationAuthority: { state: conversationAuthority.state, locked: conversationAuthority.locked, reason: conversationAuthority.reason } },'
          s=s.replace(oldk,newk)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.ts
          git diff --cached --quiet || git commit -m "refactor(kdm): enforce post-transition behavior contract"
          git push
