name: One-time SG Semantic Postfix

on:
  push:
    branches:
      - diag/sg-semantic-postfix

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diag/sg-semantic-postfix
          fetch-depth: 0
      - name: Verify production canonical semantics
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nexus-kairo-studio.onrender.com/api/language-understanding'
          curl --fail-with-body --silent --show-error --max-time 120 -H 'Content-Type: application/json' --data '{"userMessage":"sg","userName":"Mert","characterName":"Kaira","history":[],"provider":"openrouter"}' "$URL" > /tmp/standalone.json
          curl --fail-with-body --silent --show-error --max-time 120 -H 'Content-Type: application/json' --data '{"userMessage":"sg","userName":"Mert","characterName":"Kaira","history":[{"role":"user","content":"seni sevdim"},{"role":"assistant","content":"bunu duymak güzel"},{"role":"user","content":"gel sarıl"},{"role":"assistant","content":"burdayım"}],"provider":"openrouter"}' "$URL" > /tmp/warm.json
          curl --fail-with-body --silent --show-error --max-time 120 -H 'Content-Type: application/json' --data '{"userMessage":"sg","userName":"Mert","characterName":"Kaira","history":[{"role":"user","content":"bu hoşuma gitmedi"},{"role":"assistant","content":"anladım"},{"role":"user","content":"konuyu kapatalım"},{"role":"assistant","content":"tamam"}],"provider":"openrouter"}' "$URL" > /tmp/tense.json
          echo '===== STANDALONE ====='; cat /tmp/standalone.json; echo
          echo '===== WARM ====='; cat /tmp/warm.json; echo
          echo '===== TENSE ====='; cat /tmp/tense.json; echo
          node <<'NODE'
          const fs = require('fs');
          const rows = ['standalone','warm','tense'].map(name => [name, JSON.parse(fs.readFileSync(`/tmp/${name}.json`,'utf8')).interpretation]);
          for (const [label, x] of rows) {
            if (x.primaryIntent !== 'other') throw new Error(`${label}: primaryIntent=${x.primaryIntent}`);
            if (x.valence !== 'neutral') throw new Error(`${label}: valence=${x.valence}`);
            if ((x.secondarySocialActs || []).includes('affection') || (x.secondarySocialActs || []).includes('closeness_bid')) throw new Error(`${label}: social acts invented`);
            if ((x.affection || 0) > 0.2) throw new Error(`${label}: affection=${x.affection}`);
            if (x.discourseFacets?.relationalAct === 'closeness_bid') throw new Error(`${label}: closeness_bid invented`);
            if ((x.uncertainty?.overall || 0) < 0.7) throw new Error(`${label}: uncertainty too low=${x.uncertainty?.overall}`);
          }
          console.log('PRODUCTION_SG_NON_INVENTION_PASS');
          NODE
      - name: Self-remove diagnostic workflow
        shell: bash
        run: |
          git rm .github/workflows/one-time-sg-semantic-postfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove sg semantic postfix diagnostic'
          git push origin HEAD:diag/sg-semantic-postfix
