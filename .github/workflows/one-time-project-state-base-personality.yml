name: One-time project state base personality

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-base-personality.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 28. Base personality / per-turn response overlay ownership — 2026-08-31\n- Client payload artık iki ayrı kişilik rolü taşır: `personality` kalıcı/base karakter traitleri, `responsePersonality` ise 8-layer pipeline'ın o tur için ürettiği response-style overlay'dir.\n- Authoritative KDM relationship/emotion reducer yalnız `basePersonality` ile çalışır. Tur içi `empathy`, `patience`, `humor`, `authority`, `seriousness`, `communication` modifikasyonları aynı turun kalıcı ilişki/duygu fiziğine geri beslenmez.\n- Explicit `behavior-policy@1`, KDM'ye girebilen ayrı per-turn karar input'u olmaya devam eder; provenance görünürdür.\n- KDM state transition tamamlandıktan sonra `responsePersonality`, `applyConversationStateAuthority(...)` ve speech/local response HOW üretimi için kullanılabilir. Böylece davranış stili korunurken kalıcı kişilik otoritesi ayrılmıştır.\n- Client tarafındaki layer engine'ler bu fazda silinmedi; response overlay ve test audit üretmeye devam eder.\n- `kairaBasePersonalityOwnershipContracts.test.ts` kalıcı `test:contracts` suite'ine eklendi.\n- Entegrasyon commit'i: `593c838` (`feat(kaira): separate base personality from response overlay`). Ownership contract, TypeScript, full test suite ve production build başarıyla geçti; geçici migration workflow/script kaldırıldı.\n- Sonraki audit sınırı: eski `runtime*` alanlarının KDM ve final ResponsePlan otoritelerinden ayrıldıktan sonra hâlâ gerçek runtime tüketicisi olup olmadığı. Kullanılmayan compatibility alanları temizlenmeden önce repo çapında tüketici audit'i yapılmalı.\n'''
          if '## 28. Base personality / per-turn response overlay ownership — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record base personality ownership"
          git pull --rebase origin main
          git push origin main
