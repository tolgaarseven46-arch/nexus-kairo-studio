name: One-time Live Quality Smoke

on:
  push:
    branches:
      - codex/one-time-live-quality-smoke

jobs:
  live-quality-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Gemini Flash Lite route and exercise deployed Kaira
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error

          base = "https://nexus-kairo-studio.onrender.com"
          with urllib.request.urlopen(base + "/api/runtime-info", timeout=45) as response:
              runtime = json.loads(response.read().decode("utf-8"))
          print("RUNTIME_INFO:")
          print(json.dumps(runtime, ensure_ascii=False, indent=2))
          expected_model = "google/gemini-2.5-flash-lite"
          if runtime.get("activeProvider") != "openrouter" or runtime.get("model") != expected_model:
              raise SystemExit(f"wrong live model route: {runtime}")

          url = base + "/api/chat"
          user_id = "live_quality_flash_lite_20260915"
          session_id = f"session_{user_id}_{int(time.time())}"
          history = []
          messages = [
              "kanka bugün müdürle fena tartıştım",
              "yarın istifa etmeyi düşünüyorum ama daha karar vermedim",
              "sen olsan ne yapardın",
              "neyse boşver, biraz sakinleşmek istiyorum",
          ]

          def post(payload):
              data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=75) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  print(f"HTTP_ERROR {exc.code}: {body}")
                  raise

          for index, message in enumerate(messages, 1):
              payload = {
                  "userId": user_id,
                  "userName": "Tolga",
                  "userMessage": message,
                  "history": history,
                  "provider": "openrouter",
                  "sessionId": session_id,
                  "requestId": f"flash_lite_quality_{int(time.time())}_{index}",
                  "suppressRecentMemory": True,
              }
              status, result = post(payload)
              reply = str(result.get("reply") or "").strip()
              provider = result.get("providerUsed")
              print(f"TURN {index}")
              print(f"USER: {message}")
              print(f"TRANSPORT_PROVIDER: {provider}")
              print(f"MODEL_ROUTE: {expected_model}")
              print(f"KAIRA: {reply}")
              print(f"CONSISTENCY_ACCEPTED: {result.get('consistency', {}).get('accepted')}")
              print(f"RESPONSE_PLAN: {json.dumps(result.get('kdm', {}).get('responsePlan'), ensure_ascii=False)}")
              print("---")
              if status != 200 or not reply:
                  raise SystemExit(f"turn {index} failed: status={status}, reply={reply!r}")
              history.append({"sender": "user", "text": message, "participantName": "Tolga"})
              history.append({"sender": "kaira", "text": reply})

          print("LIVE_GEMINI_FLASH_LITE_QUALITY_SMOKE_COMPLETE")
          PY
