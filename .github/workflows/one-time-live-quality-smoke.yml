name: One-time Live Quality Smoke

on:
  push:
    branches:
      - codex/one-time-live-quality-smoke

jobs:
  live-quality-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run bounded Gemini Flash Lite live-quality matrix
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error

          base = "https://nexus-kairo-studio.onrender.com"
          expected_model = "google/gemini-2.5-flash-lite"
          with urllib.request.urlopen(base + "/api/runtime-info", timeout=45) as response:
              runtime = json.loads(response.read().decode("utf-8"))
          print("RUNTIME_INFO:")
          print(json.dumps(runtime, ensure_ascii=False, indent=2))
          if runtime.get("activeProvider") != "openrouter" or runtime.get("model") != expected_model:
              raise SystemExit(f"wrong live model route: {runtime}")

          scenarios = [
              ("third_party_uncertainty", [
                  "Mert bugün bana 'salak mısın sen' dedi, ben de cevap vermedim",
                  "sence Mert bana kızgın mı yoksa sadece sinirli miydi",
                  "neyse bunu kapatalım",
              ]),
              ("commitment_correction", [
                  "yarın işten istifa edeceğim, kararımı verdim",
                  "yok vazgeçtim, yarın istifa etmiyorum",
                  "peki yarın ne yapacağım",
              ]),
              ("fragmented_social_story", [
                  "bugün durakta bir kız gördüm",
                  "çok hoşuma gitti ama konuşamadım",
                  "yarın aynı saatte tekrar gideceğim galiba",
                  "sence gidip konuşmalı mıyım",
              ]),
          ]

          url = base + "/api/chat"

          def post(payload):
              data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  try:
                      parsed = json.loads(body)
                  except Exception:
                      parsed = {"error": body}
                  return exc.code, parsed

          failures = []
          for scenario_index, (name, messages) in enumerate(scenarios, 1):
              user_id = f"flash_lite_quality_{name}_20260915_b"
              session_id = f"session_{user_id}_{int(time.time())}"
              history = []
              print(f"=== SCENARIO {scenario_index}: {name} ===")
              for turn_index, message in enumerate(messages, 1):
                  payload = {
                      "userId": user_id,
                      "userName": "Tolga",
                      "userMessage": message,
                      "history": history,
                      "provider": "openrouter",
                      "sessionId": session_id,
                      "requestId": f"flash_lite_{name}_{int(time.time())}_{turn_index}",
                      "suppressRecentMemory": True,
                  }
                  status, result = post(payload)
                  reply = str(result.get("reply") or "").strip()
                  print(f"TURN {turn_index}")
                  print(f"USER: {message}")
                  print(f"HTTP_STATUS: {status}")
                  if status != 200:
                      error_text = str(result.get("error") or result)
                      print(f"DELIVERY_REJECTED: {error_text}")
                      print("---")
                      failures.append({"scenario": name, "turn": turn_index, "message": message, "status": status, "error": error_text})
                      break

                  plan = result.get("kdm", {}).get("responsePlan")
                  semantic_event = result.get("kdm", {}).get("semanticEvent")
                  semantic_interpretation = result.get("semanticInterpretation") or result.get("metadata", {}).get("semanticInterpretation")
                  print(f"TRANSPORT_PROVIDER: {result.get('providerUsed')}")
                  print(f"MODEL_ROUTE: {expected_model}")
                  print(f"KAIRA: {reply}")
                  print(f"CONSISTENCY_ACCEPTED: {result.get('consistency', {}).get('accepted')}")
                  print(f"RESPONSE_PLAN: {json.dumps(plan, ensure_ascii=False)}")
                  print(f"SEMANTIC_EVENT: {json.dumps(semantic_event, ensure_ascii=False)}")
                  print("---")
                  if not reply:
                      failures.append({"scenario": name, "turn": turn_index, "message": message, "status": status, "error": "empty_reply"})
                      break

                  history.append({
                      "sender": "user",
                      "text": message,
                      "participantName": "Tolga",
                      **({"semanticInterpretation": semantic_interpretation} if semantic_interpretation else {}),
                  })
                  history.append({"sender": "kaira", "text": reply})

          print("=== MATRIX SUMMARY ===")
          print(json.dumps({"failures": failures, "failureCount": len(failures)}, ensure_ascii=False, indent=2))
          print("LIVE_GEMINI_FLASH_LITE_MATRIX_COMPLETE")
          PY
