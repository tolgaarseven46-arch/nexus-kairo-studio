name: One-time Live Quality Smoke

on:
  push:
    branches:
      - codex/one-time-live-quality-smoke

jobs:
  runtime-provider-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect deployed runtime provider availability
        run: |
          python - <<'PY'
          import json, urllib.request
          url = "https://nexus-kairo-studio.onrender.com/api/runtime-info"
          with urllib.request.urlopen(url, timeout=45) as response:
              payload = json.loads(response.read().decode("utf-8"))
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
