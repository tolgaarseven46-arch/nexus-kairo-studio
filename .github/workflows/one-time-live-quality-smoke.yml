name: One-time Live Quality Smoke

on:
  push:
    branches:
      - codex/one-time-live-quality-smoke

jobs:
  live-quality-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Diagnose live response quality seams
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error

          base = "https://nexus-kairo-studio.onrender.com"
          expected_model = "google/gemini-2.5-flash-lite"
          with urllib.request.urlopen(base + "/api/runtime-info", timeout=45) as response:
              runtime = json.loads(response.read().decode("utf-8"))
          print("RUNTIME_INFO:", json.dumps(runtime, ensure_ascii=False))
          if runtime.get("activeProvider") != "openrouter" or runtime.get("model") != expected_model:
              raise SystemExit(f"wrong live model route: {runtime}")

          url = base + "/api/chat"

          def post(message, user_id, session_id, history, turn):
              payload = {
                  "userId": user_id,
                  "userName": "Tolga",
                  "userMessage": message,
                  "history": history,
                  "provider": "openrouter",
                  "sessionId": session_id,
                  "requestId": f"quality_diag_{int(time.time())}_{turn}",
                  "suppressRecentMemory": True,
              }
              data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers={"Content-Type": "application/json"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"HTTP {exc.code}: {body}")

          def show(label, message, result):
              interp = result.get("semanticInterpretation") or result.get("metadata", {}).get("semanticInterpretation") or {}
              kdm = result.get("kdm") or {}
              print(f"=== {label} ===")
              print("USER:", message)
              print("KAIRA:", result.get("reply"))
              print("CONSISTENCY:", json.dumps(result.get("consistency"), ensure_ascii=False))
              print("SEMANTIC_INTERPRETATION:", json.dumps(interp, ensure_ascii=False))
              print("SEMANTIC_EVENT:", json.dumps(kdm.get("semanticEvent"), ensure_ascii=False))
              print("RESPONSE_PLAN:", json.dumps(kdm.get("responsePlan"), ensure_ascii=False))
              print("DIALOGUE_DECISION:", json.dumps(kdm.get("dialogueDecision"), ensure_ascii=False))
              return interp

          # Hearsay: pre-AI should preserve uncertainty, while reply must not upgrade to certainty.
          history = []
          uid = "quality_diag_hearsay_20260915"
          sid = f"session_{uid}_{int(time.time())}"
          messages = [
              "Ali bana Mert'in benim hakkımda 'Tolga tam aptal' dediğini söyledi",
              "bunu Ali söyledi diye Mert'in gerçekten dediğinden emin olabilir miyiz",
          ]
          for i, message in enumerate(messages, 1):
              _, result = post(message, uid, sid, history, i)
              interp = show(f"HEARSAY_{i}", message, result)
              history.append({"sender": "user", "text": message, "participantName": "Tolga", **({"semanticInterpretation": interp} if interp else {})})
              history.append({"sender": "kaira", "text": str(result.get("reply") or "")})

          # Commitment cancellation: inspect whether current context knows the cancellation before realization.
          history = []
          uid = "quality_diag_commitment_20260915"
          sid = f"session_{uid}_{int(time.time())}"
          messages = [
              "galiba yarın müdürle konuşup istifa edeceğim",
              "yok karar verdim, istifa etmeyeceğim",
              "yarın istifa edecek miyim",
          ]
          for i, message in enumerate(messages, 1):
              _, result = post(message, uid, sid, history, i)
              interp = show(f"COMMITMENT_{i}", message, result)
              history.append({"sender": "user", "text": message, "participantName": "Tolga", **({"semanticInterpretation": interp} if interp else {})})
              history.append({"sender": "kaira", "text": str(result.get("reply") or "")})

          print("QUALITY_DIAG_COMPLETE")
          PY
