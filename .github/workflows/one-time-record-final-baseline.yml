name: One-time final baseline state record

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-record-final-baseline.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record final baseline and clean helpers
        run: |
          node scripts/one-time-record-final-baseline.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-record-final-baseline.mjs
          git rm .github/workflows/one-time-record-final-baseline.yml
          git add PROJECT_STATE.md
          git commit -m "docs(kaira): record final baseline hardening"
          git push
