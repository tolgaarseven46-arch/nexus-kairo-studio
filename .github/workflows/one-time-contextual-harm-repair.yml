name: One-time contextual relationship harm repair

on:
  push:
    branches:
      - fix/relationship-contextual-harm-confidence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/relationship-contextual-harm-confidence
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Apply canonical contextual-harm repair
        shell: python
        run: |
          from pathlib import Path

          # Typed config: contextual evidence must calibrate ordinary injury, not only hard redline.
          p = Path('src/services/relationshipReducerConfig.ts')
          s = p.read_text(encoding='utf-8')
          old = '''    goodHistoryAbsorb: number;\n    warmthDeltaBase: number;\n'''
          new = '''    goodHistoryAbsorb: number;\n    contextualJokingDampen: number;\n    contextualUncertaintyDampen: number;\n    warmthDeltaBase: number;\n'''
          if old not in s: raise SystemExit('injury interface anchor missing')
          s = s.replace(old, new, 1)
          old = '''    goodHistoryAbsorb: 0.35,\n    warmthDeltaBase: -3,\n'''
          new = '''    goodHistoryAbsorb: 0.35,\n    contextualJokingDampen: 0.8,\n    contextualUncertaintyDampen: 0.6,\n    warmthDeltaBase: -3,\n'''
          if old not in s: raise SystemExit('injury default anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('config/relationship-reducer.json')
          s = p.read_text(encoding='utf-8')
          old = '''    "goodHistoryAbsorb": 0.35,\n    "warmthDeltaBase": -3,\n'''
          new = '''    "goodHistoryAbsorb": 0.35,\n    "contextualJokingDampen": 0.8,\n    "contextualUncertaintyDampen": 0.6,\n    "warmthDeltaBase": -3,\n'''
          if old not in s: raise SystemExit('json injury anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Canonical reducer: distinguish raw semantic harm from contextually credible dyadic harm.
          p = Path('src/services/relationshipReducer.ts')
          s = p.read_text(encoding='utf-8')
          old = '''  const sevLoad = severityLoad(signal.severity);\n  const negativeEvidence =\n    signal.severity.disrespect >= 0.15 ||\n    signal.severity.coercion >= 0.15 ||\n    signal.severity.manipulation >= 0.15 ||\n    signal.severity.privacy >= 0.15 ||\n    signal.severity.aggression >= 0.2;\n  // Canonical severity is the harm authority. A directly Kaira-targeted turn\n  // with real present harm stays negative even if the coarse valence projection\n  // is neutral; ambiguous/third-party harm still does not mutate the dyad.\n  const targetedHarm = signal.targetsKaira && presentSeverityOf(signal.severity) >= 0.15;\n'''
          new = '''  const sevLoad = severityLoad(signal.severity);\n  const contextualHarmConfidence = clamp01(\n    (1 - config.injury.contextualJokingDampen * signal.jokingConfidence * (1 - signal.sincerityConfidence)) *\n      (1 - config.injury.contextualUncertaintyDampen * signal.uncertainty),\n  );\n  const contextualSeverity: SeverityVector = {\n    disrespect: signal.severity.disrespect * contextualHarmConfidence,\n    coercion: signal.severity.coercion * contextualHarmConfidence,\n    manipulation: signal.severity.manipulation * contextualHarmConfidence,\n    privacy: signal.severity.privacy * contextualHarmConfidence,\n    aggression: signal.severity.aggression * contextualHarmConfidence,\n  };\n  const contextualSeverityLoad = severityLoad(contextualSeverity);\n  rationale.push(`harm-context:${contextualHarmConfidence.toFixed(2)}`);\n  const negativeEvidence =\n    contextualSeverity.disrespect >= 0.15 ||\n    contextualSeverity.coercion >= 0.15 ||\n    contextualSeverity.manipulation >= 0.15 ||\n    contextualSeverity.privacy >= 0.15 ||\n    contextualSeverity.aggression >= 0.2;\n  // Canonical severity remains the raw harm evidence. Joking/sincerity/uncertainty\n  // determine how confidently low-level evidence should mutate the relationship.\n  // This is not lexical reinterpretation: all inputs are canonical v2 fields.\n  const targetedHarm = signal.targetsKaira && presentSeverityOf(contextualSeverity) >= 0.15;\n'''
          if old not in s: raise SystemExit('reducer classification anchor missing')
          s = s.replace(old, new, 1)
          old = '''  const severityScale = inj.severityFloor + inj.severityWeight * (kind === "negative" ? Math.max(sevLoad, signal.severity.disrespect) : 0);\n'''
          new = '''  const severityScale = inj.severityFloor + inj.severityWeight * (kind === "negative" ? Math.max(contextualSeverityLoad, contextualSeverity.disrespect) : 0);\n'''
          if old not in s: raise SystemExit('severityScale anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Durable regression separate from the red characterization.
          Path('src/services/kairaRelationshipContextualHarmRegression.test.ts').write_text('''import { describe, expect, it } from "vitest";\nimport { reduceRelationshipTurn, type RelationshipReducerPrev, type RelationshipTurnSignal } from "./relationshipReducer";\n\nconst prev: RelationshipReducerPrev = {\n  scores: { warmth: 45, trust: 46, conflict: 5, hurt: 9, repairProgress: 3, positiveEvents: 0, negativeEvents: 2, repeatedNegativeCount: 1 },\n  conversationState: "active", reactionMode: "irritated",\n  affect: { anger: 18, stress: 20, happiness: 67, calmness: 70 },\n  firstSeenAt: "2026-09-06T09:21:39.761Z", lastInteractionAt: "2026-09-06T09:24:10.172Z",\n  lastNegativePattern: "zorlama", interactionCount: 6,\n};\n\nconst baseSignal: RelationshipTurnSignal = {\n  valence: "neutral", targetsKaira: true,\n  severity: { disrespect: 0.2, coercion: 0, manipulation: 0, privacy: 0, aggression: 0 },\n  jokingConfidence: 0.8, sincerityConfidence: 0.5, apology: false, repairAttempt: false,\n  support: 0, compliment: 0, affection: 0.2, userStop: false, uncertainty: 0.32, negativePattern: "hakaret",\n};\n\ndescribe("contextual relationship harm regression", () => {\n  it("keeps low-severity high-joking uncertain dyadic evidence from becoming a negative event", () => {\n    const result = reduceRelationshipTurn({ prev, signal: baseSignal, timing: { elapsedMinutesSincePrev: 0.7, nowIso: "2026-09-06T09:24:50.081Z" } });\n    expect(result.scores.negativeEvents).toBe(2);\n    expect(result.scores.conflict).toBeLessThanOrEqual(5);\n    expect(result.scores.hurt).toBeLessThanOrEqual(9);\n    expect(result.lastNegativePattern).toBe("zorlama");\n    expect(result.rationale.some((item) => item.startsWith("harm-context:"))).toBe(true);\n  });\n\n  it("does not excuse genuine high-severity direct insult merely because some joking signal exists", () => {\n    const result = reduceRelationshipTurn({\n      prev,\n      signal: { ...baseSignal, valence: "negative", severity: { disrespect: 0.7, coercion: 0, manipulation: 0, privacy: 0, aggression: 0 }, jokingConfidence: 0.3, sincerityConfidence: 0.8, uncertainty: 0.3, negativePattern: "hakaret" },\n      timing: { elapsedMinutesSincePrev: 0.3, nowIso: "2026-09-06T09:29:45.226Z" },\n    });\n    expect(result.scores.negativeEvents).toBe(3);\n    expect(result.scores.conflict).toBeGreaterThan(5);\n    expect(result.scores.hurt).toBeGreaterThan(9);\n    expect(result.lastNegativePattern).toBe("hakaret");\n  });\n});\n''', encoding='utf-8')

          Path('docs/adr/0063-contextual-relationship-harm-confidence.md').write_text('''# ADR-0063 — Contextual confidence for relationship injury\n\n## Status\nAccepted\n\n## Context\nThe 2026-09-06 real-user Turn 7 had low disrespect (0.20), high joking confidence (0.80), nontrivial semantic uncertainty (0.32), direct Kaira targeting, and no explicit insult flag. The canonical reducer nevertheless recorded another negative event and `lastNegativePattern=hakaret`. Code inspection showed that `jokingConfidence`, `sincerityConfidence`, and uncertainty already reached `RelationshipReducer`, but only the hard-redline path consumed them. Ordinary injury classification used raw severity thresholds alone.\n\n## Decision\n- Keep canonical severity as raw harm evidence.\n- Add configurable contextual-harm confidence for ordinary relationship injury using existing canonical fields only: joking confidence, sincerity confidence, and interpretation uncertainty.\n- Scale ordinary injury evidence by this confidence before deciding whether low-level semantic harm is credible enough to mutate the dyadic relationship.\n- Preserve the existing hard-redline algorithm and its independent contextual dampening.\n- A genuine high-severity direct insult must remain harmful even if a modest joking signal exists.\n- No raw-text parse, phrase rule, regex, provider call, or second semantic authority is introduced.\n\n## Consequences\nPlayful/uncertain low-severity signals no longer automatically become durable relationship injury, while clear high-severity directed harm remains relationship-relevant. Turn 4 privacy ontology and Turn 5 character-boundary decline remain separate work-package candidates and are not silently folded into this repair.\n''', encoding='utf-8')

          state = Path('PROJECT_STATE.md')
          st = state.read_text(encoding='utf-8')
          note = '''\n\n## 2026-09-06 — Real-user replay: contextual relationship harm\n- After PR #115, the next bounded real-user gap was Turn 7: low disrespect (0.20) + high joking (0.80) + uncertainty (0.32) still became durable `hakaret` injury.\n- Current-main inspection proved canonical joking/sincerity/uncertainty already reach RelationshipReducer; the gap was inside ordinary injury classification, which used raw severity while only hard-redline consumed contextual dampening.\n- ADR-0063 applies configurable contextual-harm confidence to ordinary injury using canonical v2 fields only. Genuine high-severity direct insult remains harmful.\n- Turn 4 privacy ontology and Turn 5 boundary-decline-vs-harm are explicitly NOT claimed fixed by this package.\n- All characterization/regression/CI remains API-free.\n'''
          if '## 2026-09-06 — Real-user replay: contextual relationship harm' not in st:
              state.write_text(st.rstrip() + note + '\n', encoding='utf-8')

      - name: Focused API-free verification
        run: npx vitest run src/services/kairaRelationshipContextualHarmCharacterization.test.ts src/services/kairaRelationshipContextualHarmRegression.test.ts
      - name: Full tests
        run: npm test -- --run
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-contextual-harm-repair.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(kaira): contextualize relationship injury confidence"
          git push origin HEAD:fix/relationship-contextual-harm-confidence
