name: One-time world guard integration

on:
  push:
    paths:
      - scripts/integrate-world-guard.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded server integration
        run: node scripts/integrate-world-guard.mjs
      - name: Commit integration
        run: |
          if git diff --quiet -- server.ts; then
            echo "No server changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "feat(response): enforce grounded world-memory recall at runtime"
          git push origin HEAD:main
