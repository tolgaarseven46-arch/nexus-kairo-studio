name: One-time KNT semantic observability patch

on:
  push:
    branches: [chatgpt/knt-canonical-semantic-observability]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chatgpt/knt-canonical-semantic-observability
          fetch-depth: 0
      - name: Apply patch
        run: node scripts/patch-knt-semantic-observability.mjs
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/kdmPersistenceService.ts src/components/common/KntTurnDebugPanel.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(knt): persist canonical semantic observability"
          git push origin HEAD:chatgpt/knt-canonical-semantic-observability
