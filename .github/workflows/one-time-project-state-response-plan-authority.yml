name: One-time project state response plan authority

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-response-plan-authority.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 24. KairaResponsePlan final WHAT/WHETHER otoritesi — 2026-08-30\n- Canlı server response enforcement için `continueConversation`, `humorAllowed` ve `askQuestion` izinleri artık doğrudan canonical `responsePlan`dan gelir.\n- Client davranış entegrasyonunun personality içine yazdığı legacy `runtimeContinueConversation`, `runtimeHumorAllowed` ve `runtimeAskQuestion` değerleri server canlı yolunda canonical planı ikinci kez veto edemez.\n- Böylece `KairaResponsePlan`ın “TEK DAVRANIŞ OTORİTESİ” sözleşmesi ile final enforcement kodu aynı sınırda birleşti.\n- `kairoLocalLanguageEngine.ts` responsePlan verildiğinde planı öncelikli kullanır; legacy runtime flag fallback'i yalnız plan verilmeden yapılan doğrudan/geriye uyumlu çağrılar için kalabilir. Canlı server local yolunda responsePlan her zaman taşınır.\n- Client-side `behaviorIntegrationEngine` runtime alanlarını şimdilik personality/debug uyumluluğu için üretmeye devam edebilir; ancak final server WHAT/WHETHER otoritesi değildir. Bu alanların kalan tüketicileri ayrı audit konusudur.\n- `kairaResponsePlanFinalAuthorityContracts.test.ts` kalıcı `test:contracts` architecture suite'ine eklendi.\n- Geçici response-plan final-authority migration workflow/script başarıyla uygulandıktan sonra kaldırıldı.\n- Entegrasyon commit'i: `f0c956f` (`feat(kaira): make response plan final behavior authority`). Entegrasyon workflow'unda authority contract, TypeScript, full test suite ve production build başarıyla geçti.\n'''
          if '## 24. KairaResponsePlan final WHAT/WHETHER otoritesi — 2026-08-30' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record response plan final authority"
          git pull --rebase origin main
          git push origin main
