name: One-time behavior profile authority

on:
  push:
    paths:
      - ".github/workflows/one-time-behavior-profile-authority.yml"
      - "scripts/applyBehaviorProfileAuthority.mjs"
      - "src/services/kairaBehaviorProfileAuthorityContracts.test.ts"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply behavior profile authority
        run: node scripts/applyBehaviorProfileAuthority.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Authority contract
        run: npm test -- --run src/services/kairaBehaviorProfileAuthorityContracts.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- server.ts src/services/droitChatService.ts; then
            echo "behavior profile authority already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/droitChatService.ts
          git commit -m "feat(kaira): make KDM behavior profile authoritative"
          git pull --rebase origin main
          git push origin main
