name: One-time affective repair wiring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-affective-repair-wiring.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire affective repair gate and clean helpers
        run: |
          node scripts/one-time-affective-repair-wiring.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-affective-repair-wiring.mjs
          git rm .github/workflows/one-time-affective-repair-wiring.yml
          git add src/services/kairoResponseConsistency.ts server.ts
          git commit -m "fix(kaira): route qualitative reaction issues through repair"
          git push
