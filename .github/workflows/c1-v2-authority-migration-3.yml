name: C1 V2 Authority Migration 3
on:
  push:
    branches: [chatgpt/c1-single-semantic-authority]
    paths: [.github/workflows/c1-v2-authority-migration-3.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/c1-single-semantic-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --ignore-scripts
      - name: Apply v2 authority transport
        shell: python
        run: |
          from pathlib import Path

          def patch(path, pairs):
              p=Path(path); s=p.read_text()
              for old,new in pairs:
                  if old not in s:
                      raise SystemExit(f"missing {path}: {old[:120]!r}")
                  s=s.replace(old,new)
              p.write_text(s)

          # Explicit regex fallback is a v2 producer. Preserve fields already known
          # by the legacy fallback event; do not make downstream derive them again.
          patch('src/services/semanticInterpretationLegacyProjection.ts', [
            ('target: hostility.target,\n      valence: event.valence,', 'target: hostility.target === "unknown" ? targetFromLegacy(event.target) : hostility.target,\n      valence: event.valence,'),
            ('stopRequest: Boolean(event.stopTalking || event.stopQuestions),\n      uncertainty:', 'stopRequest: Boolean(event.stopTalking || event.stopQuestions),\n      discourseFacets: {\n        socialRoutine: event.socialRoutine ?? "none",\n        discourseAct: event.discourseAct ?? "none",\n        repairSignal: event.repairSignal ?? "none",\n        adviceRequested: event.adviceRequested ?? false,\n        knowledgeQuery: event.knowledgeQuery ?? null,\n        selfMemoryQuery: event.selfMemoryQuery ?? null,\n        relationalAct: event.relationalAct,\n        relationalIntensity: clamp01(event.relationalIntensity ?? 0),\n        stopQuestions: Boolean(event.stopQuestions),\n        stopTalking: Boolean(event.stopTalking),\n      },\n      uncertainty:'),
          ])

          patch('server.ts', [
            ('semanticEvent: incomingSemanticEvent,\n      behaviorPolicy:', 'semanticInterpretation: incomingSemanticInterpretation,\n      behaviorPolicy:'),
            ('incomingSemanticEvent,\n      context:', 'incomingSemanticInterpretation,\n      context:'),
            ('const canonicalSemantic = {\n      event: languageUnderstanding.event,\n      source: languageUnderstanding.semanticSource,\n    };', 'const canonicalSemantic = {\n      interpretation: languageUnderstanding.interpretation,\n      event: languageUnderstanding.event,\n      source: languageUnderstanding.semanticSource,\n    };'),
            ('semanticEvent: canonicalSemantic.event,\n', 'semanticInterpretation: canonicalSemantic.interpretation,\n        semanticEvent: canonicalSemantic.event,\n'),
          ])

          Path('src/services/clientLanguageUnderstanding.ts').write_text('''import type { SemanticEvent } from "./semanticEventEngine";\nimport type { SemanticInterpretation } from "../types/semanticInterpretation";\n\nexport interface ClientLanguageUnderstandingResult {\n  interpretation: SemanticInterpretation;\n  event: SemanticEvent;\n  semanticSource: string;\n  semanticProvider?: string;\n  morphologyProvider?: string;\n  morphology?: unknown;\n  warnings?: string[];\n}\n\nexport async function requestCanonicalLanguageUnderstanding(input: {\n  message: string;\n  userName?: string;\n  characterName?: string;\n  recentMessages?: Array<{ role: "user" | "assistant"; content: string }>;\n  provider?: "gemini" | "openrouter";\n}): Promise<ClientLanguageUnderstandingResult> {\n  const response = await fetch("/api/language-understanding", {\n    method: "POST",\n    headers: { "Content-Type": "application/json" },\n    body: JSON.stringify({\n      userMessage: input.message,\n      userName: input.userName || "Kullanıcı",\n      characterName: input.characterName || "KAIRO",\n      history: input.recentMessages || [],\n      provider: input.provider || "openrouter",\n    }),\n  });\n  const data = await response.json().catch(() => ({}));\n  if (!response.ok || !data?.interpretation || !data?.event) {\n    throw new Error(data?.error || `Dil anlama servisi hatası: ${response.status}`);\n  }\n  return {\n    interpretation: data.interpretation as SemanticInterpretation,\n    event: data.event as SemanticEvent,\n    semanticSource: String(data.semanticSource || "unknown"),\n    semanticProvider: data.semanticProvider,\n    morphologyProvider: data.morphologyProvider,\n    morphology: data.morphology,\n    warnings: Array.isArray(data.warnings) ? data.warnings : [],\n  };\n}\n''')

          patch('src/services/kairoConversationGrounding.ts', [
            ('import type { SemanticEvent } from "./semanticEventEngine";', 'import type { SemanticInterpretation } from "../types/semanticInterpretation";'),
            ('semanticEvent?: SemanticEvent;', 'semanticInterpretation?: SemanticInterpretation;'),
          ])

          patch('src/types/nexus.ts', [
            ("export type NexusTab =", "import type { SemanticInterpretation } from './semanticInterpretation';\n\nexport type NexusTab ="),
            ('activityPermissionRequestId?: string; semanticEvent?: unknown; semanticSource?: string;', 'activityPermissionRequestId?: string; semanticInterpretation?: SemanticInterpretation; semanticSource?: string;'),
            ('semanticEvent?: unknown;\n    semanticSource?: string;', 'semanticInterpretation?: SemanticInterpretation;\n    semanticEvent?: unknown;\n    semanticSource?: string;'),
          ])

          patch('src/services/droitChatService.ts', [
            ('import { interpretSemanticEvent, type SemanticEvent } from "./semanticEventEngine";', 'import type { SemanticEvent } from "./semanticEventEngine";\nimport { interpretationFromRegexFloor } from "./semanticInterpretationLegacyProjection";\nimport { projectSemanticEvent } from "./semanticInterpretationProjection";'),
            ('languageUnderstanding = {\n        event: interpretSemanticEvent(userMessage),', 'const interpretation = interpretationFromRegexFloor(userMessage);\n      languageUnderstanding = {\n        interpretation,\n        event: projectSemanticEvent(interpretation),'),
            ('const payload = { sessionId: resolvedSessionId, requestId, userId, userName, userMessage, semanticEvent,', 'const payload = { sessionId: resolvedSessionId, requestId, userId, userName, userMessage, semanticInterpretation: languageUnderstanding.interpretation, semanticEvent,'),
            ('semanticEvent: m.semanticEvent, semanticSource: m.semanticSource', 'semanticInterpretation: m.semanticInterpretation, semanticSource: m.semanticSource'),
            ('const canonicalSemanticEvent = (data.kdm?.semanticEvent as SemanticEvent | undefined) ?? semanticEvent;', 'const canonicalSemanticInterpretation = data.kdm?.semanticInterpretation ?? languageUnderstanding.interpretation;\n      const canonicalSemanticEvent = (data.kdm?.semanticEvent as SemanticEvent | undefined) ?? semanticEvent;'),
            ('semanticEvent: canonicalSemanticEvent,\n        semanticSource,', 'semanticInterpretation: canonicalSemanticInterpretation,\n        semanticEvent: canonicalSemanticEvent,\n        semanticSource,'),
            ('languageUnderstanding: { ...languageUnderstanding, event: canonicalSemanticEvent }', 'languageUnderstanding: { ...languageUnderstanding, interpretation: canonicalSemanticInterpretation, event: canonicalSemanticEvent }'),
          ])

          patch('src/services/kdmPersistenceService.ts', [
            ('semanticEvent?: unknown;\n    semanticSource?: string;', 'semanticInterpretation?: unknown;\n    semanticEvent?: unknown;\n    semanticSource?: string;'),
            ('semanticEvent: turn.metadata?.semanticEvent,', 'semanticInterpretation: turn.metadata?.semanticInterpretation,'),
          ])

          patch('src/components/studio/NexusStudioLayout.tsx', [
            ('semanticEvent: response.languageUnderstanding?.event,', 'semanticInterpretation: response.languageUnderstanding?.interpretation,'),
          ])

          patch('src/services/discourseStateReducer.ts', [
            ('import type { SemanticEvent } from "./semanticEventEngine";', 'import type { SemanticEvent } from "./semanticEventEngine";\nimport type { SemanticInterpretation } from "../types/semanticInterpretation";\nimport { projectSemanticEvent } from "./semanticInterpretationProjection";'),
            ('Historical user turns MUST carry their ingestion-time SemanticEvent;', 'Historical user turns MUST carry their ingestion-time SemanticInterpretation@2;'),
            ('history: Array<{ sender?: string; text?: string; semanticEvent?: SemanticEvent }>,', 'history: Array<{ sender?: string; text?: string; semanticInterpretation?: SemanticInterpretation }>, '),
            ('if (!raw.semanticEvent) continue;\n      state = reduceDiscourseState(state, {\n        actor: "user",\n        message: text,\n        event: raw.semanticEvent,\n      });', 'if (!raw.semanticInterpretation) continue;\n      state = reduceDiscourseState(state, {\n        actor: "user",\n        message: text,\n        event: projectSemanticEvent(raw.semanticInterpretation),\n      });'),
          ])

          # Regression fixtures simulate ingestion once; they are not runtime reparsers.
          patch('src/services/kairaFoundationFirstConversationRegression.test.ts', [
            ('import { interpretSemanticEvent } from "./semanticEventEngine";', 'import { interpretSemanticEvent } from "./semanticEventEngine";\nimport { interpretationFromLegacyEvent } from "./semanticInterpretationLegacyProjection";'),
            ('semanticEvent: event } as ConversationTurn', 'semanticInterpretation: interpretationFromLegacyEvent(event, msg) } as ConversationTurn'),
          ])
          patch('src/services/kairoLocalLanguageEngineAuthority.test.ts', [
            ('import { interpretSemanticEvent } from "./semanticEventEngine";', 'import { interpretSemanticEvent } from "./semanticEventEngine";\nimport { interpretationFromLegacyEvent } from "./semanticInterpretationLegacyProjection";'),
            ('semanticEvent: interpretSemanticEvent(turn.text)', 'semanticInterpretation: interpretationFromLegacyEvent(interpretSemanticEvent(turn.text), turn.text)'),
          ])
          patch('src/services/kairaRuntimeBehaviorLongSessionRegression.test.ts', [
            ('import { interpretSemanticEvent } from "./semanticEventEngine";', 'import { interpretSemanticEvent } from "./semanticEventEngine";\nimport { interpretationFromLegacyEvent } from "./semanticInterpretationLegacyProjection";'),
            ('semanticEvent: interpretSemanticEvent(turn.text)', 'semanticInterpretation: interpretationFromLegacyEvent(interpretSemanticEvent(turn.text), turn.text)'),
          ])
          patch('src/services/discourseStateReducer.test.ts', [
            ('import { interpretSemanticEvent } from "./semanticEventEngine";', 'import { interpretSemanticEvent } from "./semanticEventEngine";\nimport { interpretationFromLegacyEvent } from "./semanticInterpretationLegacyProjection";'),
            ('{ sender: "user", text: "naber", semanticEvent: interpretSemanticEvent("naber") }', '{ sender: "user", text: "naber", semanticInterpretation: interpretationFromLegacyEvent(interpretSemanticEvent("naber"), "naber") }'),
          ])

          Path('src/services/kairaSemanticInterpretationV2AuthorityContracts.test.ts').write_text('''import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\nimport { createLlmSemanticUnderstandingProvider } from "./llmSemanticUnderstandingProvider";\nimport { projectSemanticEvent } from "./semanticInterpretationProjection";\nimport { SEMANTIC_INTERPRETATION_SCHEMA_VERSION } from "../types/semanticInterpretation";\n\nconst v2: any = {\n schemaVersion: SEMANTIC_INTERPRETATION_SCHEMA_VERSION, raw:"x", normalized:"x", primaryIntent:"complaint", secondarySocialActs:[], target:"kaira", valence:"negative",\n severity:{disrespect:.2,coercion:0,manipulation:0,privacy:0,aggression:.25}, jokingConfidence:.4, sincerityConfidence:.7, affection:.1, support:0, compliment:0, emotionalLoad:.3, apology:false, repairAttempt:false, stopRequest:false,\n discourseFacets:{socialRoutine:"none",discourseAct:"confusion_or_challenge",repairSignal:"clarification_request",adviceRequested:false,knowledgeQuery:null,selfMemoryQuery:null,relationalAct:"none",relationalIntensity:.2,stopQuestions:false,stopTalking:false},\n uncertainty:{overall:.3,intent:.2,target:.2,severity:.4}, evidence:[{source:"llm",cues:["complaint"],confidence:.7}]\n};\n\ndescribe("SemanticInterpretation@2 canonical authority",()=>{\n it("LLM producer emits v2",async()=>{const p=createLlmSemanticUnderstandingProvider({generate:async()=>JSON.stringify(v2)});const r=await p.interpret({message:"kafamı karıştırdın kankam"});expect(r.schemaVersion).toBe(SEMANTIC_INTERPRETATION_SCHEMA_VERSION);expect(r.severity.aggression).toBe(.25);expect(r.discourseFacets.repairSignal).toBe("clarification_request");});\n it("projection has no parser/regex authority",()=>{const s=readFileSync(new URL("./semanticInterpretationProjection.ts",import.meta.url),"utf8");expect(s).not.toMatch(/interpretSemanticEvent|interpretationFromRegexFloor|RegExp|\\.test\\(/u);});\n it("projection ignores raw wording",()=>{const neutral={...v2,primaryIntent:"smalltalk",secondarySocialActs:[],severity:{disrespect:0,coercion:0,manipulation:0,privacy:0,aggression:0}};expect(projectSemanticEvent({...neutral,raw:"aptalsın"}).insult).toBe(false);expect(projectSemanticEvent({...neutral,raw:"orospu"}).insult).toBe(false);});\n it("normal language gateway does not accept SemanticEvent as incoming canonical authority",()=>{const s=readFileSync(new URL("./languageUnderstandingService.ts",import.meta.url),"utf8");expect(s).not.toContain("incomingSemanticEvent");expect(s).toContain("incomingSemanticInterpretation");});\n});\n''')

          for wf in [
            '.github/workflows/c1-v2-authority-migration.yml',
            '.github/workflows/c1-v2-authority-migration-2.yml',
            '.github/workflows/c1-v2-authority-migration-3.yml',
          ]:
              if Path(wf).exists(): Path(wf).unlink()
      - name: Focused validation
        run: |
          npx vitest run \
            src/services/kairaSemanticInterpretationV2AuthorityContracts.test.ts \
            src/services/llmSemanticUnderstandingProvider.test.ts \
            src/services/languageUnderstandingService.test.ts \
            src/services/serverLanguageUnderstanding.test.ts \
            src/services/kairaCanonicalSemanticHistoryAuthorityContracts.test.ts \
            src/services/kairaCanonicalSemanticHistoryGoldenSessionRegression.test.ts \
            src/services/discourseStateReducer.test.ts \
            src/services/kairaFoundationFirstConversationRegression.test.ts \
            src/services/kairoLocalLanguageEngineAuthority.test.ts \
            src/services/kairaRuntimeBehaviorLongSessionRegression.test.ts
          npx tsc --noEmit
      - name: Commit migration
        run: |
          git config user.name chatgpt-kaira
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(semantic): promote SemanticInterpretation v2 authority'
          git push origin HEAD:chatgpt/c1-single-semantic-authority
