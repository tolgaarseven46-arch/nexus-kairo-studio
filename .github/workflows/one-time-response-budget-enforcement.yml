name: One-time response budget enforcement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-response-budget-enforcement.yml'

permissions:
  contents: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply budget enforcement and clean helpers
        run: |
          node scripts/one-time-response-budget-enforcement.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-response-budget-enforcement.mjs
          git rm .github/workflows/one-time-response-budget-enforcement.yml
          git add src/services/kairoResponseConsistency.ts server.ts
          git commit -m "fix(kaira): enforce final response length budgets"
          git push
