name: One-time expression wordplay fine-tune

on:
  push:
    paths:
      - ".github/workflows/one-time-expression-wordplay-finetune.yml"
      - "scripts/applyExpressionWordplayFineTuneWiring.mjs"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire wordplay fine-tune
        run: node scripts/applyExpressionWordplayFineTuneWiring.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Wordplay contracts
        run: npm test -- --run src/services/kairaExpressionWordplayFineTuneContracts.test.ts src/services/behaviorIntegrationEngine.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- src/services/expressionStyleEngine.ts src/services/kairaExpressionWordplayFineTuneContracts.test.ts; then
            echo "wordplay fine-tune wiring already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/expressionStyleEngine.ts src/services/kairaExpressionWordplayFineTuneContracts.test.ts
          git commit -m "fix(kaira): wire wordplay fine-tune into expression runtime"
          git pull --rebase origin main
          git push origin main
