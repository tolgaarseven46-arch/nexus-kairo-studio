name: One-time Topic-local Closure Fix

on:
  push:
    branches:
      - fix/topic-local-closure-semantics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/topic-local-closure-semantics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Apply topic-local closure invariant
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/llmSemanticUnderstandingProvider.ts')
          s = p.read_text()
          old = '- "soru sorma artık" = stopQuestions:true, stopTalking:false, stopRequest:false ve secondarySocialActs içinde stop_request YOK. "sus artık", "konuşma artık" = stopTalking:true + stopRequest:true; stop_request secondary act yalnız tam konuşmayı durdurma anlamı varsa kullanılabilir. stopQuestions yalnız mesaj ayrıca soruları da durduruyorsa true.\n'
          new = old + '- Konu/başlık kapatma yalnız mevcut konuyu sonlandırır: "boşver bu konuyu", "konuyu kapatalım", "bunu geçelim" gibi topic-local closure = discourseAct:topic_shift + stopQuestions:false + stopTalking:false + stopRequest:false. Kullanıcı ayrıca "başka şey konuşalım" demese bile bunu tüm sohbeti durdurma olarak yükseltme. Full conversation stop yalnız Kaira’nın konuşmasını/sohbetin tamamını açıkça durduruyorsa kullanılır.\n'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  const stopTalking = interpretation.discourseFacets.stopTalking;\n  const secondarySocialActs = stopTalking\n    ? interpretation.secondarySocialActs\n    : interpretation.secondarySocialActs.filter((act) => act !== "stop_request");\n'''
          new = '''  const topicLocalClosure = interpretation.discourseFacets.discourseAct === "topic_shift";\n  const stopTalking = topicLocalClosure ? false : interpretation.discourseFacets.stopTalking;\n  const stopQuestions = topicLocalClosure ? false : interpretation.discourseFacets.stopQuestions;\n  const secondarySocialActs = stopTalking\n    ? interpretation.secondarySocialActs\n    : interpretation.secondarySocialActs.filter((act) => act !== "stop_request");\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    discourseFacets: {\n      ...interpretation.discourseFacets,\n      repairSignal,\n    },\n'''
          new = '''    discourseFacets: {\n      ...interpretation.discourseFacets,\n      repairSignal,\n      stopQuestions,\n      stopTalking,\n    },\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          cat > src/services/llmSemanticTopicClosure.test.ts <<'EOF'
          import { describe, expect, it, vi } from 'vitest';
          import type { SemanticInterpretation } from '../types/semanticInterpretation';
          import { createLlmSemanticUnderstandingProvider } from './llmSemanticUnderstandingProvider';

          function base(overrides: Partial<SemanticInterpretation> = {}): SemanticInterpretation {
            return {
              schemaVersion: 'semantic-interpretation@2', raw: 'x', normalized: 'x', primaryIntent: 'other', secondarySocialActs: [], target: 'unknown', valence: 'neutral',
              severity: { disrespect: 0, coercion: 0, manipulation: 0, privacy: 0, aggression: 0 }, jokingConfidence: 0, sincerityConfidence: 0.9,
              affection: 0, support: 0, compliment: 0, emotionalLoad: 0, apology: false, repairAttempt: false, stopRequest: false,
              discourseFacets: { socialRoutine: 'none', discourseAct: 'none', repairSignal: 'none', adviceRequested: false, knowledgeQuery: null, selfMemoryQuery: null, relationalAct: 'none', relationalIntensity: 0, stopQuestions: false, stopTalking: false },
              uncertainty: { overall: 0.2, intent: 0.2, target: 0.2, severity: 0.2 }, evidence: [], ...overrides,
            };
          }

          describe('topic-local closure semantic invariant', () => {
            it('topic_shift cannot become a full conversation stop', async () => {
              const generated = base({
                raw: 'konuyu kapatalım', normalized: 'konuyu kapatalım', primaryIntent: 'command', target: 'event', secondarySocialActs: ['stop_request'], stopRequest: true,
                discourseFacets: { socialRoutine: 'none', discourseAct: 'topic_shift', repairSignal: 'none', adviceRequested: false, knowledgeQuery: null, selfMemoryQuery: null, relationalAct: 'none', relationalIntensity: 0.1, stopQuestions: true, stopTalking: true },
              });
              const generate = vi.fn().mockResolvedValue(JSON.stringify(generated));
              const result = await createLlmSemanticUnderstandingProvider({ generate }).interpret({ message: 'konuyu kapatalım' });
              expect(result.discourseFacets.discourseAct).toBe('topic_shift');
              expect(result.discourseFacets.stopTalking).toBe(false);
              expect(result.discourseFacets.stopQuestions).toBe(false);
              expect(result.stopRequest).toBe(false);
              expect(result.secondarySocialActs).not.toContain('stop_request');
            });

            it('preserves an actual full stop request', async () => {
              const generated = base({
                raw: 'sus artık', normalized: 'sus artık', primaryIntent: 'command', target: 'kaira', secondarySocialActs: ['stop_request'], stopRequest: true,
                discourseFacets: { socialRoutine: 'none', discourseAct: 'none', repairSignal: 'none', adviceRequested: false, knowledgeQuery: null, selfMemoryQuery: null, relationalAct: 'challenge', relationalIntensity: 0.5, stopQuestions: false, stopTalking: true },
              });
              const generate = vi.fn().mockResolvedValue(JSON.stringify(generated));
              const result = await createLlmSemanticUnderstandingProvider({ generate }).interpret({ message: 'sus artık' });
              expect(result.discourseFacets.stopTalking).toBe(true);
              expect(result.stopRequest).toBe(true);
              expect(result.secondarySocialActs).toContain('stop_request');
            });
          });
          EOF

          cat > docs/adr/0016-topic-local-closure-is-not-conversation-stop.md <<'EOF'
          # ADR-0016: Topic-local closure is not conversation-level stop

          ## Status
          Accepted

          ## Context
          A fresh-user 15-turn production chat showed `boşver kapatalım konuyu` being interpreted as `stopTalking:true`, which pushed the canonical relationship reducer into `disengaged`. Production language-understanding characterization showed the same parser correctly used `topic_shift` when the user explicitly added `başka şey konuşalım`.

          ## Decision
          Existing `discourseAct: topic_shift` is the authority for topic-local closure. A topic shift cannot simultaneously mean full conversation stop. Provider normalization therefore forces `stopTalking:false`, `stopQuestions:false`, `stopRequest:false`, and removes `stop_request` whenever `discourseAct` is `topic_shift`.

          The semantic-provider instruction also states that topic/object closure remains local even when the user does not explicitly propose a replacement topic.

          ## Consequences
          - `boşver bu konuyu` / `konuyu kapatalım` do not disengage the relationship solely because the topic is being closed.
          - Explicit conversation-level stop such as `sus artık` remains a full stop.
          - No raw-text stop parser is added downstream.
          EOF

          rm -f .github/workflows/one-time-topic-local-closure-fix.yml
          npm test -- --run src/services/llmSemanticTopicClosure.test.ts
          npx tsc --noEmit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(semantic): keep topic closure local [topic-closure-applied]'
          git push origin HEAD:fix/topic-local-closure-semantics
