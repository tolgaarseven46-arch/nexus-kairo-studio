name: One-time project state conversation lock

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-conversation-lock.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 31. Conversation state lock projection — 2026-08-31\n- Eski `conversationStateAuthority` canlı response yolundaki personality passthrough rolünden çıkarıldı. Yeni `conversationStateLock` saf projection yalnız `state`, `locked` ve `reason` üretir; personality payload taşımaz ve trait mutasyonu yapamaz.\n- Server KDM sonrası `conversationStateLock = projectConversationStateLock(kdm.nextDynamicState)` üretir. Response HOW shaping için per-turn `responsePersonality` doğrudan `responseStylePersonality` olarak kullanılır; state-lock katmanı HOW traitlerini değiştirmez.\n- Base personality sahipliği korunur: `analyzeKdmInteraction` yalnız `basePersonality` + explicit `behaviorPolicy` alır. Per-turn response overlay KDM reducer inputuna girmez.\n- State→behavior seam artık `stateLock` ile doğrulanır; legacy `authority` test/input terminolojisi kaldırıldı. Property ve multi-turn sequence contractları da yeni projection'a taşındı.\n- World-state appraisal/reasoning evidence KDM state mutation inputunun dışında kalmaya devam eder; integration contract markerları state-lock sınırına güncellendi.\n- Dış debug/API compatibility için `kdm.conversationAuthority` alan adı şimdilik korunur, fakat içeriği yeni `conversationStateLock` projection'ından gelir. Bu compatibility adı yeni authority katmanı olduğu anlamına gelmez.\n- `kairaConversationStateLockContracts.test.ts` kalıcı `test:contracts` suite'ine eklendi.\n- Entegrasyon commit'i: `db0ae1a` (`refactor(kaira): reduce conversation authority to state lock`). State-lock contract, TypeScript, 508/508 test ve production build başarıyla geçti. Geçici migration workflow/script kaldırıldı.\n- Sonraki audit adayı: `src/services/conversationStateAuthority.ts` dosyası ve `conversationAuthority` compatibility metadata adı. Repo çapında gerçek consumer bulunmadan dosya/alan kaldırılmayacak.\n'''
          if '## 31. Conversation state lock projection — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record conversation state lock projection"
          git pull --rebase origin main
          git push origin main
