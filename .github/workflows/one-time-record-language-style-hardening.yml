name: One-time record language-style hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record language-style hardening state
        shell: bash
        run: |
          cat >> PROJECT_STATE.md <<'EOF'


## 104. Learned language HOW loop and reply-level evidence — 2026-08-31
- Persistent language-memory now exposes a safe derived HOW-only signal to the AI path without replaying raw prior replies, topics or memories.
- The derived signal contains only maturity, bounded preferred discourse markers and recent average response length. The prompt explicitly keeps ResponsePlan permissions and SpeechIdentity relationship/register limits above learned style.
- Learned marker evidence is reply-level: repeating the same marker multiple times inside one accepted reply counts as one evidence step; a learned marker requires evidence across separate accepted replies.
- Canonical language-style observability remains available in KNT/test-session metadata.
- CI #1179 and #1181 passed architecture contracts, full tests, TypeScript and production build.

## 105. Bounded self-reinforcing language drift — 2026-08-31
- Learned word growth is capped relative to each word's base weight (`MAX_LEARNED_WORD_DELTA=2.1`), preventing accepted self-generated replies from amplifying a marker without bound.
- Existing recency penalties remain separate from learned style affinity, so style can stabilize without forcing immediate exact-repeat loops.
- A deterministic 200-turn self-training regression verifies at least four distinct responses survive, consecutive exact duplicates stay at zero and the most frequent candidate remains at or below 45 percent of the run.
- Single-reply repeated marker tokens remain one evidence step under the same long-run test.
- Core self-reinforcement CI #1183 and long-run selection-level CI for commit `54d7c86` passed architecture contracts, full tests, TypeScript and production build.

## 106. Learned style stays below relationship HOW authority — 2026-08-31
- SpeechIdentity remains the canonical relationship HOW source. Learned language style cannot reopen a closeness surface that current relationship state does not permit.
- In rhythm-sensitive social moves, `kanka` is treated as a close-only address surface: new/familiar relationship levels flag it for the existing repair chain, while close relationships may use it naturally.
- Factual/non-social moves are exempt so quoted or explanatory uses of the word are not incorrectly blocked.
- The canonical `speech.relationshipLevel` is passed through all five AI rhythm validation seams: initial draft, repaired draft, grounded fallback, world-guard revised reply and plan-safe fallback.
- Product commits: `04790ac`, `fe73611`; regression/integration commits: `bd40744`, `8026a4b`, `05f83a8`.
- Final CI #1189 passed architecture contracts, 825/825 tests, TypeScript and production build.

### Next verified development question
- Audit long-term language-memory evidence quality across context changes: learned style should remain stable without letting stale context-specific wording or relationship-specific address forms dominate after the conversational context changes.
EOF
          rm .github/workflows/one-time-record-language-style-hardening.yml
