name: one-time-kaira-autonomous-state-chat-wiring
on:
  push:
    paths:
      - ".github/workflows/one-time-kaira-autonomous-state-chat-wiring.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/patch-kaira-autonomous-state-chat-wiring.mjs
      - name: Commit autonomous state chat wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git diff --cached --quiet && exit 1
          git commit -m "feat(kaira): project chat state into autonomous life"
          git push
