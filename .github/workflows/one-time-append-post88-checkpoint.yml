name: One-time Append Post88 Checkpoint

on:
  push:
    branches:
      - docs/post88-conversation-quality-checkpoint

permissions:
  contents: write

jobs:
  append:
    if: ${{ !contains(github.event.head_commit.message, '[post88-checkpoint-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/post88-conversation-quality-checkpoint
          fetch-depth: 0
      - name: Append checkpoint
        run: python .github/scripts/append_post88_checkpoint.py
      - name: Commit checkpoint and clean harness
        run: |
          git rm .github/workflows/one-time-append-post88-checkpoint.yml
          git rm .github/scripts/append_post88_checkpoint.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_STATE.md
          git commit -m 'docs: record post88 conversation quality checkpoint [post88-checkpoint-applied]'
          git push origin HEAD:docs/post88-conversation-quality-checkpoint
