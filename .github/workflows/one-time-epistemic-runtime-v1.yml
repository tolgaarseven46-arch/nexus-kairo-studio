name: one-time-epistemic-runtime-v1
on:
  push:
    paths:
      - '.github/workflows/one-time-epistemic-runtime-v1.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Apply epistemic runtime migration
        run: node scripts/one-time-epistemic-runtime-v1.cjs
      - name: Focused regressions
        run: npx vitest run src/services/kairaEpistemicGateContracts.test.ts src/services/kairaEpistemicResponsePolicy.test.ts src/services/kairaKnowledgeProfileStore.test.ts src/services/kairaEpistemicRuntimeContracts.test.ts src/services/kairaContractRegistry.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Commit product and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-epistemic-runtime-v1.yml scripts/one-time-epistemic-runtime-v1.cjs
          git add server.ts package.json src/services/semanticEventEngine.ts src/services/semanticEventAuthority.ts src/services/semanticEventCanonicalizer.ts src/services/llmSemanticUnderstandingProvider.ts src/services/kdmPersistenceService.ts src/services/droitChatService.ts src/services/kairaEpistemicRuntimeContracts.test.ts
          git commit -m "feat(kaira): wire canonical epistemic runtime"
          git push
