name: one-time-reciprocal-canonicalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-reciprocal-canonicalization.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Refine reciprocal routine at canonical boundary
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Focused regressions
        run: npx vitest run src/services/semanticEventCanonicalizer.test.ts src/services/semanticEventEngine.test.ts src/services/kairaBetaConversationContinuityRegression.test.ts src/services/kairaSession0209Regression.test.ts src/services/kairaTurnTakingSocialRoutineContracts.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/semanticEventEngine.ts src/services/semanticEventCanonicalizer.ts src/services/semanticEventCanonicalizer.test.ts src/services/kairaSession0209Regression.test.ts
          git rm .github/workflows/one-time-reciprocal-canonicalization.yml
          git commit -m "fix(kaira): refine reciprocal routines at canonical boundary"
          git push origin main
