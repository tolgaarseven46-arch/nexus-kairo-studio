name: One-time project state preference downstream coverage

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-preference-downstream-coverage.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 60. Preference full downstream coverage — 2026-08-31\n- The CharacterTab preference family was audited as a complete downstream system. All six preference sliders are now explicitly covered: novelty, complexity, intensity, depth, playfulness and competition.\n- Added permanent `kairaPreferenceDownstreamCoverageContracts.test.ts`. It verifies exact CharacterTab key mapping and proves each preference reaches downstream engagement, depth/response-length or overstimulation behavior in a semantically matching context.\n- Novelty changes exploration and final engagement. Complexity changes depth and can produce a long response when both complexity and depth opportunities are genuinely present. Depth independently changes depth drive and long-response behavior. Playfulness changes playful engagement but is suppressed in serious emotional context. Competition changes engagement only when a competition opportunity exists.\n- Intensity is covered in both directions after the earlier overstimulation wiring fix: high intensity preference increases engagement with high-tempo context, while low intensity preference under the same context raises overstimulation and produces a short response without manufacturing relationship distance or disengagement.\n- The first whole-family verification run failed only because the complexity test incorrectly required complexity alone to force a long response. The test context was corrected to include a real depth opportunity; no product code change was made for that failure. The corrected run passed.\n- High preferences cannot manufacture engagement or overstimulation when matching opportunities/intensity are absent.\n- Targeted contracts, TypeScript, full regression and production build all passed.\n- Permanent coverage commit: `f43633f` (`test(kaira): lock preference downstream coverage`).\n- Temporary verification workflow and generator helper were removed after the successful run.\n- Next audit focus: social orientation whole-family downstream coverage, followed by personality whole-family coverage, then consolidate the all-fine-tune matrix.\n'''
          if '## 60. Preference full downstream coverage — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record preference downstream coverage"
          git pull --rebase origin main
          git push origin main
