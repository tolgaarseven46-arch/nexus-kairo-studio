name: One-time TestLab reaction type fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-testlab-reaction-type.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align TestLab reaction type and clean helpers
        run: |
          node scripts/one-time-testlab-reaction-type.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-testlab-reaction-type.mjs
          git rm .github/workflows/one-time-testlab-reaction-type.yml
          git add src/components/studio/tabs/TestLabTab.tsx
          git commit -m "fix(kaira): align TestLab reaction mode type"
          git push
