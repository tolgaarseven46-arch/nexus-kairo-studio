name: One-time base personality ownership

on:
  push:
    paths:
      - ".github/workflows/one-time-base-personality-ownership.yml"
      - "scripts/applyBasePersonalityOwnership.mjs"
      - "src/services/kairaBasePersonalityOwnershipContracts.test.ts"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply base personality ownership split
        run: node scripts/applyBasePersonalityOwnership.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Ownership contract
        run: npm test -- --run src/services/kairaBasePersonalityOwnershipContracts.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- src/services/droitChatService.ts server.ts; then
            echo "base personality ownership already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/droitChatService.ts server.ts
          git commit -m "feat(kaira): separate base personality from response overlay"
          git pull --rebase origin main
          git push origin main
