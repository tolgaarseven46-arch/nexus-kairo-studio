name: Canonical Promotion Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  promotion-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Canonical promotion automated evidence
        run: npm run test:canonical-promotion
