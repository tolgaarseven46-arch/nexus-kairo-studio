name: One-time Final Acceptance Post86

on:
  push:
    branches:
      - diag/final-acceptance-post86

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[final86-cleaned]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diag/final-acceptance-post86
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run final persistent production acceptance
        run: npx tsx .github/scripts/final_acceptance_post86.ts
      - name: Self-remove acceptance harness
        if: always()
        run: |
          git rm .github/workflows/one-time-final-acceptance-post86.yml .github/scripts/final_acceptance_post86.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove final post86 acceptance harness [final86-cleaned]'
          git push origin HEAD:diag/final-acceptance-post86
