name: One-time authority audit state record

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record completed authority audit
        shell: bash
        run: |
          echo '' | base64 -d >> PROJECT_STATE.md
          rm .github/workflows/one-time-record-value-boundary-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md .github/workflows/one-time-record-value-boundary-repair.yml
          git commit -m "docs(kaira): record completed authority audit"
          git push
