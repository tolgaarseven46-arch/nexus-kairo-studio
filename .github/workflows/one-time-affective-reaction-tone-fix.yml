name: One-time affective reaction tone fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-affective-reaction-tone-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tone fix and clean helpers
        run: |
          node scripts/one-time-affective-reaction-tone-fix.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-affective-reaction-tone-fix.mjs
          git rm .github/workflows/one-time-affective-reaction-tone-fix.yml
          git add src/services/relationshipBehaviorService.ts
          git commit -m "fix(kaira): apply affective reaction tone semantics"
          git push
