name: One-time Opaque Turn Ambiguity Preservation

on:
  push:
    branches:
      - fix/opaque-turn-ambiguity-preservation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/opaque-turn-ambiguity-preservation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Apply patch
        run: python .github/scripts/one_time_opaque_turn_ambiguity.py
      - name: Verify focused contracts
        run: |
          npm test -- --run src/services/kairaAmbiguityPreservation.test.ts src/services/kairaOpaqueTurnAmbiguityRegression.test.ts
          npx tsc --noEmit
      - name: Commit verified patch and clean harness
        run: |
          git rm .github/workflows/one-time-opaque-turn-ambiguity-preservation.yml
          git rm .github/scripts/one_time_opaque_turn_ambiguity.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(realizer): preserve opaque-turn ambiguity [ambiguity-preservation-applied]'
          git push origin HEAD:fix/opaque-turn-ambiguity-preservation
