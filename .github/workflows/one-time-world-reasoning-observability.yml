name: One-time world reasoning observability

on:
  push:
    paths:
      - scripts/integrate-world-reasoning-observability.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded reasoning observability integration
        run: node scripts/integrate-world-reasoning-observability.mjs
      - name: Commit integration
        run: |
          if git diff --quiet -- server.ts; then
            echo "No reasoning observability changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "feat(reasoning): expose appraisal and policy in turn diagnostics"
          git push origin HEAD:main
