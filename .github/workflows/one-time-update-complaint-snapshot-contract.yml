name: One-time update complaint snapshot contract
on:
  push:
    branches:
      - fix/relationship-accountability-complaint
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/relationship-accountability-complaint
          fetch-depth: 0
      - name: Update stale twenty-turn expectation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/kairaTwentyTurnEndToEndContracts.test.ts')
          s = p.read_text()
          old = '''  it("does not let a later apology rewrite the earlier negative-turn state", () => {
    const turns = runTwentyTurns();
    const negative = turns[6];
    const apology = turns[8];

    expect(negative.state.relationship?.negativeEvents ?? 0).toBeGreaterThanOrEqual(1);
    expect(apology.interactionCount).toBeGreaterThan(negative.interactionCount);
    expect(negative.state.relationship?.interactionCount).toBe(negative.interactionCount);
  });'''
          new = '''  it("does not let a later apology rewrite the earlier complaint-turn snapshot", () => {
    const turns = runTwentyTurns();
    const complaint = turns[6];
    const apology = turns[8];

    expect(complaint.message).toBe("saçmalama ya");
    expect(apology.interactionCount).toBeGreaterThan(complaint.interactionCount);
    expect(complaint.state.relationship?.interactionCount).toBe(complaint.interactionCount);
    expect(apology.state).not.toBe(complaint.state);
  });'''
          if old not in s:
              raise SystemExit('expected stale snapshot contract block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/one-time-update-complaint-snapshot-contract.yml
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add src/services/kairaTwentyTurnEndToEndContracts.test.ts .github/workflows/one-time-update-complaint-snapshot-contract.yml
          git commit -m 'test(kaira): keep twenty-turn snapshot contract semantic-neutral'
          git push origin HEAD:fix/relationship-accountability-complaint
