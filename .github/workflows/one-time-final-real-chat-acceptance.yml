name: One-time Final Real Chat Acceptance

on:
  push:
    branches:
      - diag/question-act-post85

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[final-acceptance-cleaned]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diag/question-act-post85
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run targeted question smoke and fresh 15-turn acceptance
        run: npx tsx .github/scripts/final_real_chat_acceptance.ts
      - name: Self-remove final acceptance harness
        run: |
          git rm .github/workflows/one-time-final-real-chat-acceptance.yml
          git rm .github/scripts/final_real_chat_acceptance.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove final real-chat acceptance harness [final-acceptance-cleaned]'
          git push origin HEAD:diag/question-act-post85
