name: One-time contract diagnostic

on:
  push:
    branches: [main]

jobs:
  diagnose-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture architecture contract output
        shell: bash
        run: |
          set +e
          npm run test:contracts > contract-output.txt 2>&1
          code=$?
          echo "$code" > contract-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: contract-diagnostic
          path: |
            contract-output.txt
            contract-exit-code.txt
