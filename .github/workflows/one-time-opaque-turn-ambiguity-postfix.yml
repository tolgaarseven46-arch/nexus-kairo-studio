name: One-time Opaque Turn Ambiguity Postfix

on:
  push:
    branches:
      - diag/opaque-turn-ambiguity-postfix

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diag/opaque-turn-ambiguity-postfix
          fetch-depth: 0
      - name: Verify five fresh production deliveries
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nexus-kairo-studio.onrender.com/api/chat'
          for i in 1 2 3 4 5; do
            body=$(cat <<JSON
          {"userId":"ambiguity_post_${i}","userName":"Mert","userMessage":"sg","character":{"name":"Kaira"},"personality":{},"history":[{"sender":"user","text":"seni sevdim","participantName":"Mert"},{"sender":"droit","text":"bunu duymak güzel","replyToParticipantName":"Mert"},{"sender":"user","text":"gel sarıl","participantName":"Mert"},{"sender":"droit","text":"burdayım","replyToParticipantName":"Mert"}],"provider":"openrouter","suppressRecentMemory":true,"kairaInstanceId":"kaira_ambiguity_post_${i}","kairaInstanceType":"welcome","requestId":"ambiguity-post-${i}"}
          JSON
            )
            curl --fail-with-body --silent --show-error --max-time 180 -H 'Content-Type: application/json' --data "$body" "$URL" > "/tmp/chat_${i}.json"
            node - "$i" <<'NODE'
          const fs = require('fs');
          const i = process.argv[2];
          const x = JSON.parse(fs.readFileSync(`/tmp/chat_${i}.json`, 'utf8'));
          const reply = String(x.reply || '').trim().toLocaleLowerCase('tr-TR');
          const plan = x.kdm?.responsePlan;
          const safe = /^(?:h+e+|h+m+|hı+m+|tamam(?:dır)?|peki|olur|anladım|he\s+anladım|hmm\s+anladım|okey|okay|hıhı|ııh|(?:tam|pek)?\s*(?:anlamadım|çözemedim)|ne\s+demek\s+istediğini\s+anlamadım|bundan\s+emin\s+değilim)[.!…]*$/iu.test(reply);
          console.log(JSON.stringify({ run:Number(i), reply:x.reply, consistency:x.consistency, requiredContent:plan?.requiredContent, enforcement:x.enforcement }, null, 2));
          if (!plan?.requiredContent?.includes('preserve_ambiguity')) throw new Error(`run ${i}: preserve_ambiguity missing`);
          if (!x.consistency?.accepted) throw new Error(`run ${i}: delivered consistency rejected: ${JSON.stringify(x.consistency)}`);
          if (!safe) throw new Error(`run ${i}: unsafe ambiguity-resolving delivery: ${x.reply}`);
          NODE
          done
          echo PRODUCTION_OPAQUE_TURN_AMBIGUITY_PASS
      - name: Self-remove
        shell: bash
        run: |
          git rm .github/workflows/one-time-opaque-turn-ambiguity-postfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove opaque-turn ambiguity postfix diagnostic'
          git push origin HEAD:diag/opaque-turn-ambiguity-postfix
