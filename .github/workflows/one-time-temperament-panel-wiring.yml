name: One-time temperament panel wiring

on:
  push:
    paths:
      - ".github/workflows/one-time-temperament-panel-wiring.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply temperament panel wiring fix
        run: node scripts/applyTemperamentPanelWiringFix.mjs
      - name: Targeted contracts
        run: npx vitest run src/services/kairaTemperamentPanelWiringContracts.test.ts src/services/temperamentEngine.test.ts src/services/kairaTemperamentBeforeKdmContracts.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Full regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/temperamentEngine.ts src/services/kairaTemperamentPanelWiringContracts.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(kaira): wire temperament panel controls"
          git pull --rebase origin main
          git push origin main
