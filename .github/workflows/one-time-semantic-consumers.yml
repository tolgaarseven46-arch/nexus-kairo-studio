name: One-time canonical semantic consumers

on:
  push:
    paths:
      - ".github/workflows/one-time-semantic-consumers.yml"
      - "scripts/applyCanonicalSemanticConsumers.mjs"
      - "src/services/kairaSemanticConsumerAuthorityContracts.test.ts"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical semantic consumer integration
        run: node scripts/applyCanonicalSemanticConsumers.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Architecture contracts
        run: npm test -- --run src/services/kairaSemanticConsumerAuthorityContracts.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- server.ts src/services/semanticEventEngine.ts src/services/semanticEventAuthority.ts src/services/llmSemanticUnderstandingProvider.ts src/services/kairoDialogueDecisionEngine.ts src/services/kairoLocalLanguageEngine.ts; then
            echo "canonical semantic consumer integration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/semanticEventEngine.ts src/services/semanticEventAuthority.ts src/services/llmSemanticUnderstandingProvider.ts src/services/kairoDialogueDecisionEngine.ts src/services/kairoLocalLanguageEngine.ts
          git commit -m "feat(kaira): unify semantic consumers"
          git pull --rebase origin main
          git push origin main
