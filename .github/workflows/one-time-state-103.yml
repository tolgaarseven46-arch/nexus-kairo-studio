name: One-time state 103 recorder
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-state-103.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record section 103 and clean helpers
        run: |
          node scripts/one-time-state-103.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-state-103.mjs
          git rm .github/workflows/one-time-state-103.yml
          git add PROJECT_STATE.md
          git commit -m "docs(kaira): record state 103"
          git push
