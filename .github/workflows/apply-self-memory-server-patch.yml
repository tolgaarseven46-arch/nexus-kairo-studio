name: Apply self-memory runtime patch

on:
  push:
    paths:
      - scripts/apply-self-memory-server-patch.mjs
      - .github/workflows/apply-self-memory-server-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(kaira): stage self-memory runtime patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply deterministic server patch
        run: node scripts/apply-self-memory-server-patch.mjs
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git diff --cached --exit-code && { echo "No server patch produced"; exit 1; } || true
          git commit -m "feat(kaira): wire autobiographical recall into chat runtime"
          git push origin HEAD:main
