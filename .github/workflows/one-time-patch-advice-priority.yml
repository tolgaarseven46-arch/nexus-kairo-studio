name: One-time Patch Advice Priority
on:
  push:
    branches:
      - fix/dialogue-advice-topic-shift-priority
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dialogue-advice-topic-shift-priority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply typed dialogue priority patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/services/kairoDialogueDecisionEngine.ts')
          s = p.read_text()
          needle = '''  if (event.discourseAct === "topic_shift") {
            return {
              move: "follow_topic_shift",
'''
          insert = '''  // A typed advice request is a user-facing conversational obligation. A
          // simultaneous topic-shift facet describes the transition, but cannot erase
          // the request. Keep recall/correction/repair authorities above this seam;
          // otherwise advice owns the move and receives the normal answer obligation.
          if (event.adviceRequested) {
            return {
              move: "answer_or_clarify",
              allowFollowUpQuestion: true,
              allowSpeculation: false,
              maxSentences: 3,
              hasSupportedTargetClaim: false,
              reason:
                "Kullanıcı açıkça görüş/tavsiye istiyor. Konu değişimi sinyali bu cevap yükümlülüğünü silemez; önce isteği yanıtla, yalnız gerçekten gerekli ise tek netleştirme sorusu sor.",
            };
          }

          if (event.discourseAct === "topic_shift") {
            return {
              move: "follow_topic_shift",
'''
          if needle not in s:
              raise SystemExit('target seam not found')
          s = s.replace(needle, insert, 1)
          p.write_text(s)
      - run: npx vitest run src/services/kairaDialogueAdviceTopicShiftPriority.test.ts src/services/discourseOpenThreadContinuity.test.ts
      - run: npx tsc --noEmit
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/kairoDialogueDecisionEngine.ts
          git commit -m "fix(dialogue): preserve advice obligation across topic shift"
          git push origin HEAD:fix/dialogue-advice-topic-shift-priority
