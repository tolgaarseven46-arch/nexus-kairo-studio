name: One-time project state recognition motivation

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-recognition-motivation.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 50. Recognition motivation downstream wiring — 2026-08-31\n- Deep fine-tune audit found `motivation.social.recognition` was key-level wired but behaviorally dead: it changed `approvalDrive`, while `approvalDrive` was not consumed by behavior integration, legacy personality, or server prompt/policy.\n- Recognition need now contributes a bounded contextual bias to `approachPressure` only when a recognition opportunity is present. The bias is centered on the neutral 50 value, so default/backward-compatible behavior remains unchanged at 50.\n- High recognition need can therefore make Kaira slightly more approach-oriented in an actual praise/takdir context; low recognition need can slightly reduce that approach tendency. Recognition alone cannot create approach pressure when no recognition opportunity exists.\n- This preserves the architecture rule that stable motivation values are needs/priorities, not direct behavior commands. They still require a matching situation before affecting integrated behavior.\n- Added `kairaRecognitionMotivationWiringContracts.test.ts` to verify CharacterTab key mapping, downstream approach differentiation under recognition opportunity, and no meaningful effect without recognition opportunity.\n- Targeted contracts, TypeScript, full regression, production build and integration commit all passed in the one-time migration workflow.\n- Integration commit: `27b0c72` (`fix(kaira): wire recognition motivation downstream`).\n- Temporary recognition migration workflow and helper script were removed after successful integration.\n- Next deep-audit focus: remaining motivation, preference and social outputs should be checked for the same pattern: key-level read is insufficient; each slider must produce a measurable downstream difference only in a context where its semantic meaning is relevant.\n'''
          if '## 50. Recognition motivation downstream wiring — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record recognition motivation wiring"
          git pull --rebase origin main
          git push origin main
