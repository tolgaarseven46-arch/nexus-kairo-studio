name: one-time-expand-local-routines
on:
  push:
    paths:
      - '.github/workflows/one-time-expand-local-routines.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/one-time-expand-local-routines.py
      - run: |
          rm -f scripts/one-time-expand-local-routines.py
          rm -f .github/workflows/one-time-expand-local-routines.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(kaira): expand local Turkish social routines'
          git push origin HEAD:main
