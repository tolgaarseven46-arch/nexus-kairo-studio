name: One-time relationship complaint production smoke
on:
  push:
    branches:
      - chatgpt/relationship-complaint-prod-smoke
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Characterize live complaint handling
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://nexus-kairo-studio.onrender.com"
          USER_ID="prod_relationship_complaint_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          SESSION_ID="session_${USER_ID}"

          post_chat() {
            local message="$1"
            local request_id="$2"
            curl --fail-with-body --silent --show-error \
              -X POST "${BASE_URL}/api/chat" \
              -H 'Content-Type: application/json' \
              --data-binary @- <<JSON
{"userId":"${USER_ID}","userName":"Tolga","userMessage":"${message}","character":{"name":"KAIRO"},"provider":"openrouter","sessionId":"${SESSION_ID}","kairaInstanceId":"default-kaira","requestId":"${request_id}","history":[]}
JSON
          }

          echo '--- complaint turn 1 ---'
          first="$(post_chat 'bişey anlatmadınki sohbet bile edemedik' "complaint-1-${GITHUB_RUN_ID}")"
          echo "$first" | jq '{reply, semantic: .kdm.semanticEvent, relationship: .kdm.dynamicState.relationship, reactionMode: .kdm.dynamicState.reactionMode, reasoning: .kdm.trace.messageInterpretation}'

          echo '--- complaint turn 2 same persisted relationship ---'
          second="$(post_chat 'bişey anlatmadınki sohbet bile edemedik' "complaint-2-${GITHUB_RUN_ID}")"
          echo "$second" | jq '{reply, semantic: .kdm.semanticEvent, relationship: .kdm.dynamicState.relationship, reactionMode: .kdm.dynamicState.reactionMode, reasoning: .kdm.trace.messageInterpretation}'

          echo '--- direct insult control ---'
          insult="$(post_chat 'sen salaksın' "insult-${GITHUB_RUN_ID}")"
          echo "$insult" | jq '{reply, semantic: .kdm.semanticEvent, relationship: .kdm.dynamicState.relationship, reactionMode: .kdm.dynamicState.reactionMode, reasoning: .kdm.trace.messageInterpretation}'

          for item in first second insult; do
            value="${!item}"
            echo "$item intent=$(echo "$value" | jq -r '.kdm.semanticEvent.intent // ""') conflict=$(echo "$value" | jq -r '.kdm.dynamicState.relationship.conflictScore // 0') hurt=$(echo "$value" | jq -r '.kdm.dynamicState.relationship.hurtScore // 0') negative=$(echo "$value" | jq -r '.kdm.dynamicState.relationship.negativeEvents // 0') repeated=$(echo "$value" | jq -r '.kdm.dynamicState.relationship.repeatedNegativeCount // 0') pattern=$(echo "$value" | jq -r '.kdm.dynamicState.relationship.lastNegativePattern // ""')"
          done
