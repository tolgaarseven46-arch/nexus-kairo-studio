name: production characterization
on:
  push:
    branches:
      - test/post-pr100-production-characterization
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Characterize live production
        shell: bash
        env:
          BASE_URL: https://nexus-kairo-studio.onrender.com
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 "$BASE_URL/api/health" | tee /tmp/health.json
          curl -fsS --retry 3 --retry-delay 2 "$BASE_URL/api/runtime-info" | tee /tmp/runtime.json
          python - <<'PY'
          import json, subprocess, re, uuid
          base='https://nexus-kairo-studio.onrender.com'
          history=[]
          dynamic={}
          cases=[
            'naber şimdi',
            'bugün bütün kahveyi masaya döktüm',
            'Mert yine geç kaldı',
            'Mert yüzünden çok üzgünüm',
            'soru sorma artık',
            'bugün iş çok yoğundu',
          ]
          outputs=[]
          for i,msg in enumerate(cases):
            payload={
              'userId':'prod_characterization_pr100',
              'userName':'Tolga',
              'userMessage':msg,
              'character':{'name':'Kaira'},
              'personality':{},
              'dynamicState':dynamic,
              'history':history,
              'provider':'openrouter',
              'suppressRecentMemory':True,
              'kairaInstanceId':'prod-char-pr100',
              'kairaInstanceType':'free_trial',
              'sessionId':'prod-char-pr100',
              'requestId':f'pr100-{i}-{uuid.uuid4()}',
            }
            p=subprocess.run(['curl','-fsS','--retry','2','--retry-delay','2','-H','Content-Type: application/json','-d',json.dumps(payload,ensure_ascii=False),base+'/api/chat'],capture_output=True,text=True)
            if p.returncode:
              raise SystemExit(f'chat request failed for {msg}: {p.stderr}')
            data=json.loads(p.stdout)
            reply=str(data.get('reply','')).strip()
            if not reply:
              raise SystemExit(f'empty reply for {msg}: {data}')
            outputs.append({'message':msg,'reply':reply,'semantic':data.get('semantic'),'decision':data.get('decision')})
            dynamic=data.get('dynamicState') or dynamic
            history.extend([{'sender':'user','text':msg,'participantId':'prod-user','participantName':'Tolga'}, {'sender':'droit','text':reply,'participantId':'kaira','participantName':'Kaira'}])
          generic=re.compile(r'^(?:he|hee|hmm|tamam|anladım|he anladım)[.!…]*$',re.I)
          ordinary=outputs[1]['reply']
          if generic.match(ordinary):
            raise SystemExit(f'contentful ordinary turn collapsed to generic ACK: {ordinary}')
          stop_reply=outputs[5]['reply']
          if '?' in stop_reply:
            raise SystemExit(f'question-stop contract violated: {stop_reply}')
          print(json.dumps(outputs,ensure_ascii=False,indent=2))
          PY
