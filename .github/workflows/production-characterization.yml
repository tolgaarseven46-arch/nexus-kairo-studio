name: production characterization
on:
  push:
    branches:
      - test/post-pr100-production-characterization
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Characterize live production
        shell: bash
        env:
          BASE_URL: https://nexus-kairo-studio.onrender.com
        run: |
          set -euo pipefail
          echo 'DNS:' && getent ahosts nexus-kairo-studio.onrender.com | head
          curl --connect-timeout 10 --max-time 30 -fsS "$BASE_URL/api/health" | tee /tmp/health.json
          curl --connect-timeout 10 --max-time 30 -fsS "$BASE_URL/api/runtime-info" | tee /tmp/runtime.json
          python - <<'PY'
          import json, subprocess, re, uuid
          base='https://nexus-kairo-studio.onrender.com'
          def post(path,payload,limit=60):
            p=subprocess.run(['curl','--connect-timeout','10','--max-time',str(limit),'-fsS','-H','Content-Type: application/json','-d',json.dumps(payload,ensure_ascii=False),base+path],capture_output=True,text=True,timeout=limit+10)
            if p.returncode:
              raise SystemExit(f'{path} failed: {p.stderr}')
            return json.loads(p.stdout)
          semantic_cases=[
            ('naber şimdi','how_are_you',None),
            ('Mert yine geç kaldı',None,'not_emotional'),
            ('Mert yüzünden çok üzgünüm',None,'emotional'),
          ]
          for msg,routine,kind in semantic_cases:
            d=post('/api/language-understanding',{'userMessage':msg,'userName':'Tolga','characterName':'Kaira','provider':'openrouter'},45)
            event=d.get('event') or {}
            if routine and event.get('socialRoutine') != routine:
              raise SystemExit(f'{msg}: expected routine {routine}, got {event}')
            if kind=='not_emotional' and event.get('intent')=='emotional_share':
              raise SystemExit(f'{msg}: neutral third-party event overread as emotional_share')
            if kind=='emotional' and event.get('intent')!='emotional_share':
              raise SystemExit(f'{msg}: genuine emotional share lost')
            print('SEMANTIC',msg,event.get('intent'),event.get('socialRoutine'))
          history=[]; dynamic={}; outputs=[]
          for i,msg in enumerate(['bugün bütün kahveyi masaya döktüm','soru sorma artık','bugün iş çok yoğundu']):
            payload={'userId':'prod_characterization_pr100','userName':'Tolga','userMessage':msg,'character':{'name':'Kaira'},'personality':{},'dynamicState':dynamic,'history':history,'provider':'openrouter','suppressRecentMemory':True,'kairaInstanceId':'prod-char-pr100','kairaInstanceType':'free_trial','sessionId':'prod-char-pr100','requestId':f'pr100-v2-{i}-{uuid.uuid4()}'}
            d=post('/api/chat',payload,75)
            reply=str(d.get('reply','')).strip()
            if not reply: raise SystemExit(f'empty reply: {d}')
            outputs.append((msg,reply,d.get('semantic'),d.get('decision')))
            dynamic=d.get('dynamicState') or dynamic
            history += [{'sender':'user','text':msg,'participantId':'prod-user','participantName':'Tolga'},{'sender':'droit','text':reply,'participantId':'kaira','participantName':'Kaira'}]
          generic=re.compile(r'^(?:he|hee|hmm|tamam|anladım|he anladım)[.!…]*$',re.I)
          if generic.match(outputs[0][1]): raise SystemExit('ordinary content collapsed to generic ACK: '+outputs[0][1])
          if '?' in outputs[2][1]: raise SystemExit('question-stop contract violated: '+outputs[2][1])
          for row in outputs: print('CHAT',json.dumps(row,ensure_ascii=False,default=str))
          PY
