name: One-time Semantic Context Non-Invention

on:
  push:
    branches:
      - fix/semantic-context-non-invention

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/semantic-context-non-invention
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Apply patch
        run: python .github/scripts/one_time_semantic_context_non_invention.py
      - name: Verify
        run: |
          npm test -- --run src/services/llmSemanticContextNonInvention.test.ts
          npx tsc --noEmit
      - name: Commit verified patch and clean harness
        run: |
          git rm .github/workflows/one-time-semantic-context-non-invention.yml
          git rm .github/scripts/one_time_semantic_context_non_invention.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(semantic): prevent context meaning invention [semantic-non-invention-applied]'
          git push origin HEAD:fix/semantic-context-non-invention
