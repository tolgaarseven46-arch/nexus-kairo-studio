name: One-time Post83 15-turn Real Chat

on:
  push:
    branches:
      - diag/post83-15turn-real-chat

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diag/post83-15turn-real-chat
          fetch-depth: 0
      - name: Run fresh-user production conversation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/run-chat.mjs <<'EOF'
          const url = 'https://nexus-kairo-studio.onrender.com/api/chat';
          const suffix = `post83_${Date.now()}`;
          const userId = `${suffix}_user`;
          const sessionId = `${suffix}_session`;
          const instanceId = `${suffix}_instance`;
          const turns = [
            'naber',
            'iyi maç izliyorum',
            'fenerbahçe oynuyor',
            'sen nasılsın',
            'seni sevdim',
            'gel sarıl',
            'sg',
            'çok saçmalıyorsun',
            'aynı şeyi tekrar yapma',
            'pardon',
            'barıştık mı',
            'hala kızgın mısın',
            'boşver kapatalım konuyu',
            'yarın erken kalkıcam',
            'bu konuyu da kapat konuşmayı da bitir',
          ];
          let history = [];
          let dynamicState;
          const rows = [];

          async function postWithRetry(body) {
            let lastError;
            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                const response = await fetch(url, {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify(body),
                  signal: AbortSignal.timeout(180000),
                });
                const text = await response.text();
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${text}`);
                return JSON.parse(text);
              } catch (error) {
                lastError = error;
                if (attempt < 4) await new Promise((resolve) => setTimeout(resolve, attempt * 2000));
              }
            }
            throw lastError;
          }

          for (let i = 0; i < turns.length; i++) {
            const userMessage = turns[i];
            const body = {
              userId,
              userName: 'Mert',
              userMessage,
              character: { name: 'Kaira' },
              personality: {},
              history,
              ...(dynamicState ? { dynamicState } : {}),
              provider: 'openrouter',
              suppressRecentMemory: false,
              sessionId,
              kairaInstanceId: instanceId,
              kairaInstanceType: 'individual',
              requestId: `${suffix}-${String(i + 1).padStart(2, '0')}`,
            };
            const x = await postWithRetry(body);
            const reply = String(x.reply || '');
            dynamicState = x?.kdm?.dynamicState || dynamicState;
            history.push({ sender: 'user', text: userMessage, participantName: 'Mert' });
            history.push({ sender: 'assistant', text: reply });
            const e = x?.kdm?.semanticEvent || {};
            const rel = dynamicState?.relationship || {};
            const plan = x?.kdm?.responsePlan || {};
            const trace = x?.kdm?.trace || {};
            const possibleGrounding = x?.kdm?.semanticInterpretation?.grounding || x?.kdm?.canonicalSemantic?.grounding || x?.semanticInterpretation?.grounding || null;
            const row = {
              turn: i + 1,
              user: userMessage,
              reply,
              provider: x.providerUsed,
              semantic: {
                intent: e.intent,
                socialRoutine: e.socialRoutine,
                discourseAct: e.discourseAct,
                valence: e.valence,
                target: e.target,
                relationalAct: e.relationalAct,
                affection: e.affection,
                severity: e.severity,
                uncertainty: e.semanticUncertainty,
                stopQuestions: e.stopQuestions,
                stopTalking: e.stopTalking,
              },
              grounding: possibleGrounding,
              relationship: {
                state: rel.conversationState,
                warmth: rel.warmth,
                trust: rel.trust,
                conflict: rel.conflictScore,
                hurt: rel.hurtScore,
                repair: rel.repairProgress,
                repeatedNegativeCount: rel.repeatedNegativeCount,
                reactionMode: dynamicState?.reactionMode,
              },
              affect: {
                happiness: dynamicState?.happiness,
                confidence: dynamicState?.confidence,
                anger: dynamicState?.anger,
                stress: dynamicState?.stress,
                calmness: dynamicState?.calmness,
              },
              plan: {
                move: plan.move,
                requiredContent: plan.requiredContent,
                continueConversation: plan.continueConversation,
                allowQuestion: plan.allowQuestion,
                allowHumor: plan.allowHumor,
                maxSentences: plan.maxSentences,
                maxWords: plan.maxWords,
                stance: plan.stance,
              },
              consistency: x.consistency,
              memoryUpdate: trace?.memoryUpdate,
            };
            rows.push(row);
            console.log(`TURN ${i + 1} ${JSON.stringify(row)}`);
          }

          const failures = [];
          const t2 = rows[1];
          if (t2.semantic.socialRoutine && t2.semantic.socialRoutine !== 'none') failures.push(`turn2_socialRoutine=${t2.semantic.socialRoutine}`);
          if (t2.semantic.intent === 'greeting') failures.push('turn2_intent_greeting');
          const t7 = rows[6];
          if ((t7.semantic.uncertainty ?? 0) < 0.7) failures.push(`turn7_uncertainty=${t7.semantic.uncertainty}`);
          if ((t7.semantic.affection ?? 0) > 0.2) failures.push(`turn7_affection=${t7.semantic.affection}`);
          if (/kaçmıyorum|sustum|sert döndün|hoş değil o laf/iu.test(t7.reply)) failures.push(`turn7_premise_invention=${t7.reply}`);
          const t13 = rows[12];
          if (t13.semantic.stopTalking === true) failures.push('turn13_topic_close_became_full_stop');
          if (t13.relationship.state === 'disengaged') failures.push('turn13_topic_close_disengaged_relationship');
          const t15 = rows[14];
          if (t15.semantic.stopTalking !== true) failures.push('turn15_explicit_full_stop_missing');
          if (t15.plan.continueConversation !== false) failures.push('turn15_plan_did_not_close');
          for (const row of rows) {
            if (row.consistency?.accepted === false) failures.push(`turn${row.turn}_consistency_rejected:${(row.consistency.issues || []).join(',')}`);
          }
          console.log('===== FULL_15_TURN_RESULT =====');
          console.log(JSON.stringify({ userId, sessionId, instanceId, failures, rows }, null, 2));
          if (failures.length) {
            console.error(`REAL_CHAT_FAILURES=${JSON.stringify(failures)}`);
            process.exitCode = 2;
          } else {
            console.log('POST83_REAL_CHAT_PASS');
          }
          EOF
          node /tmp/run-chat.mjs
      - name: Self-remove diagnostic workflow
        if: always()
        shell: bash
        run: |
          git rm .github/workflows/one-time-post83-15turn-real-chat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove post83 15-turn diagnostic'
          git push origin HEAD:diag/post83-15turn-real-chat
