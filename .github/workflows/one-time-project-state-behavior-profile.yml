name: One-time project state behavior profile

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-behavior-profile.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          old = '- `droitChatService.ts` istemci tarafında ayrıca behavior profile hesaplıyor; sunucuda KDM tekrar davranış profili hesaplıyor. Veri akışı sadeleştirme adayı.'
          new = '- Behavior profile çift otoritesi 23. bölümde kapatıldı; canlı cevapta tek otorite artık server/KDM `kdm.behaviorProfile`.'
          if old in text:
              text = text.replace(old, new)
          section = '''\n\n## 23. KDM behavior profile otoritesi — 2026-08-30\n- Canlı cevap davranış profili için tek otorite server/KDM `kdm.behaviorProfile`dır.\n- `droitChatService.ts` artık `computeBehaviorProfile(runtimePersonality, userMessage)` ile paralel client profili üretmez ve request payload'ına ayrı `behaviorProfile` göndermez.\n- Server hem Yerel Dil Motoru hem AI response yolunda authoritative `behaviorProfile`ı `kdm` response metadata'sında döndürür.\n- Client dönen `data.kdm.behaviorProfile`ı `authoritativeBehaviorProfile` olarak kullanır ve Studio/debug tüketicilerine `profile` alanında aynı nesneyi verir; profil eksikse sessiz fallback yerine hata üretir.\n- Böylece panel/debug profilinin, cevabı gerçekten yöneten KDM profilinden sapması engellendi.\n- Client-side personality/motivation/value/preference/social/boundary/expression hazırlıkları bu fazda kaldırılmadı; yalnız duplicate behavior-profile karar otoritesi kapatıldı. Bunların server ile sınırı ayrı audit konusu olarak kalır.\n- `kairaBehaviorProfileAuthorityContracts.test.ts` kalıcı `test:contracts` architecture suite'ine eklendi.\n- Geçici behavior-profile migration workflow/script başarıyla uygulandıktan sonra kaldırıldı.\n- Entegrasyon commit'i: `17f3600` (`feat(kaira): make KDM behavior profile authoritative`). Migration doğrulamasında contract, TypeScript, full test suite ve production build başarıyla geçti.\n'''
          if '## 23. KDM behavior profile otoritesi — 2026-08-30' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record behavior profile authority"
          git pull --rebase origin main
          git push origin main
