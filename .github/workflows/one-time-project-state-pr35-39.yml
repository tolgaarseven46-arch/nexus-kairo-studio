name: One-time project state PR35-39 checkpoint

on:
  push:
    branches: [chatgpt/project-state-pr35-39-checkpoint]

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chatgpt/project-state-pr35-39-checkpoint
          fetch-depth: 0
      - name: Append checkpoint
        run: node scripts/append-project-state-pr35-39.mjs
      - name: Commit checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          git diff --cached --quiet && exit 0
          git commit -m "docs(state): record PR35-39 canonical checkpoint"
          git push origin HEAD:chatgpt/project-state-pr35-39-checkpoint
