name: one-time fix dialogue social routine projection
on:
  push:
    branches:
      - fix/natural-conversation-v2-quality
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/natural-conversation-v2-quality
      - name: Preserve social routine facet and self-remove
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/services/kairoDialogueDecisionEngine.ts')
          text = path.read_text()
          old_repeat = '''    return {
      move: "natural_reaction",
      allowFollowUpQuestion: false,
      allowSpeculation: false,
      maxSentences: 1,
      maxWords: 10,
      hasSupportedTargetClaim: false,
      reason:
        "Bu karşılıklı rutin (nasılsın/napıyorsun) bu sohbette zaten yapıldı. Kısa cevap ver ama tekrar 'sen nasılsın / sen napıyorsun' diye SORMA.",
    };'''
          new_repeat = '''    return {
      move: "natural_reaction",
      socialRoutine: event.socialRoutine,
      allowFollowUpQuestion: false,
      allowSpeculation: false,
      maxSentences: 1,
      maxWords: 10,
      hasSupportedTargetClaim: false,
      reason:
        "Bu karşılıklı rutin (nasılsın/napıyorsun) bu sohbette zaten yapıldı. Kısa cevap ver ama tekrar 'sen nasılsın / sen napıyorsun' diye SORMA.",
    };'''
          old_recip = '''    return {
      move: "natural_reaction",
      allowFollowUpQuestion: true,
      allowSpeculation: false,
      maxSentences: 2,
      maxWords: 10,
      hasSupportedTargetClaim: false,
      reason:
        "Kullanıcı Kaira'nın halini veya ne yaptığını doğrudan soruyor. Kısa cevap ver; doğal karşılıklılık için en fazla bir kısa 'sen?' / 'senden naber?' sorusu sorabilirsin.",
    };'''
          new_recip = '''    return {
      move: "natural_reaction",
      socialRoutine: event.socialRoutine,
      allowFollowUpQuestion: true,
      allowSpeculation: false,
      maxSentences: 2,
      maxWords: 10,
      hasSupportedTargetClaim: false,
      reason:
        "Kullanıcı Kaira'nın halini veya ne yaptığını doğrudan soruyor. Kısa cevap ver; doğal karşılıklılık için en fazla bir kısa 'sen?' / 'senden naber?' sorusu sorabilirsin.",
    };'''
          if old_repeat not in text or old_recip not in text:
              raise SystemExit('expected dialogue projection markers not found')
          text = text.replace(old_repeat, new_repeat, 1).replace(old_recip, new_recip, 1)
          path.write_text(text)
          Path('.github/workflows/one-time-fix-dialogue-social-routine.yml').unlink()
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/kairoDialogueDecisionEngine.ts .github/workflows/one-time-fix-dialogue-social-routine.yml
          git commit -m "fix(kaira): preserve reciprocal social routine projection"
          git push origin HEAD:fix/natural-conversation-v2-quality
