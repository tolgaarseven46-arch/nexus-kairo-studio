name: One-time reaction state recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-record-reaction-state.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record reaction state and clean helpers
        run: |
          node scripts/one-time-record-reaction-state.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-record-reaction-state.mjs
          git rm .github/workflows/one-time-record-reaction-state.yml
          git add PROJECT_STATE.md
          git commit -m "docs(kaira): record qualitative reaction state"
          git push
