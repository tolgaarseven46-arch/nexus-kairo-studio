name: One-time final delivery enforcement gate v2

on:
  push:
    branches:
      - fix/final-delivery-enforcement-gate

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/final-delivery-enforcement-gate
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Apply patch
        run: python scripts/applyFinalDeliveryGate.py
      - name: Focused API-free verification
        run: npx vitest run src/services/kairaFinalDeliveryEnforcementCharacterization.test.ts src/services/kairaFinalDeliveryGateRegression.test.ts src/services/kairaTwentyTurnFinalDeliveryQualityRegression.test.ts
      - name: Full tests
        run: npm test -- --run
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Remove one-time patch assets
        run: rm .github/workflows/one-time-final-delivery-enforcement-v2.yml scripts/applyFinalDeliveryGate.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(kaira): enforce final delivery acceptance"
          git push origin HEAD:fix/final-delivery-enforcement-gate
