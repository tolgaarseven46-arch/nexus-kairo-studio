name: One-time explicit stop intent-facet separation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Separate transient stop facets from primary intent
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/services/semanticEventEngine.ts'); s=p.read_text(encoding='utf-8'); old='else if (challenge || mockery || stopQuestions || stopTalking || confusion || frustration >= 0.7) intent = \"complaint\";'; new='else if (challenge || mockery || confusion || frustration >= 0.7) intent = \"complaint\";'; assert old in s, 'complaint marker missing'; s=s.replace(old,new,1); marker='else if (/(😂|🤣|😄|😅|:d|haha|hahah|taşak)/iu.test(text)) intent = \"banter\";'; assert marker in s, 'intent fallback marker missing'; s=s.replace(marker, marker+'\\n  else if (stopQuestions || stopTalking) intent = \"complaint\";',1); p.write_text(s,encoding='utf-8')"
          rm .github/workflows/one-time-explicit-stop-intent-facet.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/semanticEventEngine.ts .github/workflows/one-time-explicit-stop-intent-facet.yml
          git commit -m "fix(kaira): keep explicit stops as semantic facets"
          git push
