name: One-time wire final prompt

on:
  push:
    branches:
      - codex/final-prompt-byte-parity

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/final-prompt-byte-parity
          fetch-depth: 0
      - name: Wire server to shared serializer
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("server.ts")
          text = path.read_text(encoding="utf-8")

          import_anchor = '''import {
            buildCanonicalBehaviorBlock,
            buildCanonicalObservationalContext,
            buildCanonicalDialogueMoveContext,
          } from "./src/services/kairaCanonicalPromptBuilder";'''.replace("          ", "")
          import_replacement = import_anchor + '\nimport { buildKairaFinalProviderSystemPrompt } from "./src/services/kairaFinalProviderPrompt";'
          if 'buildKairaFinalProviderSystemPrompt' not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit(f"expected exactly one canonical prompt import anchor, got {text.count(import_anchor)}")
              text = text.replace(import_anchor, import_replacement, 1)

          start_marker = '    const system = `${buildKairaRuntimeIdentityInstruction(kairaInstance, kairaPolicy, character)}\\n'
          end_marker = ' Yalnızca Kaira\'nın göndereceği doğal Türkçe mesajı üret; açıklama veya analiz ekleme.`;'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit("production inline system prompt start marker not found")
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit("production inline system prompt end marker not found")
          end += len(end_marker)

          new = '''    const system = buildKairaFinalProviderSystemPrompt({
              runtimeIdentityInstruction: buildKairaRuntimeIdentityInstruction(kairaInstance, kairaPolicy, character),
              speechIdentityInstruction: speechIdentityPrompt(speech),
              languageStyleMemoryInstruction: languageStyleMemoryInstruction(stateUserId, kairaPolicy.persistentUserMemory),
              dyadicLanguageAlignmentInstruction: dyadicLanguageAlignmentInstruction(stateUserId, speech.relationshipLevel, kairaPolicy.persistentUserMemory),
              socialStyle,
              groundingInstruction,
              activeParticipantInstruction,
              entityGroundingInstruction,
              worldEventInstruction,
              worldEventMemoryInstruction,
              worldStateAppraisalInstruction,
              worldReasoningPolicyInstruction,
              epistemicInstruction,
              selfMemoryInstruction,
              dialogueInstruction,
              discourseInstruction,
              dialogueDecisionInstruction,
              responsePlanInstruction,
              canonicalObservationalContext,
              sessionWorkingMemory,
              memoryContext,
              tone: behaviorProfile?.tone || "confident",
            });'''
          text = text[:start] + new + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No wiring change needed"
            exit 0
          fi
          git commit -m "refactor(prompt): wire production to shared final serializer"
          git push origin HEAD:codex/final-prompt-byte-parity
