name: One-time remove legacy runtime flags

on:
  push:
    paths:
      - ".github/workflows/one-time-remove-legacy-runtime-flags.yml"
      - "scripts/applyLegacyRuntimeFlagRemoval.mjs"
      - "src/services/kairaLegacyRuntimeFlagRemovalContracts.test.ts"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy runtime decision flags
        run: node scripts/applyLegacyRuntimeFlagRemoval.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Runtime flag removal contract
        run: npm test -- --run src/services/kairaLegacyRuntimeFlagRemovalContracts.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- src/services/behaviorIntegrationEngine.ts src/services/conversationStateAuthority.ts src/services/behaviorIntegrationEngine.test.ts src/services/conversationStateAuthority.test.ts; then
            echo "legacy runtime flags already removed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/behaviorIntegrationEngine.ts src/services/conversationStateAuthority.ts src/services/behaviorIntegrationEngine.test.ts src/services/conversationStateAuthority.test.ts
          git commit -m "refactor(kaira): remove legacy runtime decision flags"
          git pull --rebase origin main
          git push origin main
