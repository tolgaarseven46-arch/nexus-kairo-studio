name: One-time project state social compliance disclosure

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-social-compliance-disclosure.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 51. Social compliance/disclosure downstream wiring — 2026-08-31\n- Deep social-orientation audit found two CharacterTab keys that were read correctly but lost before final behavior: `social.agency.compliance` and `social.trust.disclosure`.\n- Compliance changed `resistancePressure`, but behavior integration did not consume that signal; its legacy patience bridge was later overwritten by boundary processing. Disclosure changed `disclosurePressure`, but integration did not consume it; its legacy communication bridge was later overwritten by expression processing.\n- `behaviorIntegrationEngine` now uses social resistance only as a bounded directness contribution when the current semantic event actually contains coercion. Low compliance can therefore make Kaira more resistant/direct under coercion, while compliance does not create a general-purpose aggressive/direct style in neutral context.\n- `behaviorIntegrationEngine` now gives `disclosurePressure` a small contribution to normal warmth. Because disclosure pressure itself already requires disclosure willingness plus intimacy/safety context, this makes high disclosure measurably more open/warm only where semantically appropriate. Disengage and repairing branches remain authoritative and unchanged.\n- Added `kairaSocialComplianceDisclosureWiringContracts.test.ts` to verify both CharacterTab mappings, coercion-gated compliance/directness behavior, neutral-context non-effect for compliance, and safe-intimacy disclosure/warmth differentiation.\n- Targeted contracts, TypeScript, full regression and production build all passed.\n- Integration commit: `1ccc939` (`fix(kaira): wire social compliance and disclosure downstream`).\n- Temporary migration workflow and helper script were removed after integration.\n- Next deep-audit focus: preference signals and the remaining motivation/social dimensions should be tested at the final integrated behavior boundary rather than accepted merely because their engine-local outputs change.\n'''
          if '## 51. Social compliance/disclosure downstream wiring — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record social compliance disclosure wiring"
          git pull --rebase origin main
          git push origin main
