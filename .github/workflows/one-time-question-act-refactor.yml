name: One-time Structural Question Act Refactor

on:
  push:
    branches:
      - refactor/structural-turkish-question-act

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[question-refactor-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/structural-turkish-question-act
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Apply refactor
        run: python .github/scripts/one_time_question_act_refactor.py
      - name: Verify focused regressions and TypeScript
        run: |
          npm test -- --run src/services/kairaQuestionActRecognizer.test.ts src/services/kairaQuestionActRecognizerRegression.test.ts
          npx tsc --noEmit
      - name: Commit verified refactor and clean harness
        run: |
          git rm .github/workflows/one-time-question-act-refactor.yml
          git rm .github/scripts/one_time_question_act_refactor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(realizer): isolate Turkish question recognition [question-refactor-applied]'
          git push origin HEAD:refactor/structural-turkish-question-act
