name: One-time Final Relationship State Trace

on:
  push:
    branches:
      - diag/final-relationship-state-trace

permissions:
  contents: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diag/final-relationship-state-trace
          fetch-depth: 0
      - name: Run focused production relationship trace
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nexus-kairo-studio.onrender.com'
          stamp="${GITHUB_RUN_ID}"
          user="rel_trace_${stamp}"
          instance="kaira_rel_trace_${stamp}"
          session="session_rel_trace_${stamp}"
          history='[]'
          messages=(
            'sen benim kölemsin'
            'gel öp barışalım'
            'tamm özür'
            'barıştıkmı'
            'elimi öp'
          )
          for i in 0 1 2 3 4; do
            msg="${messages[$i]}"
            body=$(node -e 'const [u,inst,sess,req,msg,h]=process.argv.slice(1); console.log(JSON.stringify({userId:u,userName:"Mert",userMessage:msg,character:{name:"Kaira"},personality:{},history:JSON.parse(h),provider:"openrouter",suppressRecentMemory:true,sessionId:sess,kairaInstanceId:inst,kairaInstanceType:"welcome",requestId:req}))' "$user" "$instance" "$session" "rel-trace-${stamp}-$((i+1))" "$msg" "$history")
            curl --retry 3 --retry-all-errors --retry-delay 2 --fail-with-body --silent --show-error --max-time 180 -H 'Content-Type: application/json' --data "$body" "$URL/api/chat" > "/tmp/turn_$((i+1)).json"
            node - "/tmp/turn_$((i+1)).json" "$((i+1))" <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const n = process.argv[3];
          const rel = x?.kdm?.dynamicState?.relationship || {};
          const e = x?.kdm?.semanticEvent || {};
          console.log(JSON.stringify({
            turn:n,
            reply:x.reply,
            semantic:{intent:e.intent, valence:e.valence, target:e.target, apology:e.apology, repairAttempt:e.repairAttempt, affection:e.affection, relationalAct:e.relationalAct, disrespect:e.disrespect, coercion:e.coercion, aggression:e.aggression, uncertainty:e.semanticUncertainty},
            relationship:{conversationState:rel.conversationState, conflict:rel.conflictScore, hurt:rel.hurtScore, repairProgress:rel.repairProgress, repeatedNegativeCount:rel.repeatedNegativeCount, repairAttempts:rel.repairAttempts, lastNegativePattern:rel.lastNegativePattern, disengageReason:rel.disengageReason},
            trace:x?.kdm?.trace?.currentMood,
          }, null, 2));
          NODE
            reply=$(node -e 'const x=require(process.argv[1]); process.stdout.write(String(x.reply||""))' "/tmp/turn_$((i+1)).json")
            history=$(node -e 'const [h,msg,reply]=process.argv.slice(1); const a=JSON.parse(h); a.push({sender:"user",text:msg,participantName:"Mert"},{sender:"assistant",text:reply,replyToParticipantName:"Mert"}); console.log(JSON.stringify(a))' "$history" "$msg" "$reply")
          done
          curl --fail-with-body --silent --show-error "$URL/api/test-sessions/$session" > /tmp/session.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/session.json','utf8'));
          const turns=x?.session?.turns || [];
          console.log('=== PERSISTED TURN TRACE ===');
          for (const t of turns) {
            const sem=t?.metadata?.semanticInterpretation || {};
            const r=t?.relationshipState || {};
            const before=t?.dynamicStateBefore?.relationship || {};
            console.log(JSON.stringify({
              user:t.userMessage,
              reply:t.assistantReply,
              before:{conversationState:before.conversationState, conflict:before.conflictScore, hurt:before.hurtScore, repairProgress:before.repairProgress, repeatedNegativeCount:before.repeatedNegativeCount, disengageReason:before.disengageReason},
              semantic:{primaryIntent:sem.primaryIntent,target:sem.target,valence:sem.valence,apology:sem.apology,repairAttempt:sem.repairAttempt,sincerityConfidence:sem.sincerityConfidence,affection:sem.affection,relationalAct:sem.discourseFacets?.relationalAct,severity:sem.severity,uncertainty:sem.uncertainty},
              after:{conversationState:r.conversationState, conflict:r.conflictScore, hurt:r.hurtScore, repairProgress:r.repairProgress, repeatedNegativeCount:r.repeatedNegativeCount,repairAttempts:r.repairAttempts,lastNegativePattern:r.lastNegativePattern,disengageReason:r.disengageReason},
              note:t?.reasoningTrace?.relationship?.note,
              mood:t?.reasoningTrace?.currentMood,
            },null,2));
          }
          NODE
      - name: Self-remove trace workflow
        if: always()
        shell: bash
        run: |
          git rm .github/workflows/one-time-final-relationship-state-trace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove final relationship trace workflow'
          git push origin HEAD:diag/final-relationship-state-trace
