name: One-time affective final delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-affective-final-delivery.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce affective HOW at final delivery
        run: |
          node scripts/one-time-affective-final-delivery.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-affective-final-delivery.mjs
          git rm .github/workflows/one-time-affective-final-delivery.yml
          git add src/services/kairoResponseConsistency.ts server.ts
          git commit -m "fix(kaira): enforce qualitative reaction HOW at delivery"
          git push
