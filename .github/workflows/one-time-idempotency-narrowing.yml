name: one-time-idempotency-narrowing
on:
  push:
    paths:
      - '.github/workflows/one-time-idempotency-narrowing.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/one-time-idempotency-narrowing.py
      - run: |
          rm -f scripts/one-time-idempotency-narrowing.py
          rm -f .github/workflows/one-time-idempotency-narrowing.yml
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(kaira): narrow idempotency wait outcome'
          git push origin HEAD:main
