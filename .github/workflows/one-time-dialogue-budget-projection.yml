name: One-time effective dialogue budget projection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Project final response budgets into dialogue prompt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/services/kairoDialogueDecisionEngine.ts')
          s = p.read_text()
          old_sig = '''export function buildDialogueDecisionInstruction(\n  plan: DialogueDecisionPlan,\n  effectiveAllowQuestion = plan.allowFollowUpQuestion,\n): string {'''
          new_sig = '''export function buildDialogueDecisionInstruction(\n  plan: DialogueDecisionPlan,\n  effectiveAllowQuestion = plan.allowFollowUpQuestion,\n  effectiveMaxSentences = plan.maxSentences,\n  effectiveMaxWords = plan.maxWords,\n): string {'''
          if old_sig not in s:
              raise SystemExit('dialogue instruction signature marker not found')
          s = s.replace(old_sig, new_sig, 1)
          s = s.replace('- Uzunluk bütçesi: en fazla ${plan.maxSentences} kısa cümle', '- Uzunluk bütçesi: en fazla ${effectiveMaxSentences} kısa cümle', 1)
          s = s.replace('- Kelime bütçesi: ${plan.maxWords ? `en fazla ${plan.maxWords} kelime` : "özel sınır yok"}', '- Kelime bütçesi: ${effectiveMaxWords ? `en fazla ${effectiveMaxWords} kelime` : "özel sınır yok"}', 1)
          p.write_text(s)

          server = Path('server.ts')
          ss = server.read_text()
          old_call = '''      dialogueDecisionInstruction = buildDialogueDecisionInstruction(\n        dialogueDecision,\n        responsePlan.allowQuestion,\n      ),'''
          new_call = '''      dialogueDecisionInstruction = buildDialogueDecisionInstruction(\n        dialogueDecision,\n        responsePlan.allowQuestion,\n        responsePlan.maxSentences,\n        responsePlan.maxWords,\n      ),'''
          if old_call not in ss:
              raise SystemExit('server dialogue instruction call marker not found')
          server.write_text(ss.replace(old_call, new_call, 1))

          t = Path('src/services/kairoDialogueDecisionEngine.test.ts')
          ts = t.read_text()
          marker = '''  it("rejects all three failed real emotional-opening replies", () => {\n'''
          addition = '''  it("renders final ResponsePlan sentence and word budgets instead of wider dialogue budgets", () => {\n    const plan = planDialogueResponse([], "bu konuda detaylı ne düşünüyorsun?", "Ali");\n    expect(plan.maxSentences).toBe(3);\n    const instruction = buildDialogueDecisionInstruction(plan, true, 1, 6);\n\n    expect(instruction).toContain("Uzunluk bütçesi: en fazla 1 kısa cümle");\n    expect(instruction).toContain("Kelime bütçesi: en fazla 6 kelime");\n    expect(instruction).not.toContain("Uzunluk bütçesi: en fazla 3 kısa cümle");\n  });\n\n'''
          if marker not in ts:
              raise SystemExit('test insertion marker not found')
          t.write_text(ts.replace(marker, addition + marker, 1))
          PY
          npm install
          npx vitest run src/services/kairoDialogueDecisionEngine.test.ts src/services/kairaResponsePlan.test.ts src/services/kairaEmotionalQuestionPermissionContracts.test.ts
          npx tsc --noEmit
          npm test
          npm run build
          rm .github/workflows/one-time-dialogue-budget-projection.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/kairoDialogueDecisionEngine.ts src/services/kairoDialogueDecisionEngine.test.ts server.ts .github/workflows/one-time-dialogue-budget-projection.yml
          git commit -m "fix(kaira): project final budgets into dialogue prompt"
          git push
