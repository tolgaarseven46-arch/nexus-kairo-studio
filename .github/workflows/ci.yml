name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Architecture contracts
        run: npm run test:contracts

      - name: Tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          npm test -- --run 2>&1 | tee /tmp/vitest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/vitest.log', 'utf8');
          const clean = raw.replace(/\u001b\[[0-9;]*m/g, '');
          const all = clean.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
          const interesting = all.filter((line) => /FAIL|AssertionError|expected|received|Error:|❯|×|toBe|toEqual|toContain|toMatch/i.test(line));
          const lines = interesting.slice(-24);
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const headers = {
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          };
          (async () => {
            for (let index = 0; index < lines.length; index += 1) {
              const description = lines[index].replace(/\s+/g, ' ').slice(0, 135);
              await fetch(`https://api.github.com/repos/${owner}/${repo}/statuses/${process.env.GITHUB_SHA}`, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  state: 'error',
                  context: `ci-detail/${String(index + 1).padStart(2, '0')}`,
                  description,
                }),
              });
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          fi
          exit "$code"

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
