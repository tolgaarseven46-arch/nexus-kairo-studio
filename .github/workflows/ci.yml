name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  live-post104-acceptance:
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/post104-live-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production conversation boundaries
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://nexus-kairo-studio.onrender.com';
          const userId = `post104_${Date.now()}`;
          const instanceId = `post104_welcome_${Date.now()}`;
          let history = [];
          const rows = [];
          const adviceSurface = /\b(?:erken\s+yat|biraz\s+dinlen|geçmen\s+lazım|dinlen\s+bence|yapmalısın|etmelisin|gitmelisin)\b/iu;
          const send = async (userMessage, turn) => {
            const response = await fetch(`${base}/api/chat`, {
              method: 'POST',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify({
                userId, userName: 'Tolga', userMessage, history,
                provider: 'openrouter', kairaInstanceId: instanceId,
                kairaInstanceType: 'welcome', suppressRecentMemory: true,
                requestId: `${userId}_${turn}`
              })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${JSON.stringify(data)}`);
            const row = {
              turn, user: userMessage, reply: String(data.reply ?? ''),
              intent: data?.kdm?.semanticEvent?.intent,
              target: data?.kdm?.semanticEvent?.target,
              dialogueMove: data?.dialogueDecision?.move,
              allowQuestion: data?.kdm?.responsePlan?.allowQuestion,
              allowAdvice: data?.kdm?.responsePlan?.allowAdvice,
              requiredContent: data?.kdm?.responsePlan?.requiredContent,
              accepted: data?.consistency?.accepted,
              issues: data?.consistency?.issues ?? []
            };
            rows.push(row);
            console.log('POST104_ROW ' + JSON.stringify(row));
            history.push({sender:'user', participantName:'Tolga', text:userMessage});
            history.push({sender:'droit', participantName:'Kaira', text:row.reply});
            return row;
          };

          await send('naber', 1);
          const mixed = await send('iyi ben de kahveyi döktüm masaya az önce', 2);
          const early = await send('yarın erken kalkıcam', 3);
          const mert = await send('bu arada Mert yine geç kaldı', 4);
          const tired = await send('bugün çok yoruldum', 5);

          const failures = [];
          if (mixed.dialogueMove === 'follow_previous_answer') failures.push('mixed_turn_still_swallowed');
          if (!mixed.accepted) failures.push('mixed_turn_not_accepted');
          if (early.allowAdvice === false && adviceSurface.test(early.reply)) failures.push('early_turn_unsolicited_advice');
          if (!early.accepted) failures.push('early_turn_not_accepted');
          if (mert.allowQuestion === false && !mert.accepted) failures.push('third_party_forbidden_question_not_repaired');
          if (mert.issues.includes('response_plan_question_blocked')) failures.push('third_party_question_issue_survived');
          if (tired.allowAdvice === false && adviceSurface.test(tired.reply)) failures.push('tired_turn_unsolicited_advice');
          if (!tired.accepted) failures.push('tired_turn_not_accepted');

          console.log('POST104_SUMMARY ' + JSON.stringify({failures, rows}));
          if (failures.length) process.exit(1);
          NODE

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Architecture contracts
        run: npm run test:contracts

      - name: Autonomous runtime contracts
        run: npx vitest run src/services/kairaActivityScheduleDispatchDiscoveryContracts.test.ts src/services/kairaAutonomousLifeWorkerRunCoordinatorContracts.test.ts src/services/kairaAutonomousLifeWorkerRunStoreContracts.test.ts src/services/kairaAutonomousLifeWorkerDurableRunCoordinatorContracts.test.ts src/services/kairaAutonomousLifeWorkerHealthContracts.test.ts src/services/kairaAutonomousLifeWorkerHealthConfigContracts.test.ts src/services/kairaAutonomousLifeWorkerRouteContracts.test.ts src/services/kairaAutonomousLifeSchedulerWorkflowContracts.test.ts src/services/kairaActivityOccupancyReadModelContracts.test.ts src/services/kairaActivityExecutionStoreContracts.test.ts src/services/kairaActivityExecutionCoordinatorContracts.test.ts src/services/kairaActivityScheduleStoreContracts.test.ts src/services/kairaActivityCatalogStoreContracts.test.ts src/services/kairaActivityPlanningTriggerInboxStoreContracts.test.ts src/services/kairaActivityDynamicStateStoreContracts.test.ts src/services/kairaActivityDynamicStateObservationCoordinatorContracts.test.ts src/services/kairaActivityPlanningSourceSnapshotContracts.test.ts src/services/kairaActivityPlanningTriggerInboxProcessorContracts.test.ts src/services/kairaAutonomousStateChatWiringContracts.test.ts

      - name: Beta runtime regression gate
        run: npm run test:beta

      - name: Beta conversation acceptance
        run: node scripts/run-beta-conversation-acceptance.mjs

      - name: Tests
        run: npm test -- --run

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

  docs-guard:
    # Riskli path'e dokunan PR, PROJECT_STATE.md veya docs/adr/** güncellemesi içermeli.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Enforce state/ADR update for risky changes
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'

          if echo "$CHANGED" | bash .github/scripts/match-risky-paths.sh > /tmp/risky.txt; then
            echo "Risky paths touched:"; sed 's/^/  /' /tmp/risky.txt
            if echo "$CHANGED" | grep -Eq '^(PROJECT_STATE\.md|docs/adr/.+\.md)$'; then
              echo "OK: PROJECT_STATE.md or docs/adr/** updated alongside risky change."
            else
              echo "::error::Riskli path degisti ama PROJECT_STATE.md veya docs/adr/** guncellenmedi."
              exit 1
            fi
          else
            echo "No risky paths touched; docs-guard passes."
          fi

  behavior-guard:
    # AI_CONTEXT.md §8 Hata Azaltma Protokolü — behavior-critical bir path'e dokunan PR
    # bir test dosyası VE bir golden/long-session regression testi içermeli.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Enforce test + golden regression for behavior changes
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'

          if echo "$CHANGED" | bash .github/scripts/match-risky-paths.sh .github/behavior-critical-paths.txt > /tmp/bc.txt; then
            echo "Behavior-critical paths touched:"; sed 's/^/  /' /tmp/bc.txt
            FAIL=0
            if ! echo "$CHANGED" | grep -Eq '^src/.+\.test\.tsx?$'; then
              echo "::error::AI_CONTEXT.md §8.10 — davranis degisti ama diff'te src/**/*.test.ts yok (fix + curutucu test zorunlu)."
              FAIL=1
            fi
            if ! echo "$CHANGED" | grep -Eq '(Regression|GoldenSession|LongSession)[A-Za-z0-9]*\.test\.tsx?$'; then
              echo "::error::AI_CONTEXT.md §8.5 — davranis degisti ama golden/long-session regression testi eklenmedi/guncellendi (*Regression* / *GoldenSession* / *LongSession*)."
              FAIL=1
            fi
            [ "$FAIL" -eq 0 ] && echo "OK: behavior change carries a test + a golden/long-session regression."
            exit "$FAIL"
          else
            echo "No behavior-critical paths touched; behavior-guard passes."
          fi