name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Architecture contracts
        run: npm run test:contracts

      - name: Autonomous runtime contracts
        run: npx vitest run src/services/kairaActivityScheduleDispatchDiscoveryContracts.test.ts src/services/kairaAutonomousLifeWorkerRunCoordinatorContracts.test.ts src/services/kairaAutonomousLifeWorkerRunStoreContracts.test.ts src/services/kairaAutonomousLifeWorkerDurableRunCoordinatorContracts.test.ts src/services/kairaAutonomousLifeWorkerHealthContracts.test.ts src/services/kairaAutonomousLifeWorkerHealthConfigContracts.test.ts src/services/kairaAutonomousLifeWorkerRouteContracts.test.ts src/services/kairaAutonomousLifeSchedulerWorkflowContracts.test.ts src/services/kairaActivityOccupancyReadModelContracts.test.ts src/services/kairaActivityExecutionStoreContracts.test.ts src/services/kairaActivityExecutionCoordinatorContracts.test.ts src/services/kairaActivityScheduleStoreContracts.test.ts src/services/kairaActivityCatalogStoreContracts.test.ts src/services/kairaActivityPlanningTriggerInboxStoreContracts.test.ts src/services/kairaActivityDynamicStateStoreContracts.test.ts src/services/kairaActivityDynamicStateObservationCoordinatorContracts.test.ts src/services/kairaActivityPlanningSourceSnapshotContracts.test.ts src/services/kairaActivityPlanningTriggerInboxProcessorContracts.test.ts src/services/kairaAutonomousStateChatWiringContracts.test.ts

      - name: Beta runtime regression gate
        run: npm run test:beta

      - name: Beta conversation acceptance
        run: npx vitest run src/services/kairaLongSessionConsistencyRegression.test.ts src/services/kairaQualitativeSpeechDifferentiationRegression.test.ts src/services/kairaControlledSpontaneityIntegrationContracts.test.ts src/services/kairaBetaConversationContinuityRegression.test.ts src/services/kairaTwentyTurnPersistenceRoundtripRegression.test.ts src/services/kairaLanguageMemorySelfDrift.test.ts src/services/kairaResponsePlanFinalAuthorityContracts.test.ts

      - name: Tests
        run: npm test -- --run

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

  docs-guard:
    # Riskli path'e dokunan PR, PROJECT_STATE.md veya docs/adr/** güncellemesi içermeli.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Enforce state/ADR update for risky changes
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"
          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'

          if echo "$CHANGED" | bash .github/scripts/match-risky-paths.sh > /tmp/risky.txt; then
            echo "Risky paths touched:"; sed 's/^/  /' /tmp/risky.txt
            if echo "$CHANGED" | grep -Eq '^(PROJECT_STATE\.md|docs/adr/.+\.md)$'; then
              echo "OK: PROJECT_STATE.md or docs/adr/** updated alongside risky change."
            else
              echo "::error::Risky path degisti ama PROJECT_STATE.md veya docs/adr/** guncellenmedi."
              exit 1
            fi
          else
            echo "No risky paths touched; docs-guard passes."
          fi
