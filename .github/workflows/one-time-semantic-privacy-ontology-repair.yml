name: One-time semantic privacy ontology repair

on:
  push:
    branches:
      - fix/semantic-privacy-ontology-social-curiosity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/semantic-privacy-ontology-social-curiosity
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Apply semantic privacy ontology repair
        run: python scripts/apply-semantic-privacy-ontology-repair.py
      - name: Complete typed replay fixture
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/services/kairaSemanticPrivacyOntologyRegression.test.ts')
          s = p.read_text(encoding='utf-8')
          old = '  surprise: 10,\n  reactionMode: "neutral",\n'
          new = '  surprise: 10,\n  lastStatus: "Sakin ve kontrollü",\n  reactionMode: "neutral",\n'
          if old not in s:
              raise SystemExit('dynamic-state fixture anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Focused API-free verification
        run: npx vitest run src/services/llmSemanticUnderstandingProvider.test.ts src/services/kairaSemanticPrivacyOntologyRegression.test.ts
      - name: Full tests
        run: npm test -- --run
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Remove one-time repair scaffolding
        run: rm .github/workflows/one-time-semantic-privacy-ontology-repair.yml scripts/apply-semantic-privacy-ontology-repair.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(kaira): distinguish privacy violation from social curiosity"
          git push origin HEAD:fix/semantic-privacy-ontology-social-curiosity
