name: One-time project state boundary downstream coverage

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-boundary-downstream-coverage.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 58. Boundary full downstream coverage — 2026-08-31\n- The CharacterTab boundary family was audited as a complete downstream system. All six boundary sliders are now explicitly covered: disrespect sensitivity, manipulation sensitivity, privacy sensitivity, assertiveness, escalation and forgiveness.\n- Added permanent `kairaBoundaryDownstreamCoverageContracts.test.ts`. It verifies exact CharacterTab key mapping and proves each slider reaches the final integrated boundary behavior in a semantically matching context.\n- Disrespect, manipulation and privacy sensitivities each change their matching violation signal and final integrated boundary pressure. Assertiveness remains live under coercion through coercion violation, boundary assertion, final boundary pressure and final directness.\n- Escalation increases escalation/disengagement pressure only after a real violation and cannot manufacture a boundary event in a neutral context. Forgiveness increases repair openness and reduces distance during genuine apology/repair, but cannot override a hard red line; hard-stop still forces disengagement with zero repair openness.\n- No additional boundary no-op was found, so no product behavior patch was required.\n- Targeted contracts, TypeScript, full regression and production build all passed.\n- Permanent coverage commit: `072ce7b` (`test(kaira): lock boundary downstream coverage`).\n- Temporary verification workflow and generator helper were removed after the successful run.\n- Next audit focus: motivation full downstream coverage, then preferences/social/personality whole-family matrices to complete the all-fine-tune coverage map.\n'''
          if '## 58. Boundary full downstream coverage — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record boundary downstream coverage"
          git pull --rebase origin main
          git push origin main
