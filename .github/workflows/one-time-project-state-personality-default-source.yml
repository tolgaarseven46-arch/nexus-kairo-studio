name: One-time project state personality default source

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-personality-default-source.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 40. Canonical personality default source consolidation — 2026-08-31\n- `NEUTRAL_DROIT_PERSONALITY` ve `droitPersonalityService.DEFAULT_PERSONALITY_TRAITS` aynı 19 trait için ayrı ayrı 50-listesi tutuyordu; bu iki sabitin zamanla drift etme riski kaldırıldı.\n- Lightweight canonical kaynak `droitPersonalityNormalizer.ts` içindeki `NEUTRAL_DROIT_PERSONALITY` olarak kaldı. Bu modül Firebase bağımlılığı taşımaz ve server runtime tarafından güvenle kullanılabilir.\n- `droitPersonalityService` public `DEFAULT_PERSONALITY_TRAITS` export adını korur ancak artık `{ ...NEUTRAL_DROIT_PERSONALITY }` üzerinden türetir; UI/persistence API compatibility bozulmaz.\n- Bağımlılık yönü yalnız persistence service → lightweight normalizer şeklindedir; server normalizer → Firebase bağımlılığı oluşmadı.\n- `kairaPersonalityDefaultSourceContracts.test.ts` canonical neutral kaynağın lightweight kalmasını ve persistence default'unun trait listesini yeniden kopyalamamasını kalıcı olarak doğrular.\n- Entegrasyon commit'i: `a50e8da` (`refactor(kaira): consolidate personality defaults`). Default-source contract, normalizer contract, TypeScript, full regression ve production build başarıyla geçti.\n- Geçici migration workflow/script kaldırıldı.\n- Sonraki audit adayı: Firestore'dan yüklenen/eski personality kayıtları `structuredPersonalityToTraits` içinde normalize edilmeden UI'a dönebiliyor; persisted legacy/out-of-range/non-finite değerlerin canonical normalizer boundary'sinden geçmesi gerekip gerekmediği koddan doğrulanacak.\n'''
          if '## 40. Canonical personality default source consolidation — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record personality default source consolidation"
          git pull --rebase origin main
          git push origin main
