name: One-time conversation state lock

on:
  push:
    paths:
      - ".github/workflows/one-time-conversation-state-lock.yml"
      - "scripts/applyConversationStateLockProjection.mjs"
      - "src/services/conversationStateLock.ts"
      - "src/services/kairaConversationStateLockContracts.test.ts"
      - "src/services/kairaPropertyContracts.test.ts"
      - "src/services/kairaStateSequenceContracts.test.ts"
      - "src/services/kairaBasePersonalityOwnershipContracts.test.ts"
      - "src/services/kairaWorldStateAppraisalIntegrationContracts.test.ts"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply conversation state lock projection
        run: node scripts/applyConversationStateLockProjection.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: State lock contract
        run: npm test -- --run src/services/kairaConversationStateLockContracts.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/kairaStateBehaviorContracts.ts src/services/kairaStateBehaviorContracts.test.ts src/services/kairaStateSequenceContracts.test.ts src/services/kairaPropertyContracts.test.ts src/services/kairaConversationAuthorityNonMutationContracts.test.ts src/services/kairaLegacyRuntimeFlagRemovalContracts.test.ts src/services/conversationStateLock.test.ts
          git add -A -- src/services/conversationStateAuthority.test.ts
          if git diff --cached --quiet; then
            echo "conversation state lock projection already applied"
            exit 0
          fi
          git commit -m "refactor(kaira): reduce conversation authority to state lock"
          git pull --rebase origin main
          git push origin main
