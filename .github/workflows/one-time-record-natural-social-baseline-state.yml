name: One-time natural social baseline state recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-record-natural-social-baseline-state.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record state and clean helpers
        run: |
          node scripts/record-natural-social-baseline-state.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/record-natural-social-baseline-state.mjs
          git rm .github/workflows/one-time-record-natural-social-baseline-state.yml
          git add PROJECT_STATE.md
          git commit -m "docs(kaira): record natural social baseline"
          git push
