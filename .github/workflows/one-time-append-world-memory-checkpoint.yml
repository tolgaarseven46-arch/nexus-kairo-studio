name: Append world memory checkpoint
on:
  push:
    branches: [chatgpt/world-memory-final-checkpoint]
permissions:
  contents: write
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chatgpt/world-memory-final-checkpoint
          fetch-depth: 0
      - shell: bash
        env:
          CHECKPOINT_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$CHECKPOINT_B64" | base64 -d >> PROJECT_STATE.md
          rm .github/workflows/one-time-append-world-memory-checkpoint.yml
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add PROJECT_STATE.md .github/workflows/one-time-append-world-memory-checkpoint.yml
          git commit -m 'docs(state): close world-memory semantic retrieval acceptance'
          git push origin HEAD:chatgpt/world-memory-final-checkpoint
