name: one-time fix dialogue social routine projection v3
'on':
  push:
    branches:
      - fix/natural-conversation-v2-quality
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/natural-conversation-v2-quality
      - name: Patch and self-remove
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/kairoDialogueDecisionEngine.ts')
          s = p.read_text()
          a = '      move: "natural_reaction",\n      allowFollowUpQuestion: false,\n      allowSpeculation: false,\n      maxSentences: 1,\n      maxWords: 10,\n      hasSupportedTargetClaim: false,\n      reason:\n        "Bu karşılıklı rutin (nasılsın/napıyorsun) bu sohbette zaten yapıldı.'
          b = '      move: "natural_reaction",\n      socialRoutine: event.socialRoutine,\n      allowFollowUpQuestion: false,\n      allowSpeculation: false,\n      maxSentences: 1,\n      maxWords: 10,\n      hasSupportedTargetClaim: false,\n      reason:\n        "Bu karşılıklı rutin (nasılsın/napıyorsun) bu sohbette zaten yapıldı.'
          c = '      move: "natural_reaction",\n      allowFollowUpQuestion: true,\n      allowSpeculation: false,\n      maxSentences: 2,\n      maxWords: 10,\n      hasSupportedTargetClaim: false,\n      reason:\n        "Kullanıcı Kaira\'nın halini veya ne yaptığını doğrudan soruyor.'
          d = '      move: "natural_reaction",\n      socialRoutine: event.socialRoutine,\n      allowFollowUpQuestion: true,\n      allowSpeculation: false,\n      maxSentences: 2,\n      maxWords: 10,\n      hasSupportedTargetClaim: false,\n      reason:\n        "Kullanıcı Kaira\'nın halini veya ne yaptığını doğrudan soruyor.'
          if a not in s or c not in s:
              raise SystemExit('projection markers not found')
          p.write_text(s.replace(a,b,1).replace(c,d,1))
          PY
          rm .github/workflows/one-time-fix-dialogue-social-routine-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/kairoDialogueDecisionEngine.ts .github/workflows/one-time-fix-dialogue-social-routine-v3.yml
          git commit -m "fix(kaira): preserve reciprocal social routine projection"
          git push origin HEAD:fix/natural-conversation-v2-quality
