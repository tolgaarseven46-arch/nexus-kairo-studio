name: One-time turn-taking social routine fix

on:
  push:
    branches: [main]
    paths:
      - scripts/oneTimeTurnTakingSocialRoutineFix.mjs
      - .github/workflows/one-time-turn-taking-social-routine-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Apply patch
        run: node scripts/oneTimeTurnTakingSocialRoutineFix.mjs
      - name: Verify focused turn-taking regressions
        run: npx vitest run src/services/kairaTurnTakingSocialRoutineContracts.test.ts src/services/kairaNaturalSocialMessageMatrixContracts.test.ts src/services/kairaLocalRoutineExpansionRegression.test.ts src/services/kairaBetaConversationContinuityRegression.test.ts src/services/kairoDialogueDecisionEngine.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Commit fix and clean helper
        run: |
          rm scripts/oneTimeTurnTakingSocialRoutineFix.mjs
          rm .github/workflows/one-time-turn-taking-social-routine-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(kaira): preserve canonical social routine moves"
          git push
