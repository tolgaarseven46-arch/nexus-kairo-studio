name: One-time relationship injury tolerance wiring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-relationship-injury-tolerance.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tolerance and clean helpers
        run: |
          node scripts/one-time-relationship-injury-tolerance.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-relationship-injury-tolerance.mjs
          git rm .github/workflows/one-time-relationship-injury-tolerance.yml
          git add src/services/kdmConsistencyEngine.ts
          git commit -m "fix(kaira): apply relationship tolerance to injury"
          git push
