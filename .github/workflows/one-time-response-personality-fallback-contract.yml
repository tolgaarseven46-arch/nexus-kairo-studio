name: One-time response personality fallback contract

on:
  push:
    paths:
      - ".github/workflows/one-time-response-personality-fallback-contract.yml"
      - "scripts/applyResponsePersonalityFallbackContract.mjs"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Narrow response personality fallback
        run: node scripts/applyResponsePersonalityFallbackContract.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Ownership contract
        run: npm test -- --run src/services/kairaBasePersonalityOwnershipContracts.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- server.ts src/services/kairaBasePersonalityOwnershipContracts.test.ts; then
            echo "response personality fallback already explicit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/kairaBasePersonalityOwnershipContracts.test.ts
          git commit -m "refactor(kaira): narrow response personality fallback"
          git pull --rebase origin main
          git push origin main
