name: One-time Semantic Context Grounding V1

on:
  push:
    branches:
      - refactor/semantic-context-grounding-v1

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[semantic-grounding-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/semantic-context-grounding-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Apply semantic context-grounding refactor
        run: python .github/scripts/one_time_semantic_context_grounding_v1.py
      - name: Verify focused regression and TypeScript
        run: |
          npm test -- --run src/services/semanticContextGroundingRegression.test.ts src/services/llmSemanticContextNonInvention.test.ts
          npx tsc --noEmit
      - name: Commit verified change and remove harness
        run: |
          git rm .github/workflows/one-time-semantic-context-grounding-v1.yml
          git rm .github/scripts/one_time_semantic_context_grounding_v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(semantic): add context grounding provenance [semantic-grounding-applied]'
          git push origin HEAD:refactor/semantic-context-grounding-v1
