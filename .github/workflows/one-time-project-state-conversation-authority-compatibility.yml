name: One-time project state conversation authority compatibility

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-conversation-authority-compatibility.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 33. Conversation authority compatibility name removal — 2026-08-31\n- Server `/api/chat` response artık `kdm.conversationAuthority` legacy compatibility alanını üretmez.\n- Canonical ilişki-state projection iç adı `conversationStateLock`; yalnız `state`, `locked`, `reason` iç seam metadata'sıdır.\n- `droitChatService` bu legacy alanı zaten `KairoChatResponse` içine taşımıyordu; Test Lab ve normal client akışları `droitChatService.sendMessage` üzerinden çalıştığı için tüketici kırılması yoktur.\n- `kairaConversationStateLockContracts.test.ts` server'da `conversationAuthority:` adının yeniden görünmesini yasaklar.\n- `kairaBehaviorProfileAuthorityContracts.test.ts` behavior profile invariant'ı compatibility isminden ayrıştırıldı; iki response yolunda canonical KDM behavior profile dönmeye devam eder.\n- Entegrasyon commit'i: `dd85d0b` (`refactor(kaira): remove conversation authority compatibility name`). State-lock contract, TypeScript, full regression ve production build başarıyla geçti.\n- Geçici compatibility migration workflow/script kaldırıldı.\n- Sonraki audit adayı: `conversationStateLock` projection'ının yalnız state→behavior seam için mi gerekli olduğu, yoksa gereksiz response/persistence/observability serialization'ı kalıp kalmadığı. Koddan doğrulanmadan kaldırılmayacak.\n'''
          if '## 33. Conversation authority compatibility name removal — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record conversation authority compatibility removal"
          git pull --rebase origin main
          git push origin main
