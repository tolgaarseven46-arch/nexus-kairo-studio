name: One-time reciprocal vocative fix

on:
  push:
    branches: [main]
    paths:
      - scripts/oneTimeReciprocalVocativeFix.mjs
      - .github/workflows/one-time-reciprocal-vocative-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply vocative fix
        run: node scripts/oneTimeReciprocalVocativeFix.mjs
      - name: Capture reciprocal regressions
        shell: bash
        run: |
          set +e
          npx vitest run src/services/kairaSession0209Regression.test.ts src/services/kairaBetaConversationContinuityRegression.test.ts src/services/kairoDialogueDecisionEngine.test.ts 2>&1 | tee reciprocal-vocative.log
          echo ${PIPESTATUS[0]} > reciprocal-vocative.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: reciprocal-vocative-diagnostic
          path: |
            reciprocal-vocative.log
            reciprocal-vocative.exit
