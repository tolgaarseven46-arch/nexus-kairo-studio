name: One-time reciprocal vocative fix

on:
  push:
    branches: [main]
    paths:
      - scripts/oneTimeReciprocalVocativeFix.mjs
      - .github/workflows/one-time-reciprocal-vocative-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply vocative fix
        run: node scripts/oneTimeReciprocalVocativeFix.mjs
      - name: Verify reciprocal regressions
        run: npx vitest run src/services/kairaSession0209Regression.test.ts src/services/kairaBetaConversationContinuityRegression.test.ts src/services/kairoDialogueDecisionEngine.test.ts
      - name: Commit fix and clean diagnostics
        run: |
          rm scripts/oneTimeReciprocalVocativeFix.mjs
          rm .github/workflows/one-time-reciprocal-vocative-fix.yml
          rm -f .github/workflows/one-time-full-test-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(kaira): preserve reciprocal social vocatives"
          git push
