name: One-time Autonomous Life Final Acceptance

on:
  push:
    branches:
      - diag/autonomous-life-final-acceptance

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Read or finish the same durable production run
        env:
          KAIRA_INTERNAL_WORKER_SECRET: ${{ secrets.KAIRA_INTERNAL_WORKER_SECRET }}
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl --silent --show-error --max-time 300 \
            -o response.json -w '%{http_code}' \
            -X POST 'https://nexus-kairo-studio.onrender.com/internal/workers/kaira/autonomous-life' \
            -H "Authorization: Bearer ${KAIRA_INTERNAL_WORKER_SECRET}" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'x-kaira-worker-run-id: final-acceptance-33902409919' \
            --data '{"limit":25}')
          cat response.json
          echo
          echo "HTTP_STATUS=${HTTP_STATUS}"
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('response.json', 'utf8'));
          const summary = body?.receipt?.summary;
          console.log(JSON.stringify({
            runId: body?.runId,
            status: body?.status,
            deliveryStatus: body?.deliveryStatus,
            planning: summary?.planning,
            recovery: summary?.recovery,
            schedules: summary?.schedules,
          }));
          if (body?.runId !== 'final-acceptance-33902409919') throw new Error('run correlation mismatch');
          if (!summary) throw new Error(`durable receipt unavailable: ${body?.status || 'unknown'}`);
          if ((summary?.planning?.failed || 0) !== 0) throw new Error('planning still has failures');
          if ((summary?.recovery?.failed || 0) !== 0) throw new Error('recovery still has failures');
          if ((summary?.schedules?.failed || 0) !== 0) throw new Error('schedules still has failures');
          NODE
