name: one-time-chat-idempotency-wiring

on:
  push:
    paths:
      - '.github/workflows/one-time-chat-idempotency-wiring.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply idempotency wiring
        run: python scripts/one-time-chat-idempotency-wiring.py
      - name: Clean one-time helper
        run: |
          rm -f scripts/one-time-chat-idempotency-wiring.py
          rm -f .github/workflows/one-time-chat-idempotency-wiring.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix(kaira): wire chat retry idempotency'
          git push origin HEAD:main
