name: One-time semantic parity state recorder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-record-semantic-path-parity-state.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record state and clean helper
        run: |
          node scripts/record-semantic-path-parity-state.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/record-semantic-path-parity-state.mjs
          git rm .github/workflows/one-time-record-semantic-path-parity-state.yml
          git add PROJECT_STATE.md
          git commit -m "docs(kaira): record semantic parity and prompt authority"
          git push
