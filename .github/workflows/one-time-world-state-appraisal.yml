name: One-time world-state appraisal integration

on:
  push:
    paths:
      - scripts/integrate-world-state-appraisal.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded appraisal integration
        run: node scripts/integrate-world-state-appraisal.mjs
      - name: Commit integration
        run: |
          if git diff --quiet -- server.ts src/services/kairaContractRegistry.ts; then
            echo "No appraisal integration changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/kairaContractRegistry.ts
          git commit -m "feat(appraisal): integrate read-only world-state reasoning at runtime"
          git push origin HEAD:main
