name: One-time project state all fine-tune matrix

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-all-fine-tune-matrix.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 63. Complete CharacterTab fine-tune downstream matrix — 2026-08-31\n- Consolidated all eight CharacterTab fine-tune families into permanent `kairaAllFineTuneDownstreamMatrixContracts.test.ts`.\n- CharacterTab currently exposes exactly 64 visible fine-tune sliders across eight behavior families: temperament 9, personality 6, motivation 8, values 8, preferences 6, social 8, boundaries 6 and expression 13. The matrix locks uniqueness, total count and per-family counts so UI additions/removals cannot silently escape coverage.\n- Every family is required to retain its permanent downstream coverage contracts. The matrix also verifies that every visible CharacterTab key is represented at the corresponding engine/coverage seam rather than merely existing in the UI.\n- Temperament is intentionally asymmetric: CharacterTab exposes 9 controls while `temperamentEngine` maintains a 13-dimension canonical model. The matrix explicitly locks all nine visible UI alias-to-canonical mappings; the additional canonical temperament dimensions remain protected by the live stateDelta and recovery/persistence contracts.\n- The one-time all-family gate ran the meta contract together with temperament panel/live/recovery coverage plus personality, motivation, value, preference, social, boundary and expression downstream contracts. Targeted all-family contracts, TypeScript, full regression and production build all passed.\n- No product behavior patch was required by the consolidated matrix.\n- Permanent matrix commit: `9a3456a` (`test(kaira): lock all fine-tune downstream matrix`).\n- Temporary matrix verification workflow and generator helper were removed after the successful run.\n- Next audit focus should move beyond single-slider no-op detection into cross-family interaction/conflict semantics: verify that higher-authority context and boundary signals correctly dominate or combine with personality, motivation, social and expression tendencies without accidental cancellation or leakage.\n'''
          if '## 63. Complete CharacterTab fine-tune downstream matrix — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record all fine-tune downstream matrix"
          git pull --rebase origin main
          git push origin main
