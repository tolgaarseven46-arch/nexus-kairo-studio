name: One-time Final Transcript Echo Guard

on:
  push:
    branches:
      - fix/final-transcript-echo-guard

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[transcript-echo-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/final-transcript-echo-guard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Apply transcript echo guard
        run: python .github/scripts/one_time_final_transcript_echo_guard.py
      - name: Verify focused regression and TypeScript
        run: |
          npm test -- --run src/services/kairoTranscriptEchoRegression.test.ts
          npx tsc --noEmit
      - name: Commit verified change and remove harness
        run: |
          git rm .github/workflows/one-time-final-transcript-echo-guard.yml
          git rm .github/scripts/one_time_final_transcript_echo_guard.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(realizer): reject internal transcript echo [transcript-echo-applied]'
          git push origin HEAD:fix/final-transcript-echo-guard
