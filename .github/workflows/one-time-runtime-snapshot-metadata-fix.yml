name: One-time runtime snapshot metadata fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run one-time runtime snapshot metadata fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/one-time-runtime-snapshot-metadata-fix.mjs
      - run: |
          rm scripts/one-time-runtime-snapshot-metadata-fix.mjs
          rm .github/workflows/one-time-runtime-snapshot-metadata-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/kdmPersistenceService.ts scripts/one-time-runtime-snapshot-metadata-fix.mjs .github/workflows/one-time-runtime-snapshot-metadata-fix.yml
          git commit -m "fix(kaira): persist complete runtime snapshot metadata"
          git push
# trigger
