name: One-time project state personality normalization

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-personality-normalization.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 37. Canonical personality normalization boundary — 2026-08-31\n- `/api/chat` doğrudan/legacy çağrılarında `personality` eksik veya partial gelebiliyordu. KDM trait/profile tarafı 50 neutral fallback kullanırken SpeechIdentity HOW hesapları trait alanlarını doğrudan aritmetiğe soktuğu için eksik değerler `NaN` üretebiliyordu.\n- `droitPersonalityNormalizer.ts` eklendi. Canonical neutral personality tüm zorunlu trait'lerde 50 kullanır; finite gönderilmiş değerleri korur, eksik canonical trait'leri 50 ile tamamlar, `NaN`/`Infinity` değerlerini kabul etmez ve finite numeric compatibility trait'lerini korur.\n- Server artık KDM öncesi `basePersonality = normalizeDroitPersonality(personality)` üretir. KDM sonrası HOW overlay'i de `normalizeDroitPersonality(incomingResponsePersonality ?? basePersonality)` ile güvenli tam personality olur.\n- Unsafe `as DroitPersonalityTraits` request-boundary cast'i kaldırıldı; runtime gerçekliği ile TypeScript contract aynı hale getirildi.\n- Normal Studio/client davranışı değişmedi; `droitChatService` tam base personality ve runtime response overlay göndermeye devam eder.\n- `droitPersonalityNormalizer.test.ts` omitted/partial/non-finite/compatibility trait senaryolarını kalıcı olarak doğrular; ownership contract normalized KDM/HOW sınırını korur.\n- Entegrasyon commit'i: `128620f` (`fix(kaira): normalize server personality boundary`). Personality boundary contractları, TypeScript, full regression ve production build başarıyla geçti.\n- Geçici migration workflow/script kaldırıldı.\n- Sonraki sadeleştirme adayı: request destructuring içindeki `personality = {}` artık normalizer `undefined` kabul ettiği için redundant olabilir; davranış değiştirmeden yalnız API boundary semantiğini netleştirecek şekilde audit edilecek.\n'''
          if '## 37. Canonical personality normalization boundary — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record canonical personality normalization"
          git pull --rebase origin main
          git push origin main
