name: Architecture Review

# Autonomous architecture review:
#  1) Risky path classifier keeps architecture-risk visibility.
#  2) Architecture status is SHA-bound and automated.
#  3) Human /arch-approve is no longer required; CI/docs/behavior guards remain authoritative.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: arch-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Match risky paths
        id: match
        run: |
          set -euo pipefail
          git fetch -q origin "${{ github.base_ref }}"
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)"
          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | bash .github/scripts/match-risky-paths.sh > /tmp/risky.txt; then
            echo "risky=true" >> "$GITHUB_OUTPUT"
          else
            echo "risky=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "list<<RISKY_EOF"
            cat /tmp/risky.txt 2>/dev/null || true
            echo "RISKY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Apply risk label + automated SHA-bound status + sticky comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RISKY: ${{ steps.match.outputs.risky }}
          RISKY_LIST: ${{ steps.match.outputs.list }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const risky = process.env.RISKY === 'true';
            const list = (process.env.RISKY_LIST || '').trim();
            const sha = process.env.HEAD_SHA;
            const short = sha.slice(0, 7);
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const LABEL = 'architecture-review-required';
            const CONTEXT = 'architecture-review';
            const MARKER = '<!-- architecture-review-bot -->';

            const current = (await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number }))
              .data.map(l => l.name);
            if (risky && !current.includes(LABEL)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [LABEL] });
            } else if (!risky && current.includes(LABEL)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: LABEL }).catch(() => {});
            }

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha,
              context: CONTEXT,
              state: 'success',
              description: risky
                ? `Risky paths detected for ${short}; automated architecture checks active`
                : `No risky paths in ${short}`,
            });

            const body = risky
              ? `${MARKER}\n⚙️ **Automated architecture review** — head \`${short}\`.\n\nRiskli değişiklikler:\n\`\`\`\n${list || '(bkz. diff)'}\n\`\`\`\n\nİnsan \`/arch-approve\` onayı gerekmiyor. Merge kararı CI, docs-guard, behavior-guard ve diğer zorunlu kontroller tarafından verilir.`
              : `${MARKER}\n✅ **Architecture review gerekmiyor** — \`${short}\` itibarıyla riskli path değişmedi.`;

            const comments = (await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 })).data;
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
