name: Run World Memory Fact Patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/world-memory-evidence-eligibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-memory-evidence-eligibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract and run patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/apply-world-memory-fact-model.yml').read_text()
          start = src.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = src.index("\n          PY\n", start)
          lines = src[start:end].splitlines()
          Path('/tmp/apply_patch.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n')
          PY
          python /tmp/apply_patch.py
      - name: Capture validation
        shell: bash
        run: |
          set +e
          npm ci > validation-debug.log 2>&1
          INSTALL=$?
          if [ "$INSTALL" -eq 0 ]; then npm test -- --run >> validation-debug.log 2>&1; TESTS=$?; else TESTS=99; fi
          if [ "$INSTALL" -eq 0 ]; then npm run typecheck >> validation-debug.log 2>&1; TYPES=$?; else TYPES=99; fi
          if [ "$INSTALL" -eq 0 ]; then npm run build >> validation-debug.log 2>&1; BUILD=$?; else BUILD=99; fi
          printf '\nRESULT install=%s tests=%s typecheck=%s build=%s\n' "$INSTALL" "$TESTS" "$TYPES" "$BUILD" >> validation-debug.log
          exit 0
      - name: Commit patched source and debug output
        shell: bash
        run: |
          rm -f .github/workflows/apply-world-memory-fact-model.yml .github/workflows/run-world-memory-fact-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "wip(kaira): capture world-memory fact validation"
          git push origin HEAD:fix/world-memory-evidence-eligibility
