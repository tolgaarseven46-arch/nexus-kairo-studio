name: Diagnose World Memory Types

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'fix/world-memory-evidence-eligibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-memory-evidence-eligibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Capture TypeScript check
        shell: bash
        run: |
          set +e
          npm run lint > type-debug.txt 2>&1
          CODE=$?
          echo "EXIT_CODE=$CODE" >> type-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f type-debug.txt
          git commit -m "chore: capture type diagnostics" || true
          git push origin HEAD:fix/world-memory-evidence-eligibility
          exit 0
