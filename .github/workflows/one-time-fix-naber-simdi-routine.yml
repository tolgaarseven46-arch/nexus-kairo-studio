name: one-time fix naber simdi social routine
on:
  push:
    branches:
      - fix/natural-conversation-v2-quality
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/natural-conversation-v2-quality
      - name: Patch canonical social routine and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          semantic = Path('src/services/semanticEventEngine.ts')
          text = semantic.read_text()
          old = r'''if (/^(?:naber|nabr|nber|nasılsın|nasıl gidiyor|nasil gidiyor|ne var ne yok|keyifler nasıl|keyifler nasil)(?:\s+(?:kaira|kairo|kank[a-zçğıöşü]*|aga|lan))?[.!?…]*$/u.test(text)) return "how_are_you";'''
          new = r'''if (/^(?:naber|nabr|nber|nasılsın|nasıl gidiyor|nasil gidiyor|ne var ne yok|keyifler nasıl|keyifler nasil)(?:\s+şimdi)?(?:\s+(?:kaira|kairo|kank[a-zçğıöşü]*|aga|lan))?[.!?…]*$/u.test(text)) return "how_are_you";'''
          if old not in text:
              raise SystemExit('social routine marker not found')
          semantic.write_text(text.replace(old, new, 1))

          test = Path('src/services/kairaNaturalConversationV2QualityRegression.test.ts')
          t = test.read_text()
          anchor = '''  it("does not force content engagement on social routines", () => {\n    const resolved = resolvedPlan(0.2, { socialRoutine: "how_are_you" });\n    expect(resolved.requiredContent).not.toContain("engage_user_content");\n  });'''
          addition = anchor + '''\n\n  it("keeps 'naber şimdi' inside the canonical how_are_you social routine", async () => {\n    const result = await understandTurkishMessage("naber şimdi");\n    expect(result.event.socialRoutine).toBe("how_are_you");\n  });'''
          if anchor not in t:
              raise SystemExit('regression anchor not found')
          test.write_text(t.replace(anchor, addition, 1))
          PY
          rm -f .github/workflows/one-time-fix-naber-simdi-routine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/semanticEventEngine.ts src/services/kairaNaturalConversationV2QualityRegression.test.ts .github/workflows/one-time-fix-naber-simdi-routine.yml
          git commit -m "fix(kaira): keep naber simdi in canonical social routine"
          git push origin HEAD:fix/natural-conversation-v2-quality
