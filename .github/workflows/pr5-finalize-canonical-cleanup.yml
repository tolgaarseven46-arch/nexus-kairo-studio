name: PR5 Finalize Canonical Cleanup

on:
  push:
    branches: [chatgpt/pr5-remove-canonical-compatibility]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Make codemod idempotent
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/pr5-finalize-canonical-cleanup.mjs')
          s = p.read_text()
          old = "  if (!s.includes(from)) throw new Error(`missing pattern in ${p}: ${from.slice(0,120)}`);\n  write(p, s.replace(from, to));"
          new = "  if (!s.includes(from)) {\n    if (s.includes(to)) return;\n    throw new Error(`missing pattern in ${p}: ${from.slice(0,120)}`);\n  }\n  write(p, s.replace(from, to));"
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Apply cleanup
        run: node scripts/pr5-finalize-canonical-cleanup.mjs
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(kaira): finalize canonical-only PR5 regressions'
          git push origin HEAD:chatgpt/pr5-remove-canonical-compatibility
