name: One-time social downstream coverage
# rerun-after-consistent-relationship-fixture

on:
  push:
    paths:
      - ".github/workflows/one-time-social-downstream-coverage.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Add social downstream coverage contracts
        run: node scripts/addSocialDownstreamCoverageContracts.mjs
      - name: Correct relationship-consistent betrayal fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/kairaSocialDownstreamCoverageContracts.test.ts')
          text = p.read_text()
          text = text.replace(
              "function integrate(social: any, semanticEvent: any = {}) {\n  return integrateBehaviorLayers({\n    personality: { humor: 50, authority: 50, empathy: 50, patience: 50, seriousness: 50, communication: 50 } as any,\n    dynamicState: { anger: 0, stress: 0, relationship: { hurtScore: 0, conflictScore: 0, conversationState: 'active' } } as any,",
              "function integrate(social: any, semanticEvent: any = {}, dynamicState: any = { anger: 0, stress: 0, relationship: { hurtScore: 0, conflictScore: 0, conversationState: 'active' } }) {\n  return integrateBehaviorLayers({\n    personality: { humor: 50, authority: 50, empathy: 50, patience: 50, seriousness: 50, communication: 50 } as any,\n    dynamicState,"
          )
          old = """  it('does not let high social openness erase betrayal-driven distance', () => {\n    const response = computeSocialOrientationResponse({ warmth: 100, empathy: 100, closenessDrive: 100, dominance: 50, initiative: 100, compliance: 100, initialTrust: 100, disclosure: 100 }, sit({ betrayalSignal: 1 }), {\n      anger: 20, stress: 20, calmness: 50, happiness: 40, confidence: 50, surprise: 10, lastStatus: 'test',\n      relationship: { warmth: 30, trust: 20, hurtScore: 80, conflictScore: 60, interactionCount: 30, repeatedNegativeCount: 3, conversationState: 'active' }\n    } as any);\n    expect(response.behaviorSignals.socialDistancePressure).toBeGreaterThan(0.5);\n    expect(integrate(response).decision.distance).toBeGreaterThan(0.2);\n  });"""
          new = """  it('does not let high social openness erase betrayal-driven distance', () => {\n    const damagedState = {\n      anger: 20, stress: 20, calmness: 50, happiness: 40, confidence: 50, surprise: 10, lastStatus: 'test',\n      relationship: { warmth: 30, trust: 20, hurtScore: 80, conflictScore: 60, interactionCount: 30, repeatedNegativeCount: 3, conversationState: 'active' }\n    } as any;\n    const response = computeSocialOrientationResponse({ warmth: 100, empathy: 100, closenessDrive: 100, dominance: 50, initiative: 100, compliance: 100, initialTrust: 100, disclosure: 100 }, sit({ betrayalSignal: 1 }), damagedState);\n    expect(response.behaviorSignals.socialDistancePressure).toBeGreaterThan(0.5);\n    expect(integrate(response, {}, damagedState).decision.distance).toBeGreaterThan(0.2);\n  });"""
          if old not in text:
              raise SystemExit('betrayal fixture marker missing')
          p.write_text(text.replace(old, new))
          PY
      - name: Targeted contracts
        run: npx vitest run src/services/kairaSocialDownstreamCoverageContracts.test.ts src/services/socialOrientationEngine.test.ts src/services/kairaSocialComplianceDisclosureWiringContracts.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Full regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/kairaSocialDownstreamCoverageContracts.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(kaira): lock social downstream coverage"
          git pull --rebase origin main
          git push origin main
