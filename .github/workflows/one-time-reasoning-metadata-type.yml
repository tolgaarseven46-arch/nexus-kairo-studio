name: One-time reasoning metadata type fix

on:
  push:
    paths:
      - scripts/fix-reasoning-metadata-type.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extend session metadata contract
        run: node scripts/fix-reasoning-metadata-type.mjs
      - name: Commit type fix
        run: |
          if git diff --quiet -- src/services/kdmPersistenceService.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/kdmPersistenceService.ts
          git commit -m "fix(reasoning): type world appraisal diagnostics metadata"
          git push origin HEAD:main
