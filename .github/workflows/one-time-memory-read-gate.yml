name: One-time language memory read gate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply read gate patch
        run: python scripts/one-time-memory-read-gate.py
      - name: Commit patch and self-clean
        run: |
          rm scripts/one-time-memory-read-gate.py
          rm .github/workflows/one-time-memory-read-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts scripts/one-time-memory-read-gate.py .github/workflows/one-time-memory-read-gate.yml
          git commit -m "fix(kaira): disable learned language reads when memory is off"
          git push
