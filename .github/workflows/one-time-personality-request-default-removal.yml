name: One-time personality request default removal

on:
  push:
    paths:
      - ".github/workflows/one-time-personality-request-default-removal.yml"
      - "scripts/applyPersonalityRequestDefaultRemoval.mjs"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove redundant personality request default
        run: node scripts/applyPersonalityRequestDefaultRemoval.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Personality ownership contract
        run: npm test -- --run src/services/droitPersonalityNormalizer.test.ts src/services/kairaBasePersonalityOwnershipContracts.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- server.ts src/services/kairaBasePersonalityOwnershipContracts.test.ts; then
            echo "personality request default already removed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/kairaBasePersonalityOwnershipContracts.test.ts
          git commit -m "refactor(kaira): remove redundant personality request default"
          git pull --rebase origin main
          git push origin main
