name: One-time project state behavior empathy summary

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-behavior-empathy-summary.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 42. Behavior empathy summary threshold scale fix — 2026-08-31\n- `droitBehaviorEngine.computeBehaviorProfile(...)` içinde `effectiveEmpathy = empathy / 100` ile 0..1 ölçeğine normalize ediliyor, fakat `dominantSummary` üretiminde `effectiveEmpathy >= 75` kontrolü kullanılıyordu. Bu koşul hiçbir zaman true olamayacağı için `Yüksek Empati` summary etiketi dead durumdaydı.\n- Summary eşiği diğer normalized behavior eşikleriyle aynı ölçeğe getirildi: `effectiveEmpathy >= 0.75`. Tone ve empathy directive eşikleri zaten 0..1 ölçeğindeydi; onlara dokunulmadı.\n- `kairaBehaviorEmpathySummaryThresholdContracts.test.ts` sınırı davranış seviyesinde doğrular: empathy 75 → `empathyLevel = 0.75` ve `Yüksek Empati` etiketi var; empathy 74 → etiket yok.\n- Entegrasyon commit'i: `aa5628e` (`fix(kaira): align empathy summary threshold scale`). Targeted regression, TypeScript, full regression ve production build başarıyla geçti.\n- Bölüm 41'in geçici docs workflow'u ve bu düzeltmenin geçici migration workflow/scripti kaldırıldı.\n- Sonraki audit adayı: `computeBehaviorProfile(...)` direct/legacy kullanımda raw trait değerlerini kendi içinde `Number(...)` ile okuyup canonical normalizer kullanmıyor. Server boundary normalize olsa da bu fonksiyon başka call-site'lardan doğrudan çağrılabiliyor; behavior engine boundary'nin canonical personality normalization sahipliğine geçirilip geçirilmeyeceği koddan doğrulanacak.\n'''
          if '## 42. Behavior empathy summary threshold scale fix — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record empathy summary threshold fix"
          git pull --rebase origin main
          git push origin main
