name: One-time social rhythm scope wiring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-social-rhythm-scope.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire social rhythm scope and clean helpers
        run: |
          node scripts/one-time-social-rhythm-scope.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-social-rhythm-scope.mjs
          git rm .github/workflows/one-time-social-rhythm-scope.yml
          git add server.ts
          git commit -m "fix(kaira): scope response rhythm to social moves"
          git push
