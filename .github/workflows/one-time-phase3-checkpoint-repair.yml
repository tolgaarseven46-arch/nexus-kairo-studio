name: One-time Phase3 Checkpoint Repair
on:
  push:
    branches: [docs/phase3-production-checkpoint]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase3-production-checkpoint
          fetch-depth: 0
      - name: Repair checkpoint text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('PROJECT_STATE.md')
          s = p.read_text()
          old = base64.b64decode('aW50ZXJwcmV0U2VtYW50aWNFdmVudChcIkVtcmUgeWFyxLFuIGhpxZ9pIGLEsXJha2FjYcSfxLFtLlwiKQ==').decode()
          new = base64.b64decode('aW50ZXJwcmV0U2VtYW50aWNFdmVudChcIkVtcmUgeWFyxLFuIGnFn2kgYsSxcmFrYWNha23EscWfLlwiKQ==').decode()
          if old not in s:
              raise SystemExit('checkpoint typo target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-time-phase3-checkpoint-repair.yml
          git add PROJECT_STATE.md
          git commit -m 'docs: fix phase3 checkpoint diagnostic text'
          git push origin HEAD:docs/phase3-production-checkpoint
