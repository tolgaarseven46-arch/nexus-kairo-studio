name: One-time project state temperament recovery persistence

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-temperament-recovery-persistence.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 55. Temperament recovery/persistence live-state wiring — 2026-08-31\n- Deep live-consumption audit found two temperament semantics that were engine-local but behaviorally dead in the real chat path. `recoverySpeed` could not affect live state because the current-event call always used `minutesSinceEvent: 0`; `attentionPersistence` only changed the intermediate `persistence` output, which `droitChatService` did not consume.\n- `RelationshipState.lastInteractionAt` is now used as the real between-turn time source. Before the new event reaction is applied, existing anger/stress are decayed according to elapsed time. `recoverySpeed` increases the decay rate while `attentionPersistence` resists that decay and retains more prior activation.\n- Immediate-event semantics remain unchanged: when no time has elapsed, recovery/persistence do not modify the current state, and the new event is still evaluated with `minutesSinceEvent: 0`. Thus recovery speed is not misused as an instant emotional dampener and persistence is not misused as extra reactivity.\n- Recovery operates only on already-existing anger/stress and cannot create negative activation from a zero state. After between-turn recovery, the ordinary temperament event `stateDelta` is applied on top of the recovered state.\n- Added `kairaTemperamentRecoveryPersistenceWiringContracts.test.ts` to verify CharacterTab key mapping, zero-time non-effect, faster recovery with high recovery speed, greater retention with high attention persistence, and zero-state safety.\n- Targeted contracts, TypeScript, full regression and production build all passed.\n- Integration commit: `1ea37af` (`fix(kaira): wire temperament recovery and persistence`).\n- Temporary migration workflow and helper script were removed after integration.\n- Next audit focus: lock all remaining temperament dimensions with a final live-state/stateDelta coverage matrix so every slider is proven behaviorally live, then move toward a comprehensive all-fine-tune end-to-end coverage matrix.\n'''
          if '## 55. Temperament recovery/persistence live-state wiring — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record temperament recovery persistence wiring"
          git pull --rebase origin main
          git push origin main
