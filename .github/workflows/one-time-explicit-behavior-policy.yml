name: One-time explicit behavior policy

on:
  push:
    paths:
      - ".github/workflows/one-time-explicit-behavior-policy.yml"
      - "scripts/applyExplicitBehaviorPolicyBoundary.mjs"
      - "src/services/behaviorPolicyInput.ts"
      - "src/services/kairaBehaviorPolicyBoundaryContracts.test.ts"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply explicit behavior policy boundary
        run: node scripts/applyExplicitBehaviorPolicyBoundary.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Authority contract
        run: npm test -- --run src/services/kairaBehaviorPolicyBoundaryContracts.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- src/services/droitChatService.ts server.ts src/services/kdmConsistencyEngine.ts; then
            echo "explicit behavior policy boundary already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/droitChatService.ts server.ts src/services/kdmConsistencyEngine.ts
          git commit -m "feat(kaira): make behavior policy explicit"
          git pull --rebase origin main
          git push origin main
