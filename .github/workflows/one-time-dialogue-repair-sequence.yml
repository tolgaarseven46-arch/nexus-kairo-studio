name: one-time-dialogue-repair-sequence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-dialogue-repair-sequence.yml'

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Apply repair sequence guard
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Focused regressions
        run: npx vitest run src/services/kairoDialogueDecisionEngine.test.ts src/services/kairaSession0209Regression.test.ts src/services/kairaNaturalSocialConsistencyContracts.test.ts src/services/kairaCurrentTurnDialogueAuthorityContracts.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/kairoDialogueDecisionEngine.ts src/services/kairoDialogueDecisionEngine.test.ts
          git rm .github/workflows/one-time-dialogue-repair-sequence.yml
          git commit -m "fix(kaira): bind dialogue repair to adjacent Kaira turn"
          git push origin main
