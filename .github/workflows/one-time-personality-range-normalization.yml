name: One-time personality range normalization

on:
  push:
    paths:
      - ".github/workflows/one-time-personality-range-normalization.yml"
      - "scripts/applyPersonalityRangeNormalization.mjs"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce personality range normalization
        run: node scripts/applyPersonalityRangeNormalization.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Personality normalizer contract
        run: npm test -- --run src/services/droitPersonalityNormalizer.test.ts src/services/kairaBasePersonalityOwnershipContracts.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- src/services/droitPersonalityNormalizer.ts src/services/droitPersonalityNormalizer.test.ts; then
            echo "personality range normalization already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/droitPersonalityNormalizer.ts src/services/droitPersonalityNormalizer.test.ts
          git commit -m "fix(kaira): enforce personality trait ranges"
          git pull --rebase origin main
          git push origin main
