name: One-time SocialAppraisal bridge rewire

on:
  push:
    branches:
      - codex/social-appraisal-bridge-rewire

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/social-appraisal-bridge-rewire
          fetch-depth: 0

      - name: Patch KDM relationship bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/services/kdmRelationshipReducerBridge.ts')
          text = path.read_text()

          anchor = 'import type { KairaAffectBaseline } from "./kairaAffectBaseline";\n'
          shared_import = 'import { socialNegativePattern } from "./socialAppraisalEngine";\n'
          if shared_import not in text:
              if anchor not in text:
                  raise SystemExit('expected import anchor missing')
              text = text.replace(anchor, anchor + shared_import, 1)

          text, n = re.subn(
              r'\nconst clamp01 = \(n: number\) => Math\.max\(0, Math\.min\(1, n\)\);',
              '',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'expected exactly one clamp01 removal, got {n}')

          pattern = re.compile(
              r'/\*\* Canonical context credibility shared with RelationshipReducer semantics\. \*/\n'
              r'function relationshipHarmConfidence\(interp: SemanticInterpretation\): number \{.*?\n\}\n\n'
              r'/\*\* Stable repeat label derived only from canonical v2 fields\. No raw-text parse\. \*/\n'
              r'export function semanticNegativePattern\(interp: SemanticInterpretation\): string \| null \{.*?\n\}\n',
              re.S,
          )
          replacement = '''/** Compatibility export; shared SocialAppraisal is the sole negative-pattern authority. */
          export function semanticNegativePattern(interp: SemanticInterpretation): string | null {
            return socialNegativePattern(interp);
          }
          '''
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'expected exactly one appraisal block replacement, got {n}')

          if 'function relationshipHarmConfidence' in text:
              raise SystemExit('local harm-confidence authority survived patch')
          if 'socialNegativePattern(interp)' not in text:
              raise SystemExit('shared appraisal delegation missing')
          if 'DEFAULT_RELATIONSHIP_REDUCER_CONFIG' not in text:
              raise SystemExit('reducer config import unexpectedly disappeared')

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/kdmRelationshipReducerBridge.ts
          git diff --cached --check
          git commit -m "refactor(appraisal): delegate KDM negative pattern to shared appraisal"
          git push origin HEAD:codex/social-appraisal-bridge-rewire
