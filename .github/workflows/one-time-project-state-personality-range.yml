name: One-time project state personality range

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-personality-range.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 39. Canonical personality range enforcement — 2026-08-31\n- Personality UI contract'ı koddan doğrulandı: hem `PersonalityTraitSlider` hem Studio `CharacterPersonalityPanel` sliderları `min=0`, `max=100` kullanır; behavior engine de traitleri 0..100 kabul edip 100'e bölerek runtime profile üretir.\n- Direct/legacy `/api/chat` payload'ları UI'ı bypass edebildiği için finite fakat aralık dışı traitler (`150`, `-20` vb.) daha önce KDM/HOW matematiğini sözleşme dışına taşıyabiliyordu.\n- `normalizeDroitPersonality` canonical traitleri ve behavior/persistence tarafından tanınan legacy personality alias'larını (`sensitivity`, `confidence`, `analytical`, `decisiveness`) 0..100 aralığına clamp eder.\n- Personality slider olmayan finite numeric compatibility metadata (`trust` gibi) bilinçli olarak clamp edilmez.\n- Normalizer contractları `150→100`, `-20→0`, legacy alias clamp'i, non-finite filtreleme ve unrelated numeric metadata preservation senaryolarını kapsar.\n- Entegrasyon commit'i: `3776fbf` (`fix(kaira): enforce personality trait ranges`). Personality contracts, TypeScript, full regression ve production build başarıyla geçti.\n- Geçici migration workflow/script kaldırıldı.\n- Sonraki audit adayı: `NEUTRAL_DROIT_PERSONALITY` ve `droitPersonalityService.DEFAULT_PERSONALITY_TRAITS` aynı 50-default listesini iki yerde tutuyor; drift riski yaratıp yaratmadığı ve tek lightweight source-of-truth'a bağlanıp bağlanamayacağı koddan doğrulanacak.\n'''
          if '## 39. Canonical personality range enforcement — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record personality range enforcement"
          git pull --rebase origin main
          git push origin main
