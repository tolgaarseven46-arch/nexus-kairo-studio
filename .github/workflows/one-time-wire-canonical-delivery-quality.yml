name: One-time wire canonical delivery quality

on:
  push:
    branches:
      - chatgpt/pr46-checkpoint-and-live-knt-quality

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/pr46-checkpoint-and-live-knt-quality
      - name: Wire external delivery checks into canonical pass and remove helper
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          text = p.read_text(encoding='utf-8')
          old = '''          epistemicContext: epistemicAccess,\n          fallbackFactory: () =>\n            buildGroundedDialogueFallback(\n'''
          new = '''          epistemicContext: epistemicAccess,\n          additionalIssueFinder: (candidateReply) => [\n            ...findKairoGroundingIssues(candidateReply, cleanHistory, userMessage),\n            ...findDialogueAttributionIssues(candidateReply, cleanHistory, userMessage, userName, dialogueAnalysis),\n            ...findDialogueDecisionIssues(candidateReply, dialogueDecision, dialogueOutputStyle),\n            ...findKairoResponseRhythmIssues(candidateReply, cleanHistory, dialogueDecision.move, speech.relationshipLevel),\n          ],\n          fallbackFactory: () =>\n            buildGroundedDialogueFallback(\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('target canonical AI constraint call not found')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/one-time-wire-canonical-delivery-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts .github/workflows/one-time-wire-canonical-delivery-quality.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(kaira): enforce final delivery quality before send"
          git push origin HEAD:chatgpt/pr46-checkpoint-and-live-knt-quality
