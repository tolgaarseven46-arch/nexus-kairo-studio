name: One-time project state PR41-44 checkpoint

on:
  push:
    branches:
      - chatgpt/project-state-pr41-44-production-checkpoint

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chatgpt/project-state-pr41-44-production-checkpoint
          fetch-depth: 0
      - name: Append verified checkpoint and remove helper
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text(encoding='utf-8')
          marker = '## 138. Canonical semantic-provider production quality stabilization — PR #41–#44 — 2026-09-04'
          if marker not in text:
              text += '''\n\n## 138. Canonical semantic-provider production quality stabilization — PR #41–#44 — 2026-09-04\n- PR #41 merged as commit `1e8c53a9c0269a4160b4643ab4adb55957fd30f1`. A permanent nine-family recorded semantic-provider matrix now locks natural Turkish field semantics at the canonical ingestion boundary: social routine, emotional opening, generic complaint without repair, typed clarification repair, conversation recall, third-party reported insult, lone target-ambiguous insult, question-only stop and explicit advice request.\n- PR #42 merged as commit `2f4595677ed41a8fab7f9308a6e045be3835ea4a`. KNT persistence/UI now expose the exact canonical `SemanticInterpretation@2` snapshot plus semantic source/provider per turn, so live provider drift can be diagnosed without downstream reparsing.\n- First deployed production smoke against `/api/language-understanding` measured 6/9 families passing and isolated producer-side drift only. No downstream KDM/relationship/dialogue policy workaround was added.\n- PR #43 merged as commit `ede6e6c8662cea44dd0efffece83a9c762b9ede5`. Provider-boundary invariants now require prior assistant context + confusion/challenge semantics for repair, keep `stopRequest` identical to `stopTalking`, and remove stray `stop_request` social acts when full conversation stop is false. Prompt counterexamples also preserve third-party reported insult, widen lone-insult uncertainty and keep generic complaints from manufacturing repair. Full CI + Architecture Review passed.\n- After PR #43 deployed, the same live production smoke improved to 8/9. The only remaining measured drift was `naber kaira`: `target:kaira` and `socialRoutine:how_are_you` were correct while the model sometimes emitted `primaryIntent:smalltalk` instead of the recorded canonical `greeting`.\n- PR #44 merged as commit `f4594cc689b2e05a78c87959776642568562334f`. The provider prompt now explicitly maps `naber` / `nasılsın` to `primaryIntent:greeting + socialRoutine:how_are_you`; provider-boundary field consistency normalizes a typed `how_are_you` routine to `greeting` without reparsing raw text. Full tests, TypeScript, production build, behavior/docs guards and Architecture Review passed.\n- Render deploy `dep-dad4k515efls73eucde0` became live from the exact PR #44 merge commit. The final one-time production smoke then passed **9/9** families with `semanticSource:semantic_provider` / `semanticProvider:llm_semantic_openrouter`; failed case list was empty.\n- Temporary live-smoke workflow/branch content was reset to `main`; no one-time smoke workflow remains in the branch state. Semantic-provider stabilization is therefore closed unless a new measured production regression appears.\n\n### Current verified checkpoint\n- PR #30–#44 are complete and merged. Do not reopen C1/C2, repetition, emotional-load or semantic-provider stabilization without a new measured regression.\n- Canonical runtime still has one semantic authority: provider-produced `SemanticInterpretation@2` plus deterministic grounded projection. Downstream policy is not allowed to compensate for provider classification drift by reparsing raw text.\n- Production semantic ingestion is live on Render at commit `f4594cc689b2e05a78c87959776642568562334f` and the verified nine-family smoke is 9/9.\n\n### Next verified development question\n- Return to higher-level product behavior validation. Use the now-observable canonical semantic snapshots in real multi-turn KNT sessions to measure end-to-end natural conversation quality, speech-identity consistency and long-session behavior. Patch only failures that are reproduced in the live canonical path; do not add speculative semantic rules.\n'''
              p.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/one-time-project-state-pr41-44.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md .github/workflows/one-time-project-state-pr41-44.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(state): record semantic provider production checkpoint"
          git push origin HEAD:chatgpt/project-state-pr41-44-production-checkpoint
