name: One-time current self fact query ontology

on:
  push:
    branches:
      - fix/current-self-fact-query-ontology

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/current-self-fact-query-ontology
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Apply narrow ontology repair
        run: node scripts/apply-current-self-fact-query-ontology.mjs
      - name: Focused API-free verification
        run: npx vitest run src/services/kairaCurrentSelfFactQueryOntologyRegression.test.ts src/services/kairaSelfMemoryQueryContracts.test.ts src/services/llmSemanticUnderstandingProvider.test.ts src/services/kairaStructuredMemoryOntologyContracts.test.ts
      - name: Full tests
        run: npm test -- --run
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Remove one-time tooling
        run: rm .github/workflows/one-time-current-self-fact-query-ontology.yml scripts/apply-current-self-fact-query-ontology.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(kaira): define current self fact query ontology"
          git push origin HEAD:fix/current-self-fact-query-ontology
