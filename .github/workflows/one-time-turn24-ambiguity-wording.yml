name: One-time Turn24 typed ambiguity wording
on:
  push:
    branches: [codex/turn24-ongoing-user-event-continuity]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/turn24-ongoing-user-event-continuity
          fetch-depth: 0
      - shell: python
        run: |
          from pathlib import Path

          p = Path('src/services/discourseStateReducer.ts')
          s = p.read_text()
          start_marker = '  } else if (state.ambiguousThreadResumption) {\n'
          end_marker = '  if (state.selfRepeat) {\n'
          a = s.index(start_marker)
          b = s.index(end_marker, a)
          block = '''  } else if (state.ambiguousThreadResumption) {
            const thirdPartyCandidates = state.openThreads.filter(
              (thread) => thread.kind === "third_party_topic",
            ).length;
            const userEventCandidates = state.openThreads.filter(
              (thread) => thread.kind === "user_event_topic",
            ).length;
            const ambiguityLabel =
              thirdPartyCandidates > 1 && userEventCandidates <= 1
                ? "birden fazla açık üçüncü-kişi konusu"
                : userEventCandidates > 1 && thirdPartyCandidates <= 1
                  ? "birden fazla açık kullanıcı-olay konusu"
                  : "birden fazla açık konuşma konusu";
            lines.push(
              `- Kullanıcının dönüş yapabileceği ${ambiguityLabel} var. Hangisini kastettiğini UYDURMA; gerekiyorsa kısa netleştirme iste.`,
            );
          }
          '''
          p.write_text(s[:a] + block + s[b:])

          p = Path('src/services/kairaOngoingUserEventContinuityRegression.test.ts')
          s = p.read_text()
          s = s.replace(
            'import { reduceDiscourseState } from "./discourseStateReducer";',
            'import { buildDiscourseObservationalInstruction, reduceDiscourseState } from "./discourseStateReducer";',
            1,
          )
          needle = '    expect(discourse.ambiguousThreadResumption).toBe(true);\n'
          insert = needle + '''    expect(buildDiscourseObservationalInstruction(discourse)).toContain(
              "birden fazla açık kullanıcı-olay konusu",
            );
          '''
          idx = s.rfind(needle)
          if idx < 0:
            raise SystemExit('ambiguity test assertion seam missing')
          s = s[:idx] + insert + s[idx + len(needle):]
          p.write_text(s)

          q = Path('.github/workflows/one-time-turn24-ambiguity-wording.yml')
          if q.exists(): q.unlink()
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(dialogue): preserve typed ambiguity wording"
          git push origin HEAD:codex/turn24-ongoing-user-event-continuity
