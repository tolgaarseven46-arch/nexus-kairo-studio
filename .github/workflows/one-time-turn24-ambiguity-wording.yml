name: One-time Turn24 typed ambiguity wording
on:
  push:
    branches: [codex/turn24-ongoing-user-event-continuity]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/turn24-ongoing-user-event-continuity
          fetch-depth: 0
      - shell: python
        run: |
          from pathlib import Path

          p = Path('src/services/discourseStateReducer.ts')
          s = p.read_text()
          old = '''  } else if (state.ambiguousThreadResumption) {
            lines.push(
              `- Kullanıcının dönüş yapabileceği birden fazla açık konuşma konusu var. Hangisini kastettiğini UYDURMA; gerekiyorsa kısa netleştirme iste.`,
            );
          }
          '''
          new = '''  } else if (state.ambiguousThreadResumption) {
            const thirdPartyCandidates = state.openThreads.filter(
              (thread) => thread.kind === "third_party_topic",
            ).length;
            const userEventCandidates = state.openThreads.filter(
              (thread) => thread.kind === "user_event_topic",
            ).length;
            const ambiguityLabel =
              thirdPartyCandidates > 1 && userEventCandidates <= 1
                ? "birden fazla açık üçüncü-kişi konusu"
                : userEventCandidates > 1 && thirdPartyCandidates <= 1
                  ? "birden fazla açık kullanıcı-olay konusu"
                  : "birden fazla açık konuşma konusu";
            lines.push(
              `- Kullanıcının dönüş yapabileceği ${ambiguityLabel} var. Hangisini kastettiğini UYDURMA; gerekiyorsa kısa netleştirme iste.`,
            );
          }
          '''
          if old not in s:
            raise SystemExit('ambiguity wording seam missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/services/kairaOngoingUserEventContinuityRegression.test.ts')
          s = p.read_text()
          old_import = 'import { reduceDiscourseState } from "./discourseStateReducer";'
          new_import = 'import { buildDiscourseObservationalInstruction, reduceDiscourseState } from "./discourseStateReducer";'
          if old_import not in s:
            raise SystemExit('test import seam missing')
          s = s.replace(old_import, new_import, 1)
          old_assert = '''    expect(discourse.resumedThreadId).toBeNull();
            expect(discourse.activeThreadId).toBeNull();
            expect(discourse.ambiguousThreadResumption).toBe(true);
          });
          });
          '''
          new_assert = '''    expect(discourse.resumedThreadId).toBeNull();
            expect(discourse.activeThreadId).toBeNull();
            expect(discourse.ambiguousThreadResumption).toBe(true);
            expect(buildDiscourseObservationalInstruction(discourse)).toContain(
              "birden fazla açık kullanıcı-olay konusu",
            );
          });
          });
          '''
          if old_assert not in s:
            raise SystemExit('test assertion seam missing')
          p.write_text(s.replace(old_assert, new_assert, 1))

          q = Path('.github/workflows/one-time-turn24-ambiguity-wording.yml')
          if q.exists(): q.unlink()
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(dialogue): preserve typed ambiguity wording"
          git push origin HEAD:codex/turn24-ongoing-user-event-continuity
