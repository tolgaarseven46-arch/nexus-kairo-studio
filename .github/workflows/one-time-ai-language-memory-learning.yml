name: One-time AI language-memory learning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-ai-language-memory-learning.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire accepted AI replies into language memory
        run: |
          node scripts/one-time-ai-language-memory-learning.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-ai-language-memory-learning.mjs
          git rm .github/workflows/one-time-ai-language-memory-learning.yml
          git add server.ts
          git commit -m "fix(kaira): learn accepted AI reply language"
          git push
