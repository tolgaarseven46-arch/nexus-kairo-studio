name: One-time language-memory state recorder
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record state
        run: node scripts/record-language-memory-108-111.mjs
      - name: Commit and self-clean
        run: |
          rm scripts/record-language-memory-108-111.mjs .github/workflows/one-time-record-language-memory-108-111.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md scripts/record-language-memory-108-111.mjs .github/workflows/one-time-record-language-memory-108-111.yml
          git commit -m "docs(kaira): record language-memory adaptation state"
          git push
