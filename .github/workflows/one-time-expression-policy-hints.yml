name: One-time expression policy hints

on:
  push:
    paths:
      - ".github/workflows/one-time-expression-policy-hints.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply expression policy hints fix
        run: node scripts/applyExpressionPolicyHintsFix.mjs
      - name: Targeted contracts
        run: npx vitest run src/services/kairaExpressionPolicyHintsContracts.test.ts src/services/expressionStyleEngine.test.ts src/services/behaviorIntegrationEngine.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Full regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/behaviorPolicyInput.ts src/services/droitChatService.ts src/services/kairoSpeechIdentity.ts server.ts src/services/kairaExpressionPolicyHintsContracts.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(kaira): carry expression style into speech identity"
          git pull --rebase origin main
          git push origin main
