name: One-time finalize local language learning

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move local learning to final accepted delivery
        shell: python
        run: |
          from pathlib import Path
          import re

          local_path = Path('src/services/kairoLocalLanguageEngine.ts')
          local = local_path.read_text()
          old_import = 'import { chooseLanguageReply, learnLanguageReply } from "./kairoLanguageMemory";'
          if old_import not in local:
              raise SystemExit('local language memory import seam not found')
          local = local.replace(old_import, 'import { chooseLanguageReply } from "./kairoLanguageMemory";', 1)
          old_learn = '  learnLanguageReply(userId, reply);\n  return { handled: true, intent, reply, confidence: intent === "emotional_opening" ? 0.96 : 0.97, source: "local_language", normalization };'
          if old_learn not in local:
              raise SystemExit('local pre-delivery learning seam not found')
          local = local.replace(old_learn, '  return { handled: true, intent, reply, confidence: intent === "emotional_opening" ? 0.96 : 0.97, source: "local_language", normalization };', 1)
          local_path.write_text(local)

          server_path = Path('server.ts')
          server = server_path.read_text()
          pattern = r'(issues: \[\.\.\.localBaseConsistency\.issues, \.\.\.localPlanIssues\],\n\s*},\n)(\s*postStart = now\(\);)'
          replacement = r'\1        if (kairaPolicy.persistentUserMemory && consistency.accepted) {\n          learnLanguageReply(stateUserId, reply);\n        }\n\2'
          server, count = re.subn(pattern, replacement, server, count=1)
          if count != 1:
              raise SystemExit(f'expected one local final-learning seam, changed {count}')
          server_path.write_text(server)
      - name: Commit migration and self-clean
        run: |
          rm .github/workflows/one-time-finalize-local-language-learning.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/kairoLocalLanguageEngine.ts .github/workflows/one-time-finalize-local-language-learning.yml
          git commit -m "fix(kaira): learn local language only after accepted delivery"
          git push
