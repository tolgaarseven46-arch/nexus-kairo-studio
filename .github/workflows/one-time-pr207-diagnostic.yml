name: One-time PR207 diagnostic

on:
  push:
    branches:
      - codex/request-idless-chat-serialization

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/request-idless-chat-serialization
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Capture full-suite failure
        shell: bash
        run: |
          set +e
          npm install --ignore-scripts
          npm test -- --run > /tmp/pr207-test.log 2>&1
          STATUS=$?
          {
            echo "TEST_EXIT_CODE=$STATUS"
            echo "===== FAILURE SUMMARY ====="
            grep -n -E "FAIL|AssertionError|expected|received|Error:|Test Files|Tests" /tmp/pr207-test.log | tail -n 160 || true
            echo "===== LOG TAIL ====="
            tail -n 500 /tmp/pr207-test.log
          } > pr207-diagnostic.txt
          rm .github/workflows/one-time-pr207-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pr207-diagnostic.txt .github/workflows/one-time-pr207-diagnostic.yml
          git commit -m "chore: capture PR207 full-suite diagnostic"
          git push origin HEAD:codex/request-idless-chat-serialization
