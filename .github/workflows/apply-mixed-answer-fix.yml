name: Apply Mixed Answer Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-mixed-answer-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply typed discourse fix and regression
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/services/discourseStateReducer.ts')
          s = p.read_text(encoding='utf-8')
          old = '''function startsNewTopic(event: SemanticEvent): boolean {
  return (
    event.discourseAct === "topic_shift" ||
    event.intent === "information_request" ||
    event.intent === "emotional_share" ||
    ((event.socialRoutine ?? "none") === "none" &&
      event.discourseAct === "none" &&
      !isShortIntent(event))
  );
}

function isShortIntent(event: SemanticEvent): boolean {
  return (
    event.intent === "greeting" ||
    event.intent === "general_chat" ||
    (event.socialRoutine ?? "none") !== "none"
  );
}
'''
          new = '''function startsNewTopic(event: SemanticEvent, message: string): boolean {
  return (
    event.discourseAct === "topic_shift" ||
    event.intent === "information_request" ||
    event.intent === "emotional_share" ||
    ((event.socialRoutine ?? "none") === "none" &&
      event.discourseAct === "none" &&
      !isShortIntent(event, message))
  );
}

function isShortIntent(event: SemanticEvent, message: string): boolean {
  return (
    event.intent === "greeting" ||
    (event.intent === "general_chat" && isShort(message)) ||
    (event.socialRoutine ?? "none") !== "none"
  );
}
'''
          if old not in s:
            raise SystemExit('startsNewTopic block not found')
          s = s.replace(old, new)
          old = '''    const responseEvidence = contextualAnswer || (!isOwnRoutine && explicitDependency);
    // A canonical semantic label such as complaint/general_chat must not erase a
    // stronger turn-taking fact: a state-shaped answer to Kaira's still-pending
    // question remains dependent on that question. Only treat it as a new topic
    // when there is no contextual/explicit response evidence.
    const unambiguousNewTopic = startsNewTopic(turn.event) && !responseEvidence;
'''
          new = '''    const responseEvidence = contextualAnswer || (!isOwnRoutine && explicitDependency);
    // A state-shaped prefix may answer Kaira's pending question while the same
    // turn also carries independently substantive content. In that mixed case,
    // close the pending question but do not let turn-taking context erase the
    // new canonical content. This is discourse structure only: no raw-text
    // semantic classification or downstream reinterpretation is introduced.
    const mixedAnswerCarriesIndependentContent =
      contextualAnswer &&
      !explicitDependency &&
      startsNewTopic(turn.event, turn.message);
    const unambiguousNewTopic =
      startsNewTopic(turn.event, turn.message) &&
      (!responseEvidence || mixedAnswerCarriesIndependentContent);
'''
          if old not in s:
            raise SystemExit('responseEvidence block not found')
          s = s.replace(old, new)
          old = '''    if (kairaPending && (respondsToKaira || act === "answer")) {
      pendingQuestion = { ...kairaPending, answered: true };
    }
'''
          new = '''    if (kairaPending && (contextualAnswer || respondsToKaira || act === "answer")) {
      pendingQuestion = { ...kairaPending, answered: true };
    }
'''
          if old not in s:
            raise SystemExit('pending block not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          t = Path('src/services/discourseStateReducer.test.ts')
          s = t.read_text(encoding='utf-8')
          anchor = '''  it("a fresh greeting is NOT a previous-turn dependency", () => {
'''
          test = '''  it("closes a pending how-are-you question without swallowing substantive mixed-turn content", () => {
    const asked = fold(u("naber"), k("iyi valla sen nasılsın"));
    const message = "iyi ben de kahveyi döktüm masaya az önce";
    const base = interpretSemanticEvent(message);
    const mixed = reduceDiscourseState(asked, {
      actor: "user",
      message,
      event: {
        ...base,
        intent: "general_chat",
        target: "event",
        socialRoutine: "none",
        discourseAct: "none",
        repairSignal: "none",
      },
    });
    expect(mixed.pendingQuestion).toMatchObject({ asker: "kaira", answered: true });
    expect(mixed.previousTurnDependency).toBeNull();
  });

'''
          if anchor not in s:
            raise SystemExit('test anchor not found')
          s = s.replace(anchor, test + anchor)
          t.write_text(s, encoding='utf-8')

          Path('.github/workflows/apply-mixed-answer-fix.yml').unlink()
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "tolgaarseven46-arch"
          git config user.email "tolgaarseven46@gmail.com"
          git add -A
          git commit -m "fix(kaira): preserve substantive mixed-answer turns"
          git push origin HEAD:${{ github.head_ref }}
