name: One-time project state temperament live coverage

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-temperament-live-coverage.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 56. Temperament full live-state coverage — 2026-08-31\n- After wiring recovery speed and attention persistence in section 55, the remaining eleven immediate-response temperament dimensions were audited at the live `stateDelta` boundary instead of being accepted from engine-local intermediate values.\n- Added permanent `kairaTemperamentLiveCoverageContracts.test.ts` covering negative sensitivity, frustration sensitivity, threat sensitivity, reactivity threshold, reward sensitivity, impulse strength, inhibitory control, arousal baseline, novelty seeking, uncertainty tolerance and approach-drive bias.\n- Each slider was tested in a semantically matching event context and shown to produce a measurable downstream difference in immediate activation and/or the final state delta consumed by the live chat path. No additional temperament no-op was found, so no further product behavior patch was needed.\n- Together with `kairaTemperamentRecoveryPersistenceWiringContracts.test.ts`, all thirteen stable temperament dimensions now have explicit downstream behavioral coverage: eleven immediate-response dimensions plus recovery speed and attention persistence across turns.\n- Targeted contracts, TypeScript, full regression and production build all passed.\n- Permanent coverage commit: `18985a1` (`test(kaira): lock temperament live coverage`).\n- Temporary verification workflow and generator helper were removed after the successful run.\n- Next audit focus: build an all-fine-tune coverage matrix across personality, temperament, motivations, values, preferences, social orientation, boundaries and expression. The matrix should distinguish key mapping, engine-local effect, final integrated effect and context gating so future sliders cannot regress into silent no-ops.\n'''
          if '## 56. Temperament full live-state coverage — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record temperament full live coverage"
          git pull --rebase origin main
          git push origin main
