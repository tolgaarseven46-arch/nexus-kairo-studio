name: PR59 checkpoint
on:
  push:
    branches:
      - docs/pr59-production-checkpoint
permissions:
  contents: write
jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: docs/pr59-production-checkpoint
          fetch-depth: 0
      - name: Apply checkpoint
        run: |
          cat .github/pr59-project-state-fragment.md >> PROJECT_STATE.md
          rm .github/pr59-project-state-fragment.md
          rm .github/workflows/one-time-pr59-project-state.yml
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add PROJECT_STATE.md .github/pr59-project-state-fragment.md .github/workflows/one-time-pr59-project-state.yml
          git commit -m "docs(state): close relationship accountability production acceptance"
          git push origin HEAD:docs/pr59-production-checkpoint
