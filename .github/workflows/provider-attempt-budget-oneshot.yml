name: Provider Attempt Budget One-shot

on:
  push:
    branches: [codex/provider-attempt-cost-safety]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(provider): apply one-shot cost-safety patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/provider-attempt-cost-safety
      - name: Apply bounded provider attempt patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server_path = Path('server.ts')
          server = server_path.read_text()

          start = server.index('async function callOpenRouter')
          end = server.index('type AiProviderUsed', start)
          provider_block = '''const KAIRA_PROVIDER_MAX_OUTBOUND_ATTEMPTS = 2;
type KairaProviderAttemptBudget = {
  used: number;
  max: number;
};
function createKairaProviderAttemptBudget(): KairaProviderAttemptBudget {
  return { used: 0, max: KAIRA_PROVIDER_MAX_OUTBOUND_ATTEMPTS };
}
function consumeKairaProviderAttempt(
  budget: KairaProviderAttemptBudget,
  provider: "openrouter" | "gemini",
) {
  if (budget.used >= budget.max) {
    throw new Error(
      `Provider attempt budget exhausted before ${provider} call (${budget.used}/${budget.max}).`,
    );
  }
  budget.used += 1;
}
async function callOpenRouter(
  messages: any[],
  temperature: number,
  attemptBudget: KairaProviderAttemptBudget,
) {
  const key = process.env.OPENROUTER_API_KEY;
  if (!key) throw new Error("OPENROUTER_API_KEY bulunamadı.");
  const freeModel = "openrouter/free";
  const primaryModel = process.env.OPENROUTER_MODEL?.trim() || freeModel;
  const requestModel = async (model: string, maxTokens?: number) => {
    consumeKairaProviderAttempt(attemptBudget, "openrouter");
    const response = await fetch(
      "https://openrouter.ai/api/v1/chat/completions",
      {
        method: "POST",
        headers: {
          Authorization: `Bearer ${key.trim()}`,
          "Content-Type": "application/json",
          "X-Title": "NEXUS Kairo Studio",
        },
        body: JSON.stringify({
          model,
          messages,
          temperature,
          ...(maxTokens ? { max_tokens: maxTokens } : {}),
        }),
      },
    );
    const data = await response.json().catch(() => ({}));
    return { response, data };
  };

  let { response, data } = await requestModel(primaryModel);
  let text = response.ok ? extractOpenRouterText(data) : "";
  let shouldRecover = false;
  let recoveryMaxTokens: number | undefined;

  if (!response.ok) {
    const affordableTokens = Number(
      String(data?.error?.message || "").match(/can only afford\\s+(\\d+)/i)?.[1],
    );
    if (affordableTokens >= 40) {
      shouldRecover = true;
      recoveryMaxTokens = Math.max(32, affordableTokens - 8);
    } else {
      throw new Error(
        data?.error?.message || `OpenRouter hatası: HTTP ${response.status}`,
      );
    }
  } else if (!text) {
    shouldRecover = true;
  }

  if (shouldRecover) {
    ({ response, data } = await requestModel(primaryModel, recoveryMaxTokens));
    if (!response.ok)
      throw new Error(
        data?.error?.message || `OpenRouter hatası: HTTP ${response.status}`,
      );
    text = extractOpenRouterText(data);
  }

  if (!text) throw new Error("OpenRouter boş yanıt döndürdü.");
  return text;
}
async function callGemini(
  system: string,
  messages: any[],
  attemptBudget: KairaProviderAttemptBudget,
) {
  consumeKairaProviderAttempt(attemptBudget, "gemini");
  const response = await getGeminiClient().models.generateContent({
    model: "gemini-3.6-flash",
    contents: messages.map((m) => ({
      role: m.role === "assistant" ? "model" : "user",
      parts: [{ text: m.content }],
    })),
    config: { systemInstruction: system },
  });
  return (response?.text || "").trim();
}
'''
          server = server[:start] + provider_block + server[end:]

          start = server.index('async function generateTextResult')
          end = server.index('async function generateText(', start)
          generate_block = '''async function generateTextResult(
  system: string,
  messages: any[],
  temperature: number,
  preferredProvider: string,
): Promise<GeneratedTextResult> {
  const hasOpenRouter = Boolean(process.env.OPENROUTER_API_KEY?.trim());
  const hasGemini = Boolean(process.env.GEMINI_API_KEY?.trim());
  const attemptBudget = createKairaProviderAttemptBudget();

  if (preferredProvider === "openrouter" && hasOpenRouter) {
    try {
      const text = await callOpenRouter(
        [{ role: "system", content: system }, ...messages],
        temperature,
        attemptBudget,
      );
      return { text, providerUsed: "openrouter" };
    } catch (openRouterErr) {
      console.warn("[Provider] OpenRouter failed, falling back to Gemini:", openRouterErr);
      if (hasGemini && attemptBudget.used < attemptBudget.max) {
        const text = await callGemini(system, messages, attemptBudget);
        return { text, providerUsed: "gemini" };
      }
      throw openRouterErr;
    }
  }

  if (hasGemini) {
    const text = await callGemini(system, messages, attemptBudget);
    return { text, providerUsed: "gemini" };
  }

  if (hasOpenRouter) {
    const text = await callOpenRouter(
      [{ role: "system", content: system }, ...messages],
      temperature,
      attemptBudget,
    );
    return { text, providerUsed: "openrouter" };
  }

  throw new Error("Yapay zeka anahtarı (GEMINI_API_KEY veya OPENROUTER_API_KEY) bulunamadı.");
}
'''
          server = server[:start] + generate_block + server[end:]
          server_path.write_text(server)

          state_path = Path('PROJECT_STATE.md')
          state = state_path.read_text()
          section13 = state.index('## 13. Canonical behavior-situation authority')
          checkpoint = state.index('## 14. Güncel checkpoint', section13)
          replacement = '''## 13. Canonical behavior-situation authority — CLOSED
- PR #230 merge commit `4aaf8e6ab597fd28218f27159bc2c1950e62de6f` ile `main`e alındı.
- Personality, motivation, values, preferences, social orientation ve expression-style motorlarındaki downstream raw-text semantic reparse kaldırıldı.
- `projectCanonicalBehaviorSituations()` canonical `SemanticInterpretation@2` üzerinden typed situation üretip behavior motorlarına dağıtıyor.
- Dyadic hostility/coercion yalnız canonical `target === "kaira"` olduğunda Kaira-user davranış baskısına dönüşüyor; third-party isolation regression ile kilitli.
- Full CI, TypeScript, production build ve Architecture Review GREEN.

## 14. Provider outbound attempt cost-safety — ACTIVE PR #231
- Deterministic server audit, tek generation'ın OpenRouter initial + affordable-token retry + empty-response retry + Gemini fallback üzerinden birden fazla ücretli outbound çağrıya dönüşebildiğini doğruladı.
- Canlı provider/API keşif çağrısı yapılmadı; risk statik/runtime-control contract ile ölçüldü.
- Yeni invariant: generation başına toplam en fazla `2` outbound provider attempt = primary + tek recovery.
- Same-provider retry ile cross-provider fallback aynı shared budget'ı tüketir; ikinci recovery/üçüncü ücretli çağrı yoktur.
- Bu değişiklik yalnız provider orchestration/cost-safety sınırındadır; canonical semantic/KDM authority değişmez.
- RED contract: `kairaProviderAttemptBudgetContracts.test.ts`.

'''
          state = state[:section13] + replacement + state[checkpoint:]
          state = state.replace('## 14. Güncel checkpoint', '## 15. Güncel checkpoint', 1)
          state = state.replace('- PR #230 canonical behavior-situation authority düzeltmesini doğruluyor; full CI + Architecture Review GREEN olmadan merge edilmeyecek.\n', '- PR #230 CLOSED; canonical behavior-situation authority `main` üzerinde doğrulandı.\n')
          state = state.replace('- Server tarafındaki provider retry/fallback maliyet davranışı ayrı cost-safety incelemesinde takip edilmeli; canlı keşif çağrısı yapılmamalı.\n', '- PR #231 provider retry/fallback cost-safety hattını deterministic olarak doğruluyor; canlı keşif çağrısı yapılmıyor.\n')
          state = state.replace('- Yeni production patch yalnız ölçülmüş RED failure sonrası açılmalı.\n', '- PR #231 sonrası yeni production patch yine yalnız ölçülmüş RED failure sonrası açılmalı.\n')
          state_path.write_text(state)
          PY

          rm .github/workflows/provider-attempt-budget-oneshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts PROJECT_STATE.md .github/workflows/provider-attempt-budget-oneshot.yml
          git commit -m "fix(provider): enforce shared outbound attempt budget"
          git push origin HEAD:codex/provider-attempt-cost-safety
