name: Provider Attempt Budget One-shot

on:
  push:
    branches: [codex/provider-attempt-cost-safety]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(provider): apply one-shot cost-safety patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/provider-attempt-cost-safety
      - name: Apply bounded provider attempt patch
        shell: bash
        env:
          PROVIDER_BLOCK_B64: 
          GENERATE_BLOCK_B64: 
          STATE_SECTION_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          server_path = Path('server.ts')
          server = server_path.read_text()
          provider_block = base64.b64decode(os.environ['PROVIDER_BLOCK_B64']).decode()
          generate_block = base64.b64decode(os.environ['GENERATE_BLOCK_B64']).decode()

          start = server.index('async function callOpenRouter')
          end = server.index('type AiProviderUsed', start)
          server = server[:start] + provider_block + server[end:]

          start = server.index('async function generateTextResult')
          end = server.index('async function generateText(', start)
          server = server[:start] + generate_block + server[end:]
          server_path.write_text(server)

          state_path = Path('PROJECT_STATE.md')
          state = state_path.read_text()
          replacement = base64.b64decode(os.environ['STATE_SECTION_B64']).decode()
          section13 = state.index('## 13. Canonical behavior-situation authority')
          checkpoint = state.index('## 14. Güncel checkpoint', section13)
          state = state[:section13] + replacement + state[checkpoint:]
          state = state.replace('## 14. Güncel checkpoint', '## 15. Güncel checkpoint', 1)
          state = state.replace('- PR #230 canonical behavior-situation authority düzeltmesini doğruluyor; full CI + Architecture Review GREEN olmadan merge edilmeyecek.\n', '- PR #230 CLOSED; canonical behavior-situation authority `main` üzerinde doğrulandı.\n')
          state = state.replace('- Server tarafındaki provider retry/fallback maliyet davranışı ayrı cost-safety incelemesinde takip edilmeli; canlı keşif çağrısı yapılmamalı.\n', '- PR #231 provider retry/fallback cost-safety hattını deterministic olarak doğruluyor; canlı keşif çağrısı yapılmıyor.\n')
          state = state.replace('- Yeni production patch yalnız ölçülmüş RED failure sonrası açılmalı.\n', '- PR #231 sonrası yeni production patch yine yalnız ölçülmüş RED failure sonrası açılmalı.\n')
          state_path.write_text(state)
          PY

          rm -f .github/workflows/provider-attempt-budget-oneshot.yml .provider-attempt-patch-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts PROJECT_STATE.md .github/workflows/provider-attempt-budget-oneshot.yml .provider-attempt-patch-trigger
          git commit -m "fix(provider): enforce shared outbound attempt budget"
          git push origin HEAD:codex/provider-attempt-cost-safety
