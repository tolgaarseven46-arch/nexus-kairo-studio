name: Provider Attempt Budget One-shot

on:
  push:
    branches:
      - codex/provider-attempt-cost-safety

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(provider): apply one-shot cost-safety patch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/provider-attempt-cost-safety
      - name: Apply patch
        run: python scripts/one_time_provider_attempt_patch.py
      - name: Commit patch and remove one-shot files
        shell: bash
        run: |
          rm -f .github/workflows/provider-attempt-budget-oneshot.yml
          rm -f .provider-attempt-patch-trigger
          rm -f scripts/one_time_provider_attempt_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts PROJECT_STATE.md .github/workflows/provider-attempt-budget-oneshot.yml .provider-attempt-patch-trigger scripts/one_time_provider_attempt_patch.py
          git commit -m "fix(provider): enforce shared outbound attempt budget"
          git push origin HEAD:codex/provider-attempt-cost-safety
