name: One-time Post88 Conversation Quality Acceptance

on:
  push:
    branches:
      - diag/post88-conversation-quality-acceptance

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diag/post88-conversation-quality-acceptance
          fetch-depth: 0
      - name: Verify production conversation-quality fixes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nexus-kairo-studio.onrender.com'
          post_chat() {
            local name="$1"
            local msg="$2"
            local uid="post88_${name}_$RANDOM"
            curl --retry 3 --retry-delay 2 --retry-all-errors --fail-with-body --silent --show-error --max-time 180 \
              -H 'Content-Type: application/json' \
              --data "{\"userId\":\"${uid}\",\"userName\":\"Mert\",\"userMessage\":\"${msg}\",\"character\":{\"name\":\"Kaira\"},\"personality\":{},\"history\":[],\"provider\":\"openrouter\",\"suppressRecentMemory\":true,\"kairaInstanceId\":\"kaira_post88_${name}\",\"kairaInstanceType\":\"reference\",\"requestId\":\"post88-${name}-$RANDOM\"}" \
              "$BASE/api/chat" > "/tmp/${name}.json"
            echo "===== ${name} ====="
            cat "/tmp/${name}.json"
            echo
          }

          post_chat relational_bid 'beni öp'
          post_chat dyadic_grounding 'gel senle barışalım'
          post_chat rich_third_party 'neden ayrılmış benden'
          post_chat complaint 'sıktın ama artık'
          post_chat trivial_routine 'nasıl gidiyor'

          node <<'NODE'
          const fs = require('fs');
          const read = (n) => JSON.parse(fs.readFileSync(`/tmp/${n}.json`, 'utf8'));
          const bid = read('relational_bid');
          const grounding = read('dyadic_grounding');
          const rich = read('rich_third_party');
          const complaint = read('complaint');
          const routine = read('trivial_routine');

          const reply = (x) => String(x?.reply || '').trim().toLocaleLowerCase('tr-TR');
          const sem = (x) => x?.kdm?.semanticEvent || x?.semanticEvent || {};
          const plan = (x) => x?.kdm?.responsePlan || x?.responsePlan || {};
          const provider = (x) => x?.providerUsed || x?.kdm?.providerUsed || x?.debug?.providerUsed || '';
          const rel = (x) => x?.kdm?.relationship || x?.kdm?.reasoningTrace?.relationship || x?.reasoningTrace?.relationship || {};

          // 1) Explicit relational bid must not collapse to generic acknowledgement.
          if (!reply(bid) || ['he anladım','hee','anladım'].includes(reply(bid))) {
            throw new Error(`relational bid collapsed to generic acknowledgement: ${bid?.reply}`);
          }
          if (plan(bid)?.move && plan(bid).move === 'natural_reaction') {
            throw new Error(`relational bid still uses natural_reaction: ${JSON.stringify(plan(bid))}`);
          }

          // 2) 'senle' is current-addressee evidence; it must not remain third_party.
          if (sem(grounding)?.target === 'third_party') {
            throw new Error(`senle grounding remained third_party: ${JSON.stringify(sem(grounding))}`);
          }

          // 3) Rich third-party causal/emotional turn must not be swallowed by local short renderer.
          if (provider(rich) === 'local_language' || ['hee','he anladım','anladım'].includes(reply(rich))) {
            throw new Error(`rich third-party turn was locally swallowed: provider=${provider(rich)} reply=${rich?.reply}`);
          }

          // 4) Legitimate complaint may affect relationship slightly, but must not be typed as insult/hakaret.
          if (sem(complaint)?.insult === true) {
            throw new Error(`complaint typed as insult: ${JSON.stringify(sem(complaint))}`);
          }
          const lastPattern = String(rel(complaint)?.lastNegativePattern || rel(complaint)?.lastPattern || '').toLocaleLowerCase('tr-TR');
          if (lastPattern === 'hakaret') {
            throw new Error(`complaint mapped to hakaret: ${JSON.stringify(rel(complaint))}`);
          }

          // 5) Trivial social routine must still retain the local path after richness gating.
          if (provider(routine) && provider(routine) !== 'local_language') {
            throw new Error(`trivial how_are_you routine no longer local: provider=${provider(routine)} reply=${routine?.reply}`);
          }

          console.log(JSON.stringify({
            relationalBid: { reply: bid?.reply, move: plan(bid)?.move },
            dyadicGrounding: { target: sem(grounding)?.target, relationalAct: sem(grounding)?.relationalAct },
            richThirdParty: { reply: rich?.reply, provider: provider(rich) },
            complaint: { insult: sem(complaint)?.insult, lastNegativePattern: lastPattern },
            trivialRoutine: { reply: routine?.reply, provider: provider(routine) },
          }, null, 2));
          console.log('POST88_CONVERSATION_QUALITY_ACCEPTANCE_PASS');
          NODE
      - name: Self-remove diagnostic workflow
        shell: bash
        run: |
          git rm .github/workflows/one-time-post88-conversation-quality-acceptance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove post88 conversation-quality diagnostic'
          git push origin HEAD:diag/post88-conversation-quality-acceptance
