name: One-time affective response consistency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-affective-response-consistency.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply affective response consistency and clean helpers
        run: |
          node scripts/one-time-affective-response-consistency.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-affective-response-consistency.mjs
          git rm .github/workflows/one-time-affective-response-consistency.yml
          git add src/services/kairoResponseConsistency.ts
          git commit -m "fix(kaira): validate qualitative reaction response tone"
          git push
