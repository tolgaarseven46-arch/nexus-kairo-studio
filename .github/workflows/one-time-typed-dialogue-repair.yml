name: one-time-typed-dialogue-repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-typed-dialogue-repair.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Apply typed repair signal
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"target not found in {path}: {old[:80]!r}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              "src/services/semanticEventEngine.ts",
              '''export type SemanticDiscourseAct =
            | "none"
            | "correction"
            | "topic_shift"
            | "recall_request"
            | "confusion_or_challenge";
          ''',
              '''export type SemanticDiscourseAct =
            | "none"
            | "correction"
            | "topic_shift"
            | "recall_request"
            | "confusion_or_challenge";
          export type SemanticRepairSignal =
            | "none"
            | "clarification_request"
            | "relevance_challenge";
          ''',
          )
          replace_once(
              "src/services/semanticEventEngine.ts",
              '''  socialRoutine?: SemanticSocialRoutine;
            discourseAct?: SemanticDiscourseAct;
            adviceRequested?: boolean;
          ''',
              '''  socialRoutine?: SemanticSocialRoutine;
            discourseAct?: SemanticDiscourseAct;
            repairSignal?: SemanticRepairSignal;
            adviceRequested?: boolean;
          ''',
          )
          replace_once(
              "src/services/semanticEventEngine.ts",
              '''const CONFUSION_RE = /(ne diyon|ne diyorsun|ne anlatıyosun|ne anlatıyorsun|ne alaka|nasıl yani|bi şey anlamadım|bir şey anlamadım)/u;
          ''',
              '''const CLARIFICATION_REQUEST_RE = /(nasıl yani|bi şey anlamadım|bir şey anlamadım)/u;
          const RELEVANCE_CHALLENGE_RE = /(ne diyon|ne diyorsun|ne anlatıyosun|ne anlatıyorsun|ne alaka)/u;
          ''',
          )
          replace_once(
              "src/services/semanticEventEngine.ts",
              '''  const affection = AFFECTION_RE.test(text) ? 0.7 : closenessBid ? 0.45 : 0;
            const confusion = CONFUSION_RE.test(text);
            const frustration = FRUSTRATION_RE.test(text) ? 0.75 : challenge ? 0.6 : VENTING_PROFANITY_RE.test(text) ? 0.35 : 0;
          ''',
              '''  const affection = AFFECTION_RE.test(text) ? 0.7 : closenessBid ? 0.45 : 0;
            const clarificationRequest = CLARIFICATION_REQUEST_RE.test(text);
            const relevanceChallenge = RELEVANCE_CHALLENGE_RE.test(text) || challenge;
            const confusion = clarificationRequest || relevanceChallenge;
            const repairSignal: SemanticRepairSignal = clarificationRequest
              ? "clarification_request"
              : relevanceChallenge
                ? "relevance_challenge"
                : "none";
            const frustration = FRUSTRATION_RE.test(text) ? 0.75 : challenge ? 0.6 : VENTING_PROFANITY_RE.test(text) ? 0.35 : 0;
          ''',
          )
          replace_once(
              "src/services/semanticEventEngine.ts",
              '''    raw: message, normalized: text, intent, socialRoutine, discourseAct, adviceRequested, valence, target, relationalAct, relationalIntensity, severity,
          ''',
              '''    raw: message, normalized: text, intent, socialRoutine, discourseAct, repairSignal, adviceRequested, valence, target, relationalAct, relationalIntensity, severity,
          ''',
          )

          replace_once(
              "src/services/semanticEventCanonicalizer.ts",
              '''    socialRoutine,
              discourseAct: event.discourseAct ?? fallback.discourseAct ?? "none",
              adviceRequested: event.adviceRequested ?? fallback.adviceRequested ?? false,
          ''',
              '''    socialRoutine,
              discourseAct: event.discourseAct ?? fallback.discourseAct ?? "none",
              repairSignal: event.repairSignal ?? fallback.repairSignal ?? "none",
              adviceRequested: event.adviceRequested ?? fallback.adviceRequested ?? false,
          ''',
          )

          replace_once(
              "src/services/kairoDialogueDecisionEngine.ts",
              '''  interpretSemanticEvent,
            type SemanticEvent,
            type SemanticSocialRoutine,
          ''',
              '''  interpretSemanticEvent,
            type SemanticEvent,
            type SemanticRepairSignal,
            type SemanticSocialRoutine,
          ''',
          )
          replace_once(
              "src/services/kairoDialogueDecisionEngine.ts",
              '''  target?: string;
            socialRoutine?: SemanticSocialRoutine;
            allowFollowUpQuestion: boolean;
          ''',
              '''  target?: string;
            socialRoutine?: SemanticSocialRoutine;
            repairSignal?: SemanticRepairSignal;
            allowFollowUpQuestion: boolean;
          ''',
          )
          replace_once(
              "src/services/kairoDialogueDecisionEngine.ts",
              '''  if (event.discourseAct === "confusion_or_challenge" && hasImmediateKairaTurn(history)) {
              return {
                move: "repair_or_rephrase",
                allowFollowUpQuestion: false,
                allowSpeculation: false,
                maxSentences: 1,
                maxWords: 8,
                hasSupportedTargetClaim: false,
                reason:
                  "Kullanıcı Kaira'nın önceki mesajını anlamadı veya ona itiraz etti. Önceki fikri kısa ve daha doğal biçimde yeniden söyle ya da gereksiz kısmı geri çek; kendini savunma, yeni konu açma ve soru sorma.",
              };
            }
          ''',
              '''  if (event.discourseAct === "confusion_or_challenge" && hasImmediateKairaTurn(history)) {
              const repairSignal = event.repairSignal ?? "none";
              const reason =
                repairSignal === "clarification_request"
                  ? "Kullanıcı Kaira'nın hemen önceki mesajını anlamadı. Aynı fikri daha açık, kısa ve doğal biçimde yeniden söyle; yeni iddia, yeni konu veya soru ekleme."
                  : repairSignal === "relevance_challenge"
                    ? "Kullanıcı Kaira'nın hemen önceki mesajının alakasına veya doğrultusuna itiraz etti. Gereksiz bağlantıyı geri çek veya yalnızca ilgili kısmı düzelt; kendini savunma, yeni konu açma ve soru sorma."
                    : "Kullanıcı Kaira'nın hemen önceki mesajı için onarım başlattı. Önceki fikri kısa ve doğal biçimde düzelt veya yeniden söyle; kendini savunma, yeni konu açma ve soru sorma.";
              return {
                move: "repair_or_rephrase",
                repairSignal,
                allowFollowUpQuestion: false,
                allowSpeculation: false,
                maxSentences: 1,
                maxWords: 8,
                hasSupportedTargetClaim: false,
                reason,
              };
            }
          ''',
          )
          replace_once(
              "src/services/kairoDialogueDecisionEngine.ts",
              '''  if (plan.move === "repair_or_rephrase") return "biraz saçmaladım galiba";
          ''',
              '''  if (plan.move === "repair_or_rephrase") {
              if (plan.repairSignal === "clarification_request") return "biraz karışık anlattım";
              if (plan.repairSignal === "relevance_challenge") return "he alakasız oldu";
              return "biraz saçmaladım galiba";
            }
          ''',
          )

          replace_once(
              "src/services/llmSemanticUnderstandingProvider.ts",
              '''  discourseAct: "none",
            adviceRequested: false,
          ''',
              '''  discourseAct: "none",
            repairSignal: "none",
            adviceRequested: false,
          ''',
          )
          replace_once(
              "src/services/llmSemanticUnderstandingProvider.ts",
              '''discourseAct = none | correction | topic_shift | recall_request | confusion_or_challenge
          adviceRequested = boolean; kullanıcı açıkça ne yapması gerektiğini/tavsiye/öneri soruyorsa true
          ''',
              '''discourseAct = none | correction | topic_shift | recall_request | confusion_or_challenge
          repairSignal = none | clarification_request | relevance_challenge; yalnız discourse repair'in alt türünü belirtir, cevap davranışına karar vermez
          adviceRequested = boolean; kullanıcı açıkça ne yapması gerektiğini/tavsiye/öneri soruyorsa true
          ''',
          )

          Path("src/services/kairaTypedRepairSignalContracts.test.ts").write_text('''import { describe, expect, it } from "vitest";
          import { interpretSemanticEvent } from "./semanticEventEngine";
          import { canonicalizeSemanticEvent } from "./semanticEventCanonicalizer";
          import {
            buildGroundedDialogueFallback,
            planDialogueResponse,
          } from "./kairoDialogueDecisionEngine";

          describe("typed conversational repair signal contracts", () => {
            it.each([
              ["nasıl yani", "clarification_request"],
              ["bi şey anlamadım", "clarification_request"],
              ["ne alaka", "relevance_challenge"],
              ["ne diyon aq", "relevance_challenge"],
            ] as const)("owns the repair subtype at the semantic boundary: %s", (message, expected) => {
              const event = interpretSemanticEvent(message);
              expect(event.discourseAct).toBe("confusion_or_challenge");
              expect(event.repairSignal).toBe(expected);
            });

            it("fills an omitted provider repair subtype only at canonicalization", () => {
              const deterministic = interpretSemanticEvent("nasıl yani");
              const providerEvent = { ...deterministic, repairSignal: undefined };
              const result = canonicalizeSemanticEvent("nasıl yani", providerEvent);
              expect(result.repairSignal).toBe("clarification_request");
            });

            it.each([
              ["nasıl yani", "clarification_request", "biraz karışık anlattım"],
              ["ne alaka", "relevance_challenge", "he alakasız oldu"],
            ] as const)("preserves typed repair through dialogue planning: %s", (message, repairSignal, fallback) => {
              const history = [{ sender: "droit", text: "önceki Kaira mesajı" }] as any[];
              const event = interpretSemanticEvent(message);
              const plan = planDialogueResponse(history, message, "Mert", event);
              expect(plan).toMatchObject({
                move: "repair_or_rephrase",
                repairSignal,
                allowFollowUpQuestion: false,
              });
              expect(buildGroundedDialogueFallback(plan, history, message, "Mert")).toBe(fallback);
            });

            it("does not create a repair sequence without an adjacent Kaira turn", () => {
              const event = interpretSemanticEvent("nasıl yani");
              expect(planDialogueResponse([], "nasıl yani", "Mert", event).move).not.toBe("repair_or_rephrase");
            });
          });
          ''')
          PY
      - name: Focused regressions
        run: npx vitest run src/services/kairaTypedRepairSignalContracts.test.ts src/services/semanticEventEngine.test.ts src/services/semanticEventCanonicalizer.test.ts src/services/kairoDialogueDecisionEngine.test.ts src/services/kairaTransientStopPathParityContracts.test.ts src/services/llmSemanticUnderstandingProvider.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/semanticEventEngine.ts src/services/semanticEventCanonicalizer.ts src/services/kairoDialogueDecisionEngine.ts src/services/llmSemanticUnderstandingProvider.ts src/services/kairaTypedRepairSignalContracts.test.ts
          git rm .github/workflows/one-time-typed-dialogue-repair.yml
          git commit -m "feat(kaira): type conversational repair signals"
          git push origin main
