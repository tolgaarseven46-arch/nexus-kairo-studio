name: C1b Coercion Pattern

on:
  push:
    branches: [chatgpt/c1-single-semantic-authority]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chatgpt/c1-single-semantic-authority
      - name: Align canonical coercion expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/services/kdmConsistencyEngine.test.ts')
          s=p.read_text()
          old='''expect(result.nextDynamicState.relationship?.lastNegativePattern).toBe("hakaret");'''
          new='''expect(result.nextDynamicState.relationship?.lastNegativePattern).toBe("zorlama");'''
          marker='''it("uses the shared SemanticEvent for degrading coercive language"'''
          idx=s.find(marker)
          if idx < 0: raise SystemExit('coercion test marker missing')
          end=s.find('\n  });', idx)
          block=s[idx:end]
          if old not in block and new not in block: raise SystemExit('coercion expectation missing')
          block=block.replace(old,new)
          s=s[:idx]+block+s[end:]
          p.write_text(s)
          PY
      - name: Self-remove and commit
        run: |
          rm .github/workflows/c1b-coercion-pattern.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/kdmConsistencyEngine.test.ts .github/workflows/c1b-coercion-pattern.yml
          git commit -m 'test(kdm): align mixed coercion pattern with canonical v2'
          git push origin HEAD:chatgpt/c1-single-semantic-authority
