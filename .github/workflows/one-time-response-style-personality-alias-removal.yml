name: One-time response style personality alias removal

on:
  push:
    paths:
      - ".github/workflows/one-time-response-style-personality-alias-removal.yml"
      - "scripts/applyResponseStylePersonalityAliasRemoval.mjs"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove response personality passthrough alias
        run: node scripts/applyResponseStylePersonalityAliasRemoval.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Ownership contract
        run: npm test -- --run src/services/kairaBasePersonalityOwnershipContracts.test.ts src/services/kairaConversationStateLockContracts.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- server.ts src/services/kairaBasePersonalityOwnershipContracts.test.ts src/services/kairaWorldStateAppraisalIntegrationContracts.test.ts src/services/kairaConversationStateLockContracts.test.ts; then
            echo "response style personality alias already removed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/kairaBasePersonalityOwnershipContracts.test.ts src/services/kairaWorldStateAppraisalIntegrationContracts.test.ts src/services/kairaConversationStateLockContracts.test.ts
          git commit -m "refactor(kaira): remove response style personality alias"
          git pull --rebase origin main
          git push origin main
