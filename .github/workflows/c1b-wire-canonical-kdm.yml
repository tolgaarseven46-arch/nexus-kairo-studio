name: C1b Wire Canonical KDM

on:
  push:
    branches: [chatgpt/c1-single-semantic-authority]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chatgpt/c1-single-semantic-authority
          fetch-depth: 0
      - name: Wire server to canonical v2 KDM
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.ts')
          s=p.read_text()
          old='import { analyzeKdmInteraction } from "./src/services/kdmConsistencyEngine";'
          new='import { analyzeKdmInteractionCanonicalTurn } from "./src/services/kdmConsistencyEngine";'
          if old not in s and new not in s:
              raise SystemExit('KDM import pattern not found')
          s=s.replace(old,new)
          old_call='''kdm = analyzeKdmInteraction(\n        userMessage,\n        basePersonality,\n        effective,\n        canonicalSemantic.event,\n        behaviorPolicy,\n      )'''
          new_call='''kdm = analyzeKdmInteractionCanonicalTurn(\n        userMessage,\n        basePersonality,\n        effective,\n        canonicalSemantic.interpretation,\n        canonicalSemantic.event,\n        behaviorPolicy,\n      )'''
          count=s.count(old_call)
          if count == 0 and new_call not in s:
              raise SystemExit('KDM call pattern not found')
          s=s.replace(old_call,new_call)
          p.write_text(s)
          print('updated calls:', count)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/c1b-wire-canonical-kdm.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts .github/workflows/c1b-wire-canonical-kdm.yml
          git commit -m 'refactor(kdm): wire server to canonical v2 reducer input'
          git push origin HEAD:chatgpt/c1-single-semantic-authority
