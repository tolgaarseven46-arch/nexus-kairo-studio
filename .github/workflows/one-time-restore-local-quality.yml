name: One-time Restore Local Quality

on:
  push:
    branches:
      - fix/conversation-quality-social-moves

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[local-quality-restored]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/conversation-quality-social-moves
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Restore accepted local verbalizer and add minimal richness gate
        run: python .github/scripts/one_time_restore_local_quality.py
      - name: Verify local HOW contracts and quality regression
        run: |
          npm test -- --run src/services/kairaDyadicUserStyleContracts.test.ts src/services/kairaTurnTakingSocialRoutineContracts.test.ts src/services/conversationQualityMechanismRegression.test.ts
          npx tsc --noEmit
      - name: Commit and clean harness
        run: |
          git rm .github/workflows/one-time-restore-local-quality.yml
          git rm .github/scripts/one_time_restore_local_quality.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(chat): restore local HOW verbalizer [local-quality-restored]'
          git push origin HEAD:fix/conversation-quality-social-moves
