name: One-time canonical discourse shape migration

on:
  push:
    branches:
      - codex/discourse-shape-authority-e1b

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/discourse-shape-authority-e1b
          fetch-depth: 0

      - name: Move discourse shapes to canonical ingestion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, got {count}: {old[:70]!r}')
              p.write_text(text.replace(old, new, 1))

          # Types: ingestion facets + compatibility projection.
          replace_once(
              'src/types/semanticInterpretation.ts',
              '  /** Canonical utterance shape: message can begin as a state/how-are-you answer. */\n  stateAnswerShape?: boolean;\n}',
              '  /** Canonical utterance shape: message can begin as a state/how-are-you answer. */\n  stateAnswerShape?: boolean;\n  /** Canonical utterance shape: compact turn used only for discourse dependency. */\n  shortUtteranceShape?: boolean;\n  /** Canonical utterance shape: message can answer a pending what-doing question. */\n  activityAnswerShape?: boolean;\n}',
          )
          replace_once(
              'src/types/semanticInterpretation.ts',
              '  stateAnswerShape?: boolean;\n}\n\n/** Each component is 0..1 and orthogonal. */',
              '  stateAnswerShape?: boolean;\n  shortUtteranceShape?: boolean;\n  activityAnswerShape?: boolean;\n}\n\n/** Each component is 0..1 and orthogonal. */',
          )

          # Canonical recognizer owns raw-text shape reads.
          replace_once(
              'src/services/semanticDiscourseFacetRecognizer.ts',
              '  stateAnswerShape: boolean;\n}',
              '  stateAnswerShape: boolean;\n  shortUtteranceShape: boolean;\n  activityAnswerShape: boolean;\n}',
          )
          replace_once(
              'src/services/semanticDiscourseFacetRecognizer.ts',
              'const STATE_ANSWER_PREFIX_RE =\n  /^(?:iyi(?:yim|dir)?|k[öo]t[üu](?:y[üu]m)?|fena\\s+değil|eh\\b|idare\\b|normal\\b|ayn[ıi]\\b|moral(?:im)?\\b|mod(?:um)?\\b)/iu;\n',
              'const STATE_ANSWER_PREFIX_RE =\n  /^(?:iyi(?:yim|dir)?|k[öo]t[üu](?:y[üu]m)?|fena\\s+değil|eh\\b|idare\\b|normal\\b|ayn[ıi]\\b|moral(?:im)?\\b|mod(?:um)?\\b)/iu;\n\nconst ACTIVITY_ANSWER_PREFIX_RE =\n  /^(?:tak[ıi]l|çalış|çal[ıi][şs]|otur|evde|işte|okulda|dışarı|boş|hiçbir|bi\\s+şey|bir\\s+şey)/iu;\n',
          )
          replace_once(
              'src/services/semanticDiscourseFacetRecognizer.ts',
              '  return {\n    signalsAlreadyAnswered: ALREADY_ANSWERED_RE.test(text),\n    answerFriction: PRIOR_ANSWER_FRICTION_RE.test(text),\n    stateAnswerShape: STATE_ANSWER_PREFIX_RE.test(text),\n  };',
              '  const wordCount = (text.match(/\\S+/gu) ?? []).length;\n  return {\n    signalsAlreadyAnswered: ALREADY_ANSWERED_RE.test(text),\n    answerFriction: PRIOR_ANSWER_FRICTION_RE.test(text),\n    stateAnswerShape: STATE_ANSWER_PREFIX_RE.test(text),\n    shortUtteranceShape: text.length > 0 && wordCount <= 4,\n    activityAnswerShape: ACTIVITY_ANSWER_PREFIX_RE.test(text),\n  };',
          )

          # Normalize persisted/provider inputs.
          replace_once(
              'src/services/semanticInterpretationSchema.ts',
              '    stateAnswerShape: asBool(v.stateAnswerShape),\n  };',
              '    stateAnswerShape: asBool(v.stateAnswerShape),\n    shortUtteranceShape: asBool(v.shortUtteranceShape),\n    activityAnswerShape: asBool(v.activityAnswerShape),\n  };',
          )

          # Compatibility projection carries the canonical facets.
          replace_once(
              'src/services/semanticInterpretationProjection.ts',
              '    stateAnswerShape: Boolean(interp.discourseFacets.stateAnswerShape),\n    valence: interp.valence,',
              '    stateAnswerShape: Boolean(interp.discourseFacets.stateAnswerShape),\n    shortUtteranceShape: Boolean(interp.discourseFacets.shortUtteranceShape),\n    activityAnswerShape: Boolean(interp.discourseFacets.activityAnswerShape),\n    valence: interp.valence,',
          )

          # Reducer: no raw user-text shape inference.
          p = Path('src/services/discourseStateReducer.ts')
          text = p.read_text()
          old = '''function isShort(message: string): boolean {\n  return (message.trim().match(/\\S+/gu) ?? []).length <= 4;\n}\n\nfunction startsNewTopic(event: SemanticEvent, message: string): boolean {\n  return (\n    event.discourseAct === "topic_shift" ||\n    event.intent === "information_request" ||\n    event.intent === "emotional_share" ||\n    ((event.socialRoutine ?? "none") === "none" &&\n      event.discourseAct === "none" &&\n      !isShortIntent(event, message))\n  );\n}\n\nfunction isShortIntent(event: SemanticEvent, message: string): boolean {\n  return (\n    event.intent === "greeting" ||\n    (event.intent === "general_chat" && isShort(message)) ||\n    (event.socialRoutine ?? "none") !== "none"\n  );\n}\n'''
          new = '''function startsNewTopic(event: CanonicalDiscourseEvent): boolean {\n  return (\n    event.discourseAct === "topic_shift" ||\n    event.intent === "information_request" ||\n    event.intent === "emotional_share" ||\n    ((event.socialRoutine ?? "none") === "none" &&\n      event.discourseAct === "none" &&\n      !isShortIntent(event))\n  );\n}\n\nfunction isShortIntent(event: CanonicalDiscourseEvent): boolean {\n  return (\n    event.intent === "greeting" ||\n    (event.intent === "general_chat" && Boolean(event.shortUtteranceShape)) ||\n    (event.socialRoutine ?? "none") !== "none"\n  );\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('discourseStateReducer: short-shape block mismatch')
          text = text.replace(old, new, 1)

          old = '''  const text = message.trim().toLocaleLowerCase("tr-TR");\n  if (!text) return false;\n  if (act === "answer" || act === "agreement_ack" || act === "correction") return true;\n\n  if (pending.kind === "how_are_you") return Boolean(event.stateAnswerShape);\n  if (pending.kind === "what_doing") {\n    return /^(?:tak[ıi]l|çalış|çal[ıi][şs]|otur|evde|işte|okulda|dışarı|boş|hiçbir|bi\\s+şey|bir\\s+şey)/iu.test(text);\n  }\n\n  return isShort(message) && act !== "greeting" && act !== "farewell";'''
          new = '''  if (!message.trim()) return false;\n  if (act === "answer" || act === "agreement_ack" || act === "correction") return true;\n\n  if (pending.kind === "how_are_you") return Boolean(event.stateAnswerShape);\n  if (pending.kind === "what_doing") return Boolean(event.activityAnswerShape);\n\n  return Boolean(event.shortUtteranceShape) && act !== "greeting" && act !== "farewell";'''
          if text.count(old) != 1:
              raise SystemExit('discourseStateReducer: pending-answer block mismatch')
          text = text.replace(old, new, 1)
          text = text.replace('startsNewTopic(turn.event, turn.message)', 'startsNewTopic(turn.event)')
          text = text.replace('isShort(turn.message) &&', 'Boolean(turn.event.shortUtteranceShape) &&')

          if 'isShort(message)' in text or 'ACTIVITY_ANSWER_PREFIX_RE' in text:
              raise SystemExit('downstream raw shape inference survived migration')
          p.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/semanticInterpretation.ts \
                  src/services/semanticDiscourseFacetRecognizer.ts \
                  src/services/semanticInterpretationSchema.ts \
                  src/services/semanticInterpretationProjection.ts \
                  src/services/discourseStateReducer.ts
          git diff --cached --check
          git commit -m "refactor(discourse): move turn shapes to canonical ingestion"
          git push origin HEAD:codex/discourse-shape-authority-e1b
