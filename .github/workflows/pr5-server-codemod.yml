name: PR5 Server Codemod

on:
  push:
    branches:
      - chatgpt/pr5-remove-canonical-compatibility

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR5 branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chatgpt/pr5-remove-canonical-compatibility

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Canonicalize server rollout branches
        run: node scripts/pr5-remove-server-rollout-branches.mjs

      - name: Commit codemod result
        run: |
          if git diff --quiet -- server.ts; then
            echo "No server.ts diff produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "refactor(kaira): remove server rollout branches"
          git push origin HEAD:chatgpt/pr5-remove-canonical-compatibility
