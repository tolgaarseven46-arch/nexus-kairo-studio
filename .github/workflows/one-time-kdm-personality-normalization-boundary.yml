name: One-time KDM personality normalization boundary

on:
  push:
    paths:
      - ".github/workflows/one-time-kdm-personality-normalization-boundary.yml"
      - "scripts/applyKdmPersonalityNormalizationBoundary.mjs"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize KDM personality boundary
        run: node scripts/applyKdmPersonalityNormalizationBoundary.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Boundary contracts
        run: npm test -- --run src/services/kairaKdmPersonalityNormalizationBoundaryContracts.test.ts src/services/kairaBehaviorPersonalityNormalizationBoundaryContracts.test.ts src/services/droitPersonalityNormalizer.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- src/services/kdmConsistencyEngine.ts src/services/kairaKdmPersonalityNormalizationBoundaryContracts.test.ts; then
            echo "KDM personality normalization already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/kdmConsistencyEngine.ts src/services/kairaKdmPersonalityNormalizationBoundaryContracts.test.ts
          git commit -m "fix(kaira): normalize personality at KDM boundary"
          git pull --rebase origin main
          git push origin main
