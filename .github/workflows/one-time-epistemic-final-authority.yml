name: one-time-epistemic-final-authority
on:
  push:
    paths:
      - '.github/workflows/one-time-epistemic-final-authority.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Apply final authority fix
        run: node scripts/one-time-epistemic-final-authority.cjs
      - name: Focused regressions
        run: npx vitest run src/services/kairaEpistemicResponsePolicy.test.ts src/services/kairaEpistemicRuntimeContracts.test.ts src/services/kairaResponsePlanFinalAuthorityContracts.test.ts src/services/kairaContractRegistry.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Commit product and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-epistemic-final-authority.yml scripts/one-time-epistemic-final-authority.cjs
          git add server.ts src/services/kairaEpistemicRuntimeContracts.test.ts
          git commit -m "fix(kaira): preserve epistemic final authority"
          git push
