name: One-time project state personality downstream coverage

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-personality-downstream-coverage.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 62. Personality full downstream coverage — 2026-08-31\n- The CharacterTab personality family was audited as a complete downstream system. All six sliders are explicitly covered: confidence, directness, stubbornness, analysis depth, cognitive flexibility and decisiveness.\n- Added permanent `kairaPersonalityDownstreamCoverageContracts.test.ts`. It verifies exact CharacterTab key mapping and proves every slider reaches downstream behavior consumed by final integration in a semantically matching context.\n- Confidence/directness alter assertive pressure and final directness; stubbornness and cognitive flexibility affect revision readiness and correction-context directness; analysis depth alters analysis pressure and final answer length; decisiveness alters decision pressure and final directness only when a decision is actually demanded.\n- Added context-gate protection proving decisiveness does not harden neutral conversation and cognitive flexibility does not generically soften behavior without a correction signal.\n- Targeted contracts, TypeScript, full regression and production build all passed. No product code change was required.\n- Permanent coverage commit: `3a2171c` (`test(kaira): lock personality downstream coverage`).\n- Temporary verification workflow and generator helper were removed after the successful run.\n- Next audit focus: consolidate the complete eight-family fine-tune downstream matrix into one meta contract.\n'''
          if '## 62. Personality full downstream coverage — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record personality downstream coverage"
          git pull --rebase origin main
          git push origin main
