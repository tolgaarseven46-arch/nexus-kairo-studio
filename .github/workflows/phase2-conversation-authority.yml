name: Phase2 Conversation State Authority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase2-conversation-authority.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire post-transition conversation authority
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('server.ts')
          s = server.read_text()

          import_anchor = 'import { resolveCanonicalSemanticEvent } from "./src/services/semanticEventAuthority";\n'
          import_line = 'import { applyConversationStateAuthority } from "./src/services/conversationStateAuthority";\n'
          if import_line not in s:
              if import_anchor not in s:
                  raise SystemExit('semantic authority import anchor not found')
              s = s.replace(import_anchor, import_anchor + import_line, 1)

          if 'conversationAuthority = applyConversationStateAuthority' not in s:
              marker = '      behaviorProfile = kdm.behaviorProfile,\n'
              insertion = (
                  '      conversationAuthority = applyConversationStateAuthority(safePersonality, kdm.nextDynamicState),\n'
                  '      authoritativePersonality = conversationAuthority.personality,\n'
              )
              if marker not in s:
                  raise SystemExit('behaviorProfile anchor not found')
              s = s.replace(marker, insertion + marker, 1)

          s = s.replace(
              '      speech = computeKairoSpeechIdentity(\n        safePersonality,\n',
              '      speech = computeKairoSpeechIdentity(\n        authoritativePersonality,\n',
              1,
          )
          s = s.replace(
              'continueConversation: runtimeFlag(safePersonality, "runtimeContinueConversation", true)',
              'continueConversation: runtimeFlag(authoritativePersonality, "runtimeContinueConversation", true)',
              1,
          )
          s = s.replace(
              'humorAllowed: runtimeFlag(safePersonality, "runtimeHumorAllowed", true)',
              'humorAllowed: runtimeFlag(authoritativePersonality, "runtimeHumorAllowed", true)',
              1,
          )
          s = s.replace(
              'askQuestion: runtimeFlag(safePersonality, "runtimeAskQuestion", true)',
              'askQuestion: runtimeFlag(authoritativePersonality, "runtimeAskQuestion", true)',
              1,
          )
          s = s.replace(
              '      local = tryLocalKairoReply(\n        userMessage,\n        safePersonality,\n',
              '      local = tryLocalKairoReply(\n        userMessage,\n        authoritativePersonality,\n',
              1,
          )

          required = [
              'applyConversationStateAuthority',
              'conversationAuthority = applyConversationStateAuthority',
              'authoritativePersonality = conversationAuthority.personality',
              'computeKairoSpeechIdentity(\n        authoritativePersonality,',
              'runtimeFlag(authoritativePersonality, "runtimeContinueConversation"',
              'runtimeFlag(authoritativePersonality, "runtimeHumorAllowed"',
              'runtimeFlag(authoritativePersonality, "runtimeAskQuestion"',
              'tryLocalKairoReply(\n        userMessage,\n        authoritativePersonality,',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('wiring verification failed: ' + repr(missing))

          server.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git diff --cached --quiet && exit 0
          git commit -m "refactor(kdm): make post-transition relationship state authoritative"
          git push
