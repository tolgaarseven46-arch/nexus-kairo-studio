name: Slice A W9 Live Review Probe

on:
  pull_request:
    paths:
      - ".github/workflows/slice-a-w9-live-review.yml"

permissions:
  contents: read

jobs:
  live-review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TEST_RUN_ID: TR_live_beta_slice-a-acceptance-35310419905
      KAIRA_URL: https://nexus-kairo-studio.onrender.com
      KAIRA_INTEGRATION_TOKEN: ${{ secrets.KAIRA_INTEGRATION_TOKEN }}
    steps:
      - name: Require configured integration secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAIRA_INTEGRATION_TOKEN}" || {
            echo "KAIRA_INTEGRATION_TOKEN secret is not configured"
            exit 2
          }

      - name: Read persisted TestRun through live review route
        shell: bash
        run: |
          set -euo pipefail

          review="$(
            curl --fail-with-body --silent --show-error --max-time 30 \
              -H "Authorization: Bearer ${KAIRA_INTEGRATION_TOKEN}" \
              "${KAIRA_URL}/api/test-runs/${TEST_RUN_ID}/review"
          )"

          echo "${review}" | jq '{
            ok,
            testRunId:.packet.testRunId,
            sessionId:.packet.sessionId,
            turnCount:.packet.turnCount,
            kairaCommit:.packet.provenance.provenance.versions.kairaCommit,
            privatRoomCommit:.packet.provenance.provenance.versions.privatRoomCommit,
            turns:[.packet.turns[] | {
              turnNumber,
              userMessage,
              assistantReply,
              providerUsed,
              totalMs:(.timings.totalMs // null),
              hasSemantic:(.semanticInterpretation != null or .semanticEvent != null),
              hasReasoning:(.reasoningTrace != null),
              hasResponsePlan:(.responsePlan != null),
              hasState:(.dynamicStateBefore != null or .dynamicStateAfter != null),
              hasRelationship:(.relationshipState != null),
              memoryCount:(.retrievedMemories // [] | length),
              hasConsistency:(.consistency != null)
            }]
          }'

          echo "${review}" | jq -e \
            --arg expected "${TEST_RUN_ID}" \
            '.ok == true
             and .packet.testRunId == $expected
             and .packet.sessionId == $expected
             and (.packet.turnCount | type == "number" and . >= 1)
             and (.packet.turns | length) >= 1' >/dev/null

          echo "SLICE_A_W9_LIVE_REVIEW=PASS"
