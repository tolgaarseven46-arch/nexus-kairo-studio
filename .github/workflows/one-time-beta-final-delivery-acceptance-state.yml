name: One-time beta final-delivery acceptance state

on:
  push:
    branches:
      - audit/beta-final-delivery-acceptance

permissions:
  contents: write

jobs:
  state:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: audit/beta-final-delivery-acceptance
          fetch-depth: 0
      - name: Append project checkpoint
        shell: python
        run: |
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          s = p.read_text(encoding='utf-8')
          marker = '## 2026-09-06 — Beta final-delivery acceptance coverage'
          if marker not in s:
              s = s.rstrip() + '''\n\n## 2026-09-06 — Beta final-delivery acceptance coverage\n- PR #113 sonrası semantic-authority audit kapatıldı ve odak measurable product-facing conversation acceptance'a taşındı.\n- ADR-0005 kapsamı incelendi: beta acceptance manifesti ilişki/state recovery ile persistence/hydration senaryolarını erken çalıştırıyor, fakat mevcut 20-turn final-delivery quality regression yalnız full suite içinde kalıyordu.\n- `kairaTwentyTurnFinalDeliveryQualityRegression.test.ts` deterministic olarak canonical semantics → KDM → DialogueDecision → ResponsePlan → speech identity → local/AI routing → repair/enforcement → delivered reply zincirini, ilişki hasarı/onarımı ve repetition quality ile birlikte doğruluyor; `test:beta` içinde duplicate değil.\n- ADR-0061 kararı: bu durable cross-cutting delivered-reply invariant canonical beta acceptance manifestine promote edilir. Focused mechanism regression'ları full suite'te kalır; acceptance gate full suite kopyasına dönüştürülmez.\n- Runtime davranışı, provider routing veya model çağrısı değişmez. Provider/API/live smoke yoktur; gerçek provider kabulü kullanıcı gerçek Kaira sohbet testine ayrılmıştır.\n'''
              p.write_text(s + '\n', encoding='utf-8')
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-beta-final-delivery-acceptance-state.yml
      - name: Commit checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md .github/workflows/one-time-beta-final-delivery-acceptance-state.yml
          git commit -m "docs: record beta final-delivery acceptance checkpoint"
          git push origin HEAD:audit/beta-final-delivery-acceptance
