name: One-time run language-style state recorder

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record project state
        run: python scripts/record_language_style_hardening_state.py
      - name: Commit state and self-clean
        run: |
          rm scripts/record_language_style_hardening_state.py
          rm .github/workflows/one-time-run-language-style-state-recorder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md scripts/record_language_style_hardening_state.py .github/workflows/one-time-run-language-style-state-recorder.yml
          git commit -m "docs(kaira): record language-style hardening state"
          git push
