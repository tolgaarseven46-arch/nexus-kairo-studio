name: One-time relational bid fulfillment authority repair

on:
  push:
    branches:
      - audit/relational-bid-fulfillment-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: audit/relational-bid-fulfillment-authority
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply typed relational fulfillment repair
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/services/kairoDialogueDecisionEngine.ts')
          s = p.read_text(encoding='utf-8')

          old_type = '''export type DialogueObligationType =\n  | "answer_or_clarify"\n  | "grounded_recall";\n'''
          new_type = '''export type DialogueObligationType =\n  | "answer_or_clarify"\n  | "grounded_recall"\n  | "respond_to_relational_bid";\n'''
          if old_type not in s:
              raise SystemExit('expected DialogueObligationType block not found')
          s = s.replace(old_type, new_type, 1)

          old_attach = '''function attachDecisionOwnedObligation(plan: DialogueDecisionPlan): DialogueDecisionPlan {\n  if (plan.move !== "answer_or_clarify" && plan.move !== "grounded_recall") return plan;\n'''
          new_attach = '''function attachDecisionOwnedObligation(plan: DialogueDecisionPlan): DialogueDecisionPlan {\n  if (\n    plan.move !== "answer_or_clarify" &&\n    plan.move !== "grounded_recall" &&\n    plan.move !== "respond_to_relational_bid"\n  ) return plan;\n'''
          if old_attach not in s:
              raise SystemExit('expected attachDecisionOwnedObligation guard not found')
          s = s.replace(old_attach, new_attach, 1)

          old_special = '''  if (plan.move === "respond_to_relational_bid" && KAIRA_SHORT_ACK_RE.test(reply.trim())) {\n    issues.push("Relational bid generic acknowledgement ile geçiştirilemez; anlamlı sosyal hareket gerekli");\n  }\n'''
          if old_special not in s:
              raise SystemExit('expected relational bid special-case validator not found')
          s = s.replace(old_special, '', 1)
          p.write_text(s, encoding='utf-8')

          Path('src/services/kairaRelationalBidFulfillmentRegression.test.ts').write_text('''import { describe, expect, it } from "vitest";\nimport {\n  buildDialogueDecisionInstruction,\n  findDialogueDecisionIssues,\n  planDialogueResponse,\n} from "./kairoDialogueDecisionEngine";\n\nconst relationalDecision = () =>\n  planDialogueResponse(\n    [],\n    "seni seviyorum",\n    "Tolga",\n    {\n      intent: "affection",\n      discourseAct: "none",\n      socialRoutine: "none",\n      repairSignal: "none",\n      adviceRequested: false,\n      target: "kaira",\n      relationalAct: "closeness_bid",\n      affection: 1,\n    } as any,\n  );\n\ndescribe("relational bid fulfillment authority regression", () => {\n  it("carries the no-acknowledgement rule in the decision-owned obligation", () => {\n    const decision = relationalDecision();\n    expect(decision.move).toBe("respond_to_relational_bid");\n    expect(decision.obligation?.type).toBe("respond_to_relational_bid");\n    expect(decision.obligation?.satisfactionCriteria.forbiddenResponseClasses).toContain(\n      "acknowledgement_only",\n    );\n    expect(buildDialogueDecisionInstruction(decision)).toContain(\n      "Obligation: respond_to_relational_bid; yalnız acknowledgement ile kapanamaz",\n    );\n  });\n\n  it("rejects generic acknowledgement through the generic obligation validator", () => {\n    const decision = relationalDecision();\n    for (const reply of ["tamam", "peki", "aynen", "anladım"]) {\n      expect(findDialogueDecisionIssues(reply, decision)).toContain(\n        "DialogueDecision obligation karşılanmadı: respond_to_relational_bid yalnız acknowledgement ile kapatılamaz",\n      );\n    }\n    expect(findDialogueDecisionIssues("ben de seviyorum", decision)).not.toContain(\n      "DialogueDecision obligation karşılanmadı: respond_to_relational_bid yalnız acknowledgement ile kapatılamaz",\n    );\n  });\n\n  it("keeps pure social routines outside the fulfillment contract", () => {\n    const decision = planDialogueResponse(\n      [],\n      "tamam",\n      "Tolga",\n      {\n        intent: "general_chat",\n        discourseAct: "none",\n        socialRoutine: "agreement",\n        repairSignal: "none",\n        adviceRequested: false,\n      } as any,\n    );\n    expect(decision.move).toBe("complete_social_routine");\n    expect(decision.obligation).toBeUndefined();\n  });\n});\n''', encoding='utf-8')

          Path('docs/adr/0060-relational-bid-fulfillment-authority.md').write_text('''# ADR-0060 — Relational bid fulfillment authority\n\n## Status\nAccepted\n\n## Context\nAfter ADR-0059, substantive answer and grounded-recall moves carry a `DialogueDecision`-owned fulfillment contract. `respond_to_relational_bid` had the same user-facing requirement — generic acknowledgement is insufficient — but the rule was implemented as a dedicated branch inside `findDialogueDecisionIssues`. That made the downstream validator a second source of WHAT-level obligation semantics.\n\nAn API-free characterization on current `main` reproduced the boundary inconsistency: relational bids were planned correctly and generic acknowledgement was rejected, but `decision.obligation` was undefined and the rejection came from a move-specific validator rule.\n\n## Decision\n- Add `respond_to_relational_bid` to `DialogueObligationType`.\n- Attach the existing `acknowledgement_only` prohibition through `attachDecisionOwnedObligation`.\n- Remove the relational-bid-specific acknowledgement branch from `findDialogueDecisionIssues`.\n- The generic obligation validator becomes the sole enforcement path for this fulfillment requirement.\n- Pure social routines remain obligation-free.\n- Relational realization/fallback remains responsible for HOW/content selection; this ADR changes only ownership of the fulfillment contract.\n- No raw-text semantic reparse, provider call, live smoke, or additional WHAT authority is introduced.\n\n## Consequences\nThe same user-visible behavior is preserved while the architecture becomes compositional: answer, recall, and relational-bid fulfillment requirements are declared upstream and consumed generically downstream. New substantive moves can extend the typed contract without adding validator-local semantic branches.\n\n## Verification\nAPI-free deterministic coverage includes the original characterization, a dedicated regression, existing DialogueDecision tests, full Vitest suite, TypeScript, architecture contracts, docs guard and production build.\n''', encoding='utf-8')

          state = Path('PROJECT_STATE.md')
          st = state.read_text(encoding='utf-8')
          note = '''\n\n## 2026-09-06 — DialogueDecision fulfillment authority consolidation\n- PR #112 sonrası API-siz downstream audit'te `respond_to_relational_bid` için ikinci bir semantic-authority izi bulundu: generic acknowledgement yasağı doğru davranışı üretiyor fakat `DialogueDecision.obligation` yerine doğrudan final validator içinde move-specific kural olarak tutuluyordu.\n- ADR-0060 ile ilişkisel bid de typed `DialogueObligation` kapsamına alındı; `findDialogueDecisionIssues` yalnız generic obligation contract'ını tüketir.\n- Son kullanıcı davranışı değişmez: ilişkisel/yakınlık hamlesi `tamam/peki/aynen/anladım` ile geçiştirilemez. Değişen şey kuralın sahipliğidir.\n- Pure social routine'ler obligation-free kalır. Raw-text reparse, yeni WHAT authority veya provider/API çağrısı eklenmez.\n'''
          if '## 2026-09-06 — DialogueDecision fulfillment authority consolidation' not in st:
              state.write_text(st.rstrip() + note + '\n', encoding='utf-8')

      - name: Run focused deterministic tests
        run: npx vitest run src/services/kairaRelationalBidFulfillmentCharacterization.test.ts src/services/kairaRelationalBidFulfillmentRegression.test.ts src/services/kairaGroundedRecallFulfillmentRegression.test.ts src/services/kairaFinalDeliveryObligationRegression.test.ts src/services/kairoDialogueDecisionEngine.test.ts
      - name: Run full tests
        run: npm test -- --run
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-relational-bid-fulfillment-repair.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/kairoDialogueDecisionEngine.ts src/services/kairaRelationalBidFulfillmentCharacterization.test.ts src/services/kairaRelationalBidFulfillmentRegression.test.ts docs/adr/0060-relational-bid-fulfillment-authority.md PROJECT_STATE.md .github/workflows/one-time-relational-bid-fulfillment-repair.yml
          git commit -m "refactor(kaira): centralize relational fulfillment authority"
          git push origin HEAD:audit/relational-bid-fulfillment-authority
