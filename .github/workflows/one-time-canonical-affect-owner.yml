name: One-time canonical affect authority patch

on:
  push:
    branches:
      - fix/canonical-affect-runtime-owner
    paths:
      - .github/workflows/one-time-canonical-affect-owner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/canonical-affect-runtime-owner
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/one-time-canonical-affect-owner.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/droitChatService.ts src/services/kdmConsistencyEngine.ts src/services/kdmRelationshipReducerBridge.ts
          git diff --cached --quiet && exit 1
          git commit -m "fix(kaira): make server KDM canonical affect authority"
          git push
