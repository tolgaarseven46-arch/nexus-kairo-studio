name: Apply language understanding integration

on:
  push:
    paths:
      - ".github/workflows/apply-language-understanding.yml"
      - "scripts/applyLanguageUnderstandingIntegration.mjs"
      - "server.ts"
      - "src/components/studio/tabs/TestLabTab.tsx"
      - "src/services/clientLanguageUnderstanding.ts"
      - "src/services/droitChatService.ts"
      - "src/services/testSessionLayerAuditService.ts"
      - "src/services/languageUnderstandingService.ts"
      - "src/services/llmSemanticUnderstandingProvider.ts"
      - "src/services/llmSemanticUnderstandingProvider.test.ts"
      - "src/services/serverLanguageUnderstanding.ts"
      - "src/services/serverLanguageUnderstanding.test.ts"
      - "src/services/zemberekMorphologyProvider.ts"
      - "src/services/zemberekMorphologyProvider.test.ts"
      - "src/services/languageUnderstandingCases.test.ts"

permissions:
  contents: write

jobs:
  patch-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integration patch
        run: node scripts/applyLanguageUnderstandingIntegration.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit canonical language integration
        run: |
          if git diff --quiet -- server.ts src/services/droitChatService.ts src/components/studio/tabs/TestLabTab.tsx; then
            echo "canonical language integration already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/droitChatService.ts src/components/studio/tabs/TestLabTab.tsx
          git commit -m "feat(language): expose canonical semantic diagnostics"
          git push
