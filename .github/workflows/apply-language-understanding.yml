name: Apply language understanding integration

on:
  push:
    paths:
      - ".github/workflows/apply-language-understanding.yml"
      - "scripts/applyLanguageUnderstandingIntegration.mjs"

permissions:
  contents: write

jobs:
  patch-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integration patch
        run: node scripts/applyLanguageUnderstandingIntegration.mjs
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit server integration
        run: |
          if git diff --quiet -- server.ts; then
            echo "server.ts already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "feat(language): wire language understanding into chat"
          git push
