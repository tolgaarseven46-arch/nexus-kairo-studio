name: One-time project state behavior personality normalization

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-behavior-personality-normalization.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 43. Behavior personality normalization ownership — 2026-08-31\n- Server `/api/chat` personality boundary zaten `normalizeDroitPersonality(...)` kullanıyordu; ancak exported `computeBehaviorProfile(...)` doğrudan/legacy çağrılarda raw trait değerlerini kendi içinde `Number(...)` ile okuyordu. Bu nedenle server dışı çağrılarda out-of-range veya non-finite personality değerleri behavior sentezine sızabiliyordu.\n- `droitBehaviorEngine.computeBehaviorProfile(...)` artık girişte lightweight canonical `normalizeDroitPersonality(traits)` kullanır. Eksik traitler neutral 50'ye tamamlanır, canonical/legacy personality alias değerleri 0..100'e clamp edilir ve `NaN`/`Infinity` kabul edilmez.\n- Server davranışı semantik olarak değişmez; server zaten normalize edilmiş base personality geçiriyordu. Değişiklik direct/legacy behavior çağrılarını aynı canonical contract'a getirir.\n- `kairaBehaviorPersonalityNormalizationBoundaryContracts.test.ts` direct çağrıda 150/-20 clamp'ini ve `NaN`/`Infinity` → neutral 50 fallback'ını doğrular. Empathy summary threshold contract ve normalizer contract ile birlikte targeted zincirde geçti.\n- Entegrasyon commit'i: `f5aed8e` (`fix(kaira): normalize personality at behavior boundary`). Targeted contractlar, TypeScript, full regression ve production build başarıyla geçti.\n- Geçici migration workflow/script kaldırıldı.\n- Sonraki audit adayı: `analyzeKdmInteraction(...)` exported boundary içinde `trait(...)` helper raw personality üzerinde `typeof number` + clamp kullanıyor; `NaN` bir number olduğu için direct KDM çağrısında ilişki/state matematiğine non-finite değer sızma ihtimali ayrıca doğrulanacak.\n'''
          if '## 43. Behavior personality normalization ownership — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record behavior personality normalization"
          git pull --rebase origin main
          git push origin main
