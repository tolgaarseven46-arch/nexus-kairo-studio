name: one-time-kdm-semantic-cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-kdm-semantic-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Remove legacy raw-message classifiers
        run: python .github/scripts/one-time-kdm-semantic-cleanup.py
      - name: Focused regressions
        run: npx vitest run src/services/kdmConsistencyEngine.test.ts src/services/kairaSemanticConsumerAuthorityContracts.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Commit product and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/kdmConsistencyEngine.ts
          git rm .github/workflows/one-time-kdm-semantic-cleanup.yml .github/scripts/one-time-kdm-semantic-cleanup.py
          git commit -m "refactor(kaira): remove legacy KDM raw classifiers"
          git push origin main
