name: One-time patch relationship accountability
on:
  push:
    branches:
      - fix/relationship-accountability-complaint
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/relationship-accountability-complaint
          fetch-depth: 0
      - name: Patch canonical relationship bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/kdmRelationshipReducerBridge.ts')
          s = p.read_text()
          old_import = 'import { isRelationshipNeutralQuestionOnlyStop, relationshipSeverityForInterpretation } from "./kairaQuestionOnlyStopRelationshipPolicy";'
          new_import = 'import { isRelationshipNeutralTurn, relationshipSeverityForInterpretation } from "./kairaQuestionOnlyStopRelationshipPolicy";'
          if old_import not in s:
              raise SystemExit('expected relationship policy import not found')
          s = s.replace(old_import, new_import, 1)
          old_line = '  const rawNegativePattern = isRelationshipNeutralQuestionOnlyStop(semanticInterpretation) ? null : semanticNegativePattern(semanticInterpretation);'
          new_line = '  const rawNegativePattern = isRelationshipNeutralTurn(semanticInterpretation) ? null : semanticNegativePattern(semanticInterpretation);'
          if old_line not in s:
              raise SystemExit('expected rawNegativePattern line not found')
          s = s.replace(old_line, new_line, 1)
          p.write_text(s)
          PY
          rm .github/workflows/one-time-patch-relationship-accountability.yml
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add src/services/kdmRelationshipReducerBridge.ts .github/workflows/one-time-patch-relationship-accountability.yml
          git commit -m 'fix(kaira): keep accountability complaints out of injury patterns'
          git push origin HEAD:fix/relationship-accountability-complaint
