name: one-time fix dialogue social routine projection v2
'on':
  push:
    branches:
      - fix/natural-conversation-v2-quality
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/natural-conversation-v2-quality
      - name: Apply targeted projection patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/services/kairoDialogueDecisionEngine.ts')
          text = path.read_text()
          marker_repeat = '''    return {
      move: "natural_reaction",
      allowFollowUpQuestion: false,
      allowSpeculation: false,
      maxSentences: 1,
      maxWords: 10,
      hasSupportedTargetClaim: false,
      reason:
        "Bu karşılıklı rutin (nasılsın/napıyorsun) bu sohbette zaten yapıldı. Kısa cevap ver ama tekrar 'sen nasılsın / sen napıyorsun' diye SORMA.",
    };'''
          replacement_repeat = marker_repeat.replace('      allowFollowUpQuestion: false,', '      socialRoutine: event.socialRoutine,\n      allowFollowUpQuestion: false,', 1)
          marker_recip = '''    return {
      move: "natural_reaction",
      allowFollowUpQuestion: true,
      allowSpeculation: false,
      maxSentences: 2,
      maxWords: 10,
      hasSupportedTargetClaim: false,
      reason:
        "Kullanıcı Kaira'nın halini veya ne yaptığını doğrudan soruyor. Kısa cevap ver; doğal karşılıklılık için en fazla bir kısa 'sen?' / 'senden naber?' sorusu sorabilirsin.",
    };'''
          replacement_recip = marker_recip.replace('      allowFollowUpQuestion: true,', '      socialRoutine: event.socialRoutine,\n      allowFollowUpQuestion: true,', 1)
          if marker_repeat not in text or marker_recip not in text:
              raise SystemExit('expected projection markers not found')
          text = text.replace(marker_repeat, replacement_repeat, 1)
          text = text.replace(marker_recip, replacement_recip, 1)
          path.write_text(text)
          PY
          rm -f .github/workflows/one-time-fix-dialogue-social-routine-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/kairoDialogueDecisionEngine.ts .github/workflows/one-time-fix-dialogue-social-routine-v2.yml
          git commit -m "fix(kaira): preserve reciprocal social routine projection"
          git push origin HEAD:fix/natural-conversation-v2-quality
