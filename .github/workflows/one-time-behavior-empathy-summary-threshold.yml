name: One-time behavior empathy summary threshold

on:
  push:
    paths:
      - ".github/workflows/one-time-behavior-empathy-summary-threshold.yml"
      - "scripts/applyBehaviorEmpathySummaryThresholdFix.mjs"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix empathy summary threshold
        run: node scripts/applyBehaviorEmpathySummaryThresholdFix.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Empathy summary contract
        run: npm test -- --run src/services/kairaBehaviorEmpathySummaryThresholdContracts.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- src/services/droitBehaviorEngine.ts src/services/kairaBehaviorEmpathySummaryThresholdContracts.test.ts; then
            echo "empathy summary threshold fix already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/droitBehaviorEngine.ts src/services/kairaBehaviorEmpathySummaryThresholdContracts.test.ts
          git commit -m "fix(kaira): align empathy summary threshold scale"
          git pull --rebase origin main
          git push origin main
