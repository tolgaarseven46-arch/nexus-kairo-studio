name: One-time canonical before-state observability fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/fix-test-session-before-state.mjs
      - run: |
          rm scripts/fix-test-session-before-state.mjs .github/workflows/one-time-fix-test-session-before-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts scripts/fix-test-session-before-state.mjs .github/workflows/one-time-fix-test-session-before-state.yml
          git commit -m "fix(kaira): persist canonical pre-turn state"
          git push
