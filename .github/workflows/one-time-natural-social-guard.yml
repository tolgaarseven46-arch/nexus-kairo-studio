name: One-time natural social consistency migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-natural-social-guard.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guard and clean helpers
        run: |
          node scripts/one-time-natural-social-guard.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-natural-social-guard.mjs
          git rm .github/workflows/one-time-natural-social-guard.yml
          git add src/services/kairoDialogueDecisionEngine.ts src/services/kairaNaturalSocialConsistencyContracts.test.ts
          git commit -m "fix(kaira): enforce natural social response consistency"
          git push
