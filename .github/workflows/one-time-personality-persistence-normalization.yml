name: One-time personality persistence normalization

on:
  push:
    paths:
      - ".github/workflows/one-time-personality-persistence-normalization.yml"
      - "scripts/applyPersonalityPersistenceNormalization.mjs"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize personality persistence boundaries
        run: node scripts/applyPersonalityPersistenceNormalization.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Personality persistence contracts
        run: npm test -- --run src/services/kairaPersonalityPersistenceNormalizationContracts.test.ts src/services/kairaPersonalityDefaultSourceContracts.test.ts src/services/droitPersonalityNormalizer.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- src/services/droitPersonalityService.ts src/services/kairaPersonalityPersistenceNormalizationContracts.test.ts; then
            echo "personality persistence normalization already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/droitPersonalityService.ts src/services/kairaPersonalityPersistenceNormalizationContracts.test.ts
          git commit -m "fix(kaira): normalize personality persistence boundaries"
          git pull --rebase origin main
          git push origin main
