name: CI Diagnostic

on:
  push:
    branches:
      - codex/ci-diagnostic-2668
    paths-ignore:
      - ci-diagnostic.txt
      - ci-exit-code.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ci-diagnostic-2668
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run tests and capture output
        shell: bash
        run: |
          set +e
          npm test -- --run 2>&1 | tee ci-diagnostic.txt
          status=${PIPESTATUS[0]}
          echo "$status" > ci-exit-code.txt
          exit 0
      - name: Commit diagnostic output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostic.txt ci-exit-code.txt
          git commit -m "chore(ci): capture diagnostic output" || exit 0
          git push origin HEAD:codex/ci-diagnostic-2668
