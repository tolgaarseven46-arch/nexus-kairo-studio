name: CI Diagnostic

on:
  push:
    branches:
      - codex/ci-diagnostic-2668
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run tests and capture output
        shell: bash
        run: |
          set +e
          npm test -- --run 2>&1 | tee ci-diagnostic.txt
          status=${PIPESTATUS[0]}
          echo "$status" > ci-exit-code.txt
          exit 0
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostic
          path: |
            ci-diagnostic.txt
            ci-exit-code.txt
