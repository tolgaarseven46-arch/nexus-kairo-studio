name: One-time final response plan delivery guard v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enforce final ResponsePlan before delivery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          d = Path('src/services/kairoDialogueDecisionEngine.ts')
          ds = d.read_text()
          old = '  if (plan.move === "follow_previous_answer") return "he tamam o zaman";\n  if (plan.move === "join_banter") {'
          new = '  if (plan.move === "follow_previous_answer") return "he tamam o zaman";\n  if (plan.move === "acknowledge_correction") return "he doğru";\n  if (plan.move === "join_banter") {'
          if old not in ds: raise SystemExit('dialogue fallback marker missing')
          d.write_text(ds.replace(old, new, 1))

          server = Path('server.ts')
          s = server.read_text()
          old_block = '''    reply = enforced.reply;\n    const aiMs = Math.round(now() - aiStart);\n    const baseConsistency = validateKairoResponse(reply, kdm.trace);\n    const finalPlanIssues = findKairaResponsePlanIssues(reply, responsePlan);\n    const finalIssues = [...new Set([...groundingIssues, ...finalPlanIssues])];'''
          new_block = '''    reply = enforced.reply;\n    let postEnforcementPlanIssues = findKairaResponsePlanIssues(reply, responsePlan);\n    if (postEnforcementPlanIssues.length) {\n      const planSafeFallback = buildGroundedDialogueFallback(\n        dialogueDecision, cleanHistory, userMessage, userName, dialogueAnalysis, responsePlan.allowQuestion,\n      );\n      if (planSafeFallback) {\n        const planSafeIssues = [\n          ...findKairoGroundingIssues(planSafeFallback, cleanHistory, userMessage),\n          ...findDialogueAttributionIssues(planSafeFallback, cleanHistory, userMessage, userName, dialogueAnalysis),\n          ...findDialogueDecisionIssues(planSafeFallback, dialogueDecision, dialogueOutputStyle),\n          ...findKairaResponsePlanIssues(planSafeFallback, responsePlan),\n          ...findWorldModelResponseIssues(planSafeFallback, retrievedWorldEvents).map((issue) => issue.message),\n        ];\n        if (planSafeIssues.length === 0) {\n          reply = planSafeFallback;\n          postEnforcementPlanIssues = [];\n          enforced.changed = true;\n          enforced.reasons.push("response_plan_delivery_fallback");\n        }\n      }\n    }\n    const aiMs = Math.round(now() - aiStart);\n    const baseConsistency = validateKairoResponse(reply, kdm.trace);\n    const finalPlanIssues = postEnforcementPlanIssues;\n    const finalIssues = [...new Set([...groundingIssues, ...finalPlanIssues])];'''
          if old_block not in s: raise SystemExit('final delivery seam missing')
          server.write_text(s.replace(old_block, new_block, 1))

          test = Path('src/services/kairaPostEnforcementResponsePlanContracts.test.ts')
          test.write_text('''import { describe, expect, it } from "vitest";\nimport { buildBehaviorContract } from "./behaviorContract";\nimport { enforceBehaviorContract } from "./behaviorContractEnforcer";\nimport { buildGroundedDialogueFallback, findDialogueDecisionIssues, type DialogueDecisionPlan } from "./kairoDialogueDecisionEngine";\nimport { buildKairaResponsePlan, findKairaResponsePlanIssues } from "./kairaResponsePlan";\n\nconst trace = { messageInterpretation: { intent: "duygusal_paylasim" } } as any;\nconst speech = { register:"balanced", relationshipLevel:"new", sentenceLength:"short", slangLevel:0, humorLevel:0, emojiLevel:0, warmthLevel:20, directness:50, rhythm:{ messageLength:"short_first", bubbleFlow:"split_when_natural", punctuation:"sparse_in_casual_chat", colloquialSpelling:"light", topicTransitions:"direct" }, instructions:[] } as any;\nconst emotionalDialogue: DialogueDecisionPlan = { move:"invite_emotional_context", allowFollowUpQuestion:true, allowSpeculation:false, maxSentences:1, maxWords:4, hasSupportedTargetClaim:false, reason:"test" };\n\ndescribe("post-enforcement final ResponsePlan delivery", () => {\n  it("replaces a wider behavior-contract fallback with a plan-safe focused fallback", () => {\n    const state = { calmness:50, anger:20, stress:20, happiness:40, confidence:50, surprise:0, relationship:{ conversationState:"distancing", hurtScore:35, conflictScore:15, repairProgress:0, repairAttempts:0 } } as any;\n    const contract = buildBehaviorContract(state);\n    const plan = buildKairaResponsePlan(contract, emotionalDialogue, speech);\n    const contractResult = enforceBehaviorContract("hahaha gel sarılayım", trace, contract);\n    expect(contractResult.changed).toBe(true);\n    expect(findKairaResponsePlanIssues(contractResult.reply, plan)).toContain("response_plan_word_budget_exceeded");\n    const fallback = buildGroundedDialogueFallback(emotionalDialogue, [], "moralim bozuk", "Ali", undefined, plan.allowQuestion);\n    expect(fallback).toBe("hmm");\n    expect(findDialogueDecisionIssues(fallback!, emotionalDialogue, { allowQuestion:plan.allowQuestion, emojiBudget:plan.emojiBudget, maxSentences:plan.maxSentences, maxWords:plan.maxWords })).toEqual([]);\n    expect(findKairaResponsePlanIssues(fallback!, plan)).toEqual([]);\n  });\n  it("provides a minimal correction fallback", () => {\n    const dialogue: DialogueDecisionPlan = { move:"acknowledge_correction", allowFollowUpQuestion:false, allowSpeculation:false, maxSentences:2, maxWords:8, hasSupportedTargetClaim:false, reason:"test" };\n    expect(buildGroundedDialogueFallback(dialogue, [], "hayır öyle değildi", "Ali")).toBe("he doğru");\n  });\n});\n''')

          integ = Path('src/services/kairaResponsePlanIntegrationContracts.test.ts')
          itext = integ.read_text()
          old_expect = '    expect(server).toContain("finalPlanIssues = findKairaResponsePlanIssues(reply, responsePlan)");'
          new_expect = '''    expect(server).toContain("postEnforcementPlanIssues = findKairaResponsePlanIssues(reply, responsePlan)");\n    expect(server).toContain("findKairaResponsePlanIssues(planSafeFallback, responsePlan)");\n    expect(server).toContain("response_plan_delivery_fallback");'''
          if old_expect not in itext: raise SystemExit('integration expectation marker missing')
          integ.write_text(itext.replace(old_expect, new_expect, 1))
          PY
          npm install
          npx vitest run src/services/kairaPostEnforcementResponsePlanContracts.test.ts src/services/kairaResponsePlanIntegrationContracts.test.ts src/services/kairaResponsePlan.test.ts
          npx tsc --noEmit
          npm test
          npm run build
          rm .github/workflows/one-time-final-response-plan-delivery-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/kairoDialogueDecisionEngine.ts src/services/kairaPostEnforcementResponsePlanContracts.test.ts src/services/kairaResponsePlanIntegrationContracts.test.ts .github/workflows/one-time-final-response-plan-delivery-v2.yml
          git commit -m "fix(kaira): enforce response plan before final delivery"
          git push
