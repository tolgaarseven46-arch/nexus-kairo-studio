name: One-time project state fine-tune registry audit

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-finetune-registry-audit.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 48. CharacterTab fine-tune registry audit complete — 2026-08-31\n- CharacterTab `LAYERS` registry ile runtime fine-tune tüketicileri blok blok karşılaştırıldı: temperament, personality, motivation, values, preferences, social, boundaries ve expression.\n- Motivation, values, preferences ve social bloklarında UI key'leri runtime reader'larla birebir eşleşiyor; no-op bulunmadı.\n- Boundaries bloğundaki altı slider (`disrespect`, `manipulation`, `privacy`, `assertiveness`, `escalation`, `forgiveness`) `boundaryEngine.boundariesFromFineTune(...)` tarafından doğrudan okunuyor ve violation/assertion/escalation/repair/disengagement davranış sinyallerine giriyor.\n- Expression bloğunda wordplay 46. kayıtta düzeltildikten sonra kalan tüm humor ve speech sliderları `expressionStyleFromFineTune(...)` tarafından doğrudan okunuyor; yeni no-op bulunmadı.\n- Personality bloğundaki altı slider (`confidence`, `directness`, `stubbornness`, `analysisDepth`, `flexibility`, legacy persisted `deciveness`) `personalityTendenciesFromFineTune(...)` tarafından doğrudan okunuyor ve assertive/analysis/revision/decision davranış sinyallerine giriyor.\n- `personality.cognition.deciveness` yazımı typo olsa da CharacterTab, runtime engine ve persisted localStorage contract'ında aynı key olduğu için mevcut profilleri kırmamak adına rename edilmedi.\n- Temperament bloğunda bulunan gerçek registry sorunları 47. kayıtta kapatıldı: `uncertaintyTolerance` ve `approachDrive` no-op olmaktan çıkarıldı; `reactivity.threshold` ters semantiği düzeltildi.\n- Sonuç: CharacterTab'da kullanıcıya gösterilen fine-tune davranış sliderları içinde şu an bilinen sessiz no-op key kalmadı. Bundan sonraki audit odağı key wiring değil, sliderların ürettiği davranış etkisinin büyüklük/yön/doğallık açısından baseline örneklerle doğrulanması olmalıdır.\n'''
          if '## 48. CharacterTab fine-tune registry audit complete — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record fine-tune registry audit"
          git pull --rebase origin main
          git push origin main
