name: One-time personality default source consolidation

on:
  push:
    paths:
      - ".github/workflows/one-time-personality-default-source-consolidation.yml"
      - "scripts/applyPersonalityDefaultSourceConsolidation.mjs"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate personality default source
        run: node scripts/applyPersonalityDefaultSourceConsolidation.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Personality default source contract
        run: npm test -- --run src/services/kairaPersonalityDefaultSourceContracts.test.ts src/services/droitPersonalityNormalizer.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- src/services/droitPersonalityService.ts src/services/kairaPersonalityDefaultSourceContracts.test.ts; then
            echo "personality default source already consolidated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/droitPersonalityService.ts src/services/kairaPersonalityDefaultSourceContracts.test.ts
          git commit -m "refactor(kaira): consolidate personality defaults"
          git pull --rebase origin main
          git push origin main
