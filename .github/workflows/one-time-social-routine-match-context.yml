name: One-time Social Routine Match Context

on:
  push:
    branches:
      - diag/social-routine-match-context

permissions:
  contents: write

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diag/social-routine-match-context
          fetch-depth: 0
      - name: Characterize production semantic drift
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nexus-kairo-studio.onrender.com/api/language-understanding'
          run_case() {
            local name="$1"
            local body="$2"
            for i in 1 2 3 4 5; do
              curl --fail-with-body --silent --show-error --max-time 120 \
                -H 'Content-Type: application/json' --data "$body" "$URL" > "/tmp/${name}_${i}.json"
            done
          }
          run_case standalone '{"userMessage":"iyi maç izliyorum","userName":"Mert","characterName":"Kaira","history":[],"provider":"openrouter"}'
          run_case after_greeting '{"userMessage":"iyi maç izliyorum","userName":"Mert","characterName":"Kaira","history":[{"role":"user","content":"naber"},{"role":"assistant","content":"iyi valla sen nasılsın"}],"provider":"openrouter"}'
          run_case after_direct_question '{"userMessage":"iyi maç izliyorum","userName":"Mert","characterName":"Kaira","history":[{"role":"user","content":"naber"},{"role":"assistant","content":"iyi valla sen nasılsın"},{"role":"user","content":"iyi"},{"role":"assistant","content":"ne yapıyorsun"}],"provider":"openrouter"}'
          node <<'NODE'
          const fs = require('fs');
          const names = ['standalone','after_greeting','after_direct_question'];
          const summary = {};
          for (const name of names) {
            const rows = [];
            for (let i=1;i<=5;i++) {
              const x = JSON.parse(fs.readFileSync(`/tmp/${name}_${i}.json`, 'utf8')).interpretation;
              rows.push({
                primaryIntent:x.primaryIntent,
                socialRoutine:x.discourseFacets?.socialRoutine,
                discourseAct:x.discourseFacets?.discourseAct,
                target:x.target,
                valence:x.valence,
                uncertainty:x.uncertainty?.overall,
              });
            }
            summary[name] = rows;
          }
          console.log(JSON.stringify(summary, null, 2));
          const all = Object.values(summary).flat();
          const drift = all.filter(x => x.socialRoutine && x.socialRoutine !== 'none');
          console.log(`SOCIAL_ROUTINE_NON_NONE=${drift.length}/${all.length}`);
          NODE
      - name: Self-remove
        run: |
          git rm .github/workflows/one-time-social-routine-match-context.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove social-routine characterization diagnostic'
          git push origin HEAD:diag/social-routine-match-context
