name: One-time world debug UI

on:
  push:
    paths:
      - scripts/one-time-world-debug-ui.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/one-time-world-debug-ui.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/droitChatService.ts src/services/kdmPersistenceService.ts src/types/nexus.ts src/components/studio/NexusStudioLayout.tsx src/components/studio/tabs/MindMapTab.tsx src/services/kairaWorldModelResponseGuardIntegrationContracts.test.ts PROJECT_STATE.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(debug): expose world guard through KNT UI"
          git push
