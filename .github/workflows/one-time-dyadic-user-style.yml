name: one-time-dyadic-user-style

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-dyadic-user-style.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Normalize migration script
        run: |
          sed -i 's/minimum=2/minimum=1/g' .github/scripts/one-time-dyadic-user-style.py
          python <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/one-time-dyadic-user-style.py')
          s = p.read_text()
          marker = 'replace_all(\n    "server.ts",\n    """${languageStyleMemoryInstruction'
          start = s.index(marker)
          end = s.index('\n\n# Existing policy contract', start)
          replacement = '''prompt_marker = "${languageStyleMemoryInstruction(stateUserId, kairaPolicy.persistentUserMemory)}"\nprompt_insert = prompt_marker + chr(92) + "\\n" + "${dyadicLanguageAlignmentInstruction(stateUserId, speech.relationshipLevel, kairaPolicy.persistentUserMemory)}"\nreplace_all("server.ts", prompt_marker, prompt_insert, minimum=1)'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Apply migration
        run: python .github/scripts/one-time-dyadic-user-style.py
      - name: Tighten generated marker assertion
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('src/services/kairaDyadicUserStyleContracts.test.ts')
          s = p.read_text()
          old = "    expect(dyadicLanguageAlignmentInstruction(userId, 'familiar')).not.toContain('lan');"
          new = "    expect(dyadicLanguageAlignmentInstruction(userId, 'familiar')).toContain('markerlar=kanka');\n    expect(dyadicLanguageAlignmentInstruction(userId, 'familiar')).not.toContain('markerlar=lan');"
          if old not in s:
              raise SystemExit('dyadic familiar assertion target missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Focused regressions
        run: npx vitest run src/services/kairaDyadicUserStyleContracts.test.ts src/services/kairaLanguageMemoryLearningContracts.test.ts src/services/kairaLanguageMemoryPolicyBoundaryContracts.test.ts src/services/kairaLanguageMemoryInstanceIsolation.test.ts src/services/kairaLanguageMemoryStyleAdaptationRegression.test.ts src/services/kairaLanguageStyleMemoryIntegrationContracts.test.ts src/services/kairoLocalLanguageEngine.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Commit and clean helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/kairoLanguageMemory.ts src/services/kairoLocalLanguageEngine.ts src/services/kairaLanguageMemoryPolicyBoundaryContracts.test.ts src/services/kairaDyadicUserStyleContracts.test.ts
          git rm -f .github/workflows/one-time-dyadic-user-style.yml .github/scripts/one-time-dyadic-user-style.py
          git commit -m "feat(kaira): add dyadic user style alignment"
          git push origin main
