name: one-time-dyadic-user-style

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-dyadic-user-style.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - name: Apply dyadic user style projection
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'target not found: {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count < minimum:
                  raise SystemExit(f'target count {count} < {minimum}: {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new))

          path = 'src/services/kairoLanguageMemory.ts'
          replace_once(path,
          '''  recentReplies: string[];\n  interactionCount: number;\n}''',
          '''  recentReplies: string[];\n  interactionCount: number;\n  userMarkerWeights: Record<string, number>;\n  recentUserWordCounts: number[];\n  userStyleInteractionCount: number;\n}''')

          replace_once(path,
          '''export interface LanguageStyleMemorySignal {\n  interactionCount: number;\n  maturity: 'cold' | 'emerging' | 'learned';\n  preferredMarkers: string[];\n  averageWords: number;\n  lengthPreference: 'very_short' | 'short' | 'medium';\n}\n''',
          '''export interface LanguageStyleMemorySignal {\n  interactionCount: number;\n  maturity: 'cold' | 'emerging' | 'learned';\n  preferredMarkers: string[];\n  averageWords: number;\n  lengthPreference: 'very_short' | 'short' | 'medium';\n}\n\nexport interface DyadicUserStyleSignal {\n  interactionCount: number;\n  maturity: 'cold' | 'emerging' | 'learned';\n  preferredMarkers: string[];\n  averageWords: number;\n  lengthPreference: 'very_short' | 'short' | 'medium';\n}\n\nexport type DyadicRelationshipLevel = 'new' | 'familiar' | 'close';\n''')

          replace_once(path,
          '''const STYLE_MARKERS = ['kanka', 'ya', 'valla', 'aynen', 'he', 'be', 'işte', 'hani', 'yani', 'neyse', 'eyvallah', 'hadi', 'falan', 'filan', 'harbi', 'cidden'] as const;\n''',
          '''const STYLE_MARKERS = ['kanka', 'ya', 'valla', 'aynen', 'he', 'be', 'işte', 'hani', 'yani', 'neyse', 'eyvallah', 'hadi', 'falan', 'filan', 'harbi', 'cidden'] as const;\nconst SAFE_USER_STYLE_MARKERS = ['kanka', 'lan', 'aga', 'ya', 'be', 'valla', 'aynen', 'eyvallah', 'harbi', 'cidden', 'işte', 'hani', 'neyse'] as const;\nconst USER_STYLE_MARKER_SET = new Set<string>(SAFE_USER_STYLE_MARKERS);\nconst USER_STYLE_MARKER_THRESHOLD = 2.5;\nconst USER_STYLE_RETENTION = 0.9;\n''')

          replace_once(path,
          '''function createProfile(): LanguageMemoryProfile {\n  return { wordWeights: { ...BASE_WORDS }, phraseWeights: {}, recentReplies: [], interactionCount: 0 };\n}''',
          '''function createProfile(): LanguageMemoryProfile {\n  return {\n    wordWeights: { ...BASE_WORDS },\n    phraseWeights: {},\n    recentReplies: [],\n    interactionCount: 0,\n    userMarkerWeights: {},\n    recentUserWordCounts: [],\n    userStyleInteractionCount: 0,\n  };\n}''')

          replace_once(path,
          '''    recentReplies: Array.isArray(raw?.recentReplies) ? raw.recentReplies.filter((x: any) => typeof x === 'string').slice(0, 8) : [],\n    interactionCount: Number.isFinite(Number(raw?.interactionCount)) ? Math.max(0, Number(raw.interactionCount)) : 0,\n''',
          '''    recentReplies: Array.isArray(raw?.recentReplies) ? raw.recentReplies.filter((x: any) => typeof x === 'string').slice(0, 8) : [],\n    interactionCount: Number.isFinite(Number(raw?.interactionCount)) ? Math.max(0, Number(raw.interactionCount)) : 0,\n    userMarkerWeights: boundedWeights(raw?.userMarkerWeights, SAFE_USER_STYLE_MARKERS.length, 20),\n    recentUserWordCounts: Array.isArray(raw?.recentUserWordCounts)\n      ? raw.recentUserWordCounts.map(Number).filter((x: number) => Number.isFinite(x) && x >= 0).slice(0, 8)\n      : [],\n    userStyleInteractionCount: Number.isFinite(Number(raw?.userStyleInteractionCount)) ? Math.max(0, Number(raw.userStyleInteractionCount)) : 0,\n''')

          anchor = '''export function learnLanguageReply(userId: string, reply: string) {'''
          insert = '''function dyadicSignalFromProfile(profile: LanguageMemoryProfile): DyadicUserStyleSignal {\n  const preferredMarkers = SAFE_USER_STYLE_MARKERS\n    .map((marker) => ({ marker, weight: profile.userMarkerWeights[marker] ?? 0 }))\n    .filter((item) => item.weight >= USER_STYLE_MARKER_THRESHOLD)\n    .sort((a, b) => b.weight - a.weight || a.marker.localeCompare(b.marker, 'tr'))\n    .slice(0, 4)\n    .map((item) => item.marker);\n  const counts = profile.recentUserWordCounts.filter((count) => count > 0);\n  const averageWords = counts.length ? counts.reduce((sum, count) => sum + count, 0) / counts.length : 0;\n  const lengthPreference: DyadicUserStyleSignal['lengthPreference'] = averageWords <= 4 ? 'very_short' : averageWords <= 8 ? 'short' : 'medium';\n  const maturity = profile.userStyleInteractionCount >= 10 ? 'learned' : profile.userStyleInteractionCount >= 4 ? 'emerging' : 'cold';\n  return { interactionCount: profile.userStyleInteractionCount, maturity, preferredMarkers, averageWords: Number(averageWords.toFixed(1)), lengthPreference };\n}\n\nexport function observeUserLanguageStyle(userId: string, userMessage: string, useLearnedMemory = true) {\n  if (!useLearnedMemory) return;\n  const profile = getLanguageMemory(userId);\n  const words = normalizeLanguageText(userMessage).split(/\\s+/).filter(Boolean);\n  const observed = new Set(words.filter((word) => USER_STYLE_MARKER_SET.has(word)));\n  for (const marker of SAFE_USER_STYLE_MARKERS) {\n    const current = profile.userMarkerWeights[marker] ?? 0;\n    const next = observed.has(marker) ? Math.min(20, current + 1) : current * USER_STYLE_RETENTION;\n    if (next < 0.1) delete profile.userMarkerWeights[marker];\n    else profile.userMarkerWeights[marker] = next;\n  }\n  profile.userStyleInteractionCount += 1;\n  profile.recentUserWordCounts = [words.length, ...profile.recentUserWordCounts].slice(0, 8);\n  schedulePersist(userId);\n}\n\nexport function dyadicLanguageStyleSignal(userId: string, useLearnedMemory = true): DyadicUserStyleSignal {\n  if (!useLearnedMemory) return { interactionCount: 0, maturity: 'cold', preferredMarkers: [], averageWords: 0, lengthPreference: 'very_short' };\n  return dyadicSignalFromProfile(getLanguageMemory(userId));\n}\n\nfunction dyadicCandidateAffinity(profile: LanguageMemoryProfile, reply: string, relationshipLevel: DyadicRelationshipLevel) {\n  if (relationshipLevel === 'new') return 0;\n  const signal = dyadicSignalFromProfile(profile);\n  if (signal.maturity === 'cold') return 0;\n  const words = new Set(normalizeLanguageText(reply).split(/\\s+/).filter(Boolean));\n  const relationshipWeight = relationshipLevel === 'close' ? 0.45 : 0.22;\n  return signal.preferredMarkers.reduce((sum, marker) => sum + (words.has(marker) ? relationshipWeight : 0), 0);\n}\n\nexport function dyadicLanguageAlignmentInstruction(userId: string, relationshipLevel: DyadicRelationshipLevel, useLearnedMemory = true) {\n  const signal = dyadicLanguageStyleSignal(userId, useLearnedMemory);\n  if (relationshipLevel === 'new' || signal.maturity === 'cold') return '';\n  const allowedMarkers = signal.preferredMarkers.filter((marker) => relationshipLevel === 'close' || marker !== 'lan');\n  const markers = allowedMarkers.length ? allowedMarkers.join(', ') : 'belirgin güvenli marker yok';\n  return `KİŞİYE ÖZGÜ DİL UYUMU (HOW-ONLY, ÇOK DÜŞÜK OTORİTE):\\nBu kullanıcıyla yerleşen güvenli yazım ritmi=${signal.lengthPreference} (~${signal.averageWords} kelime); tekrar eden güvenli markerlar=${markers}.\\nYalnız doğal olduğunda hafifçe yakınsa. Küfür/hakaret, içerik, anı, duygu, niyet, ilişki sonucu veya davranış izni öğrenme/üretme. Kullanıcının cümlesini kopyalama. ResponsePlan ve SpeechIdentity her zaman üstündür.`;\n}\n\n'''
          p = Path(path); s = p.read_text()
          if anchor not in s: raise SystemExit('learn anchor missing')
          p.write_text(s.replace(anchor, insert + anchor, 1))

          replace_once(path,
          '''export function chooseLanguageReply(userId: string, candidates: string[], seed: string, useLearnedMemory = true) {\n  const profile = useLearnedMemory ? getLanguageMemory(userId) : createProfile();''',
          '''export function chooseLanguageReply(userId: string, candidates: string[], seed: string, useLearnedMemory = true, relationshipLevel: DyadicRelationshipLevel = 'new') {\n  const profile = useLearnedMemory ? getLanguageMemory(userId) : createProfile();''')
          replace_once(path,
          '''      score: affinityForProfile(profile, reply)\n        - repetitionPenalty(profile, reply)\n        + (((hash + index * 17) % 100) / 100) * 1.25,''',
          '''      score: affinityForProfile(profile, reply)\n        + dyadicCandidateAffinity(profile, reply, relationshipLevel)\n        - repetitionPenalty(profile, reply)\n        + (((hash + index * 17) % 100) / 100) * 1.25,''')

          # Local verbalizer consumes the same low-authority dyadic signal.
          replace_once('src/services/kairoLocalLanguageEngine.ts',
          '''    useLearnedMemory,\n  );''',
          '''    useLearnedMemory,\n    relationshipLevel,\n  );''')

          # Server observes the user input after hydration, and AI HOW consumes the same signal.
          replace_once('server.ts',
          '''  languageStyleMemoryInstruction,\n  languageStyleMemorySignal,\n  learnLanguageReply,''',
          '''  languageStyleMemoryInstruction,\n  languageStyleMemorySignal,\n  dyadicLanguageAlignmentInstruction,\n  observeUserLanguageStyle,\n  learnLanguageReply,''')
          replace_all('server.ts',
          '''    ]);\n    const memoryMs = Math.round(now() - memoryStart),\n      languageStyleMemory = languageStyleMemorySignal(stateUserId, kairaPolicy.persistentUserMemory),''',
          '''    ]);\n    observeUserLanguageStyle(stateUserId, userMessage, kairaPolicy.persistentUserMemory);\n    const memoryMs = Math.round(now() - memoryStart),\n      languageStyleMemory = languageStyleMemorySignal(stateUserId, kairaPolicy.persistentUserMemory),''')
          replace_all('server.ts',
          '''${languageStyleMemoryInstruction(stateUserId, kairaPolicy.persistentUserMemory)}\\\n${socialStyle}\\''',
          '''${languageStyleMemoryInstruction(stateUserId, kairaPolicy.persistentUserMemory)}\\\n${dyadicLanguageAlignmentInstruction(stateUserId, speech.relationshipLevel, kairaPolicy.persistentUserMemory)}\\\n${socialStyle}\\''')

          Path('src/services/kairaDyadicUserStyleContracts.test.ts').write_text(r'''import { beforeEach, describe, expect, it } from 'vitest';
import { readFileSync } from 'node:fs';
import {
  chooseLanguageReply,
  dyadicLanguageAlignmentInstruction,
  dyadicLanguageStyleSignal,
  getLanguageMemory,
  observeUserLanguageStyle,
} from './kairoLanguageMemory';

const userId = 'dyadic-user-style-contract';

beforeEach(() => {
  const profile = getLanguageMemory(userId);
  profile.userMarkerWeights = {};
  profile.recentUserWordCounts = [];
  profile.userStyleInteractionCount = 0;
  profile.recentReplies = [];
  profile.phraseWeights = {};
  profile.interactionCount = 0;
});

describe('dyadic user style projection contracts', () => {
  it('does not infer a stable style from one message', () => {
    observeUserLanguageStyle(userId, 'naber lan kanka');
    expect(dyadicLanguageStyleSignal(userId).maturity).toBe('cold');
    expect(dyadicLanguageAlignmentInstruction(userId, 'close')).toBe('');
  });

  it('learns only allowlisted HOW markers after repeated evidence', () => {
    for (let i = 0; i < 8; i += 1) observeUserLanguageStyle(userId, 'naber lan kanka aq salak');
    const signal = dyadicLanguageStyleSignal(userId);
    expect(signal.maturity).toBe('emerging');
    expect(signal.preferredMarkers).toContain('kanka');
    expect(signal.preferredMarkers).toContain('lan');
    expect(signal.preferredMarkers).not.toContain('aq');
    expect(signal.preferredMarkers).not.toContain('salak');
  });

  it('keeps relationship authority above alignment', () => {
    for (let i = 0; i < 8; i += 1) observeUserLanguageStyle(userId, 'lan kanka');
    expect(dyadicLanguageAlignmentInstruction(userId, 'new')).toBe('');
    expect(dyadicLanguageAlignmentInstruction(userId, 'familiar')).not.toContain('lan');
    expect(dyadicLanguageAlignmentInstruction(userId, 'close')).toContain('lan');
  });

  it('does not observe or expose learned user style when memory policy is disabled', () => {
    observeUserLanguageStyle(userId, 'kanka kanka', false);
    expect(dyadicLanguageStyleSignal(userId, false)).toEqual({
      interactionCount: 0,
      maturity: 'cold',
      preferredMarkers: [],
      averageWords: 0,
      lengthPreference: 'very_short',
    });
  });

  it('can gently bias local candidate selection only when relationship permits it', () => {
    for (let i = 0; i < 10; i += 1) observeUserLanguageStyle(userId, 'kanka');
    const candidates = ['tamam', 'tamam kanka'];
    const cold = chooseLanguageReply(userId, candidates, 'seed-1', true, 'new');
    const close = chooseLanguageReply(userId, candidates, 'seed-1', true, 'close');
    expect(cold === 'tamam' || cold === 'tamam kanka').toBe(true);
    expect(close).toBe('tamam kanka');
  });

  it('wires observation from userMessage and HOW-only AI/local consumers', () => {
    const server = readFileSync('server.ts', 'utf8');
    const local = readFileSync('src/services/kairoLocalLanguageEngine.ts', 'utf8');
    expect(server).toContain('observeUserLanguageStyle(stateUserId, userMessage, kairaPolicy.persistentUserMemory)');
    expect(server).toContain('dyadicLanguageAlignmentInstruction(stateUserId, speech.relationshipLevel, kairaPolicy.persistentUserMemory)');
    expect(local).toContain('useLearnedMemory,\n    relationshipLevel,');
  });
});
''')
          PY
      - name: Focused regressions
        run: npx vitest run src/services/kairaDyadicUserStyleContracts.test.ts src/services/kairaLanguageMemoryLearningContracts.test.ts src/services/kairaLanguageMemoryPolicyBoundaryContracts.test.ts src/services/kairaLanguageMemoryInstanceIsolation.test.ts src/services/kairaLanguageMemoryStyleAdaptationRegression.test.ts src/services/kairaLanguageStyleMemoryIntegrationContracts.test.ts src/services/kairoLocalLanguageEngine.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/kairoLanguageMemory.ts src/services/kairoLocalLanguageEngine.ts src/services/kairaDyadicUserStyleContracts.test.ts
          git rm .github/workflows/one-time-dyadic-user-style.yml
          git commit -m "feat(kaira): add dyadic user style alignment"
          git push origin main
