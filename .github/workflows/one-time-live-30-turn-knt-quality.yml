name: One-time live 30-turn KNT quality

on:
  push:
    branches:
      - chatgpt/pr46-checkpoint-and-live-knt-quality

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run live canonical 30-turn conversation
        shell: bash
        run: |
          node <<'NODE'
          const endpoint = 'https://nexus-kairo-studio.onrender.com/api/chat';
          const messages = [
            'selam kaira',
            'naber',
            'ben bugün baya yoruldum',
            'işte saçma sapan toplantılar vardı',
            'neyse',
            'Mert yarın istifa edeceğini söyledi',
            'müdürle de konuşacakmış',
            'sence mantıklı mı',
            'bence haklı',
            'sen salaksın',
            'cidden sinir oldum sana',
            'neyse tamam',
            'selam tekrar',
            'dün biraz sert konuştum',
            'kusura bakma',
            'özür dilerim',
            'naber şimdi',
            'Mert yarın ne yapacaktı',
            'sağ ol',
            'bugün de işler yoğundu',
            'ama hallederiz',
            'soru sorma artık',
            'zaten cevabını biliyorum',
            'tamam',
            'bi şey sorcam',
            'Mert müdürle konuşacak mıydı',
            'heh tamam',
            'iyi geceler',
            'görüşürüz',
            'son bi şey, bugün iyiydin',
          ];
          const userId = `live_knt_quality_${Date.now()}`;
          const sessionId = `session_${userId}`;
          let dynamicState = undefined;
          let history = [];
          const turns = [];
          const softFlags = [];
          const norm = (s='') => s.toLocaleLowerCase('tr-TR').replace(/[^a-zçğıöşü0-9\s]/giu,' ').replace(/\s+/gu,' ').trim();
          const words = (s='') => norm(s).split(/\s+/u).filter(Boolean);
          const assistantDrift = /\b(?:elbette|memnuniyetle|nasıl yardımcı olabilirim|yardımcı olabilirim|dilerseniz|özetlemek gerekirse|istersen sana|isterseniz)\b/iu;
          const listDrift = /(?:^|\n)\s*(?:[-*•]|\d+[.)])\s+/u;
          const fetchJson = async (body) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 50000);
            try {
              const res = await fetch(endpoint,{method:'POST',signal:controller.signal,headers:{'content-type':'application/json'},body:JSON.stringify(body)});
              const text = await res.text();
              let data; try { data = JSON.parse(text); } catch { data = { raw:text.slice(0,1000) }; }
              return {res,data};
            } finally { clearTimeout(timer); }
          };
          for (let i=0;i<messages.length;i++) {
            const userMessage = messages[i];
            const requestId = `${userId}_turn_${String(i+1).padStart(2,'0')}`;
            const payload = {
              sessionId, requestId, userId, userName:'Ali', userMessage,
              character:{name:'Kaira',roleTitle:'Arkadaş',raceName:'Sentetik Droit'},
              personality:{}, dynamicState,
              history: history.slice(-24), provider:'openrouter', suppressRecentMemory:false,
            };
            const {res,data} = await fetchJson(payload);
            if (!res.ok) {
              console.error('LIVE_KNT_HARD_FAILURE '+JSON.stringify({turn:i+1,userMessage,status:res.status,error:data?.error,raw:data?.raw}));
              process.exit(1);
            }
            const reply = String(data.reply || '').trim();
            if (!reply) {
              console.error('LIVE_KNT_HARD_FAILURE '+JSON.stringify({turn:i+1,userMessage,status:res.status,error:'empty reply'}));
              process.exit(1);
            }
            const kdm = data.kdm || {};
            const trace = kdm.trace || {};
            const plan = kdm.responsePlan || data.responsePlan || {};
            const speech = data.speechIdentity || kdm.speechIdentity || {};
            dynamicState = kdm.dynamicState || dynamicState;
            const reactionMode = dynamicState?.reactionMode ?? trace?.relationship?.reactionMode ?? null;
            const relationshipLevel = speech.relationshipLevel ?? null;
            const conversationState = dynamicState?.relationship?.conversationState ?? trace?.relationship?.conversationState ?? null;
            const normalized = norm(reply);
            const recentMeaningful = turns.slice(-3).map(t=>t.normalized).filter(x=>words(x).length>=4);
            const flags = [];
            if (assistantDrift.test(reply)) flags.push('generic_assistant_drift');
            if (listDrift.test(reply)) flags.push('list_format_drift');
            if (recentMeaningful.includes(normalized) && words(normalized).length>=4) flags.push('recent_exact_repeat');
            if (plan.maxWords && words(reply).length > Number(plan.maxWords)) flags.push('plan_word_budget_visible_violation');
            if (plan.allowQuestion === false && /[?？]/u.test(reply)) flags.push('question_when_blocked');
            if ((relationshipLevel === 'new' || relationshipLevel === 'familiar') && /\bkanka\b/iu.test(reply)) flags.push('overfamiliar_kanka_surface');
            if (data.consistency?.accepted === false) flags.push('consistency_rejected');
            if (i === 9 && reactionMode === 'neutral') flags.push('targeted_insult_failed_to_change_reaction');
            if (i === 17 && !/(istifa|müdür)/iu.test(reply)) flags.push('mert_recall_not_grounded_surface');
            if (flags.length) softFlags.push({turn:i+1,userMessage,flags,reply});
            const record = {
              turn:i+1,userMessage,reply,providerUsed:data.providerUsed,
              semanticSource:kdm.semanticSource,
              intent:trace?.messageInterpretation?.intent,
              sentiment:trace?.messageInterpretation?.sentiment,
              reactionMode,conversationState,
              relationshipLevel,register:speech.register,
              move:plan.move,allowQuestion:plan.allowQuestion,allowHumor:plan.allowHumor,
              maxWords:plan.maxWords,emojiBudget:plan.emojiBudget,
              consistencyAccepted:data.consistency?.accepted,
              consistencyIssues:data.consistency?.issues,
              timings:data.timings,
              normalized,
              flags,
            };
            turns.push(record);
            console.log('LIVE_KNT_TURN '+JSON.stringify(record));
            history.push({sender:'user',text:userMessage,participantId:userId,participantName:'Ali'});
            history.push({sender:'droit',text:reply,participantId:'reference_kaira',participantName:'Kaira',replyToParticipantId:userId,replyToParticipantName:'Ali'});
          }
          const providers = [...new Set(turns.map(t=>t.providerUsed).filter(Boolean))];
          const reactions = [...new Set(turns.map(t=>t.reactionMode).filter(Boolean))];
          const states = [...new Set(turns.map(t=>t.conversationState).filter(Boolean))];
          const summary = {
            total:turns.length,
            sessionId,userId,
            providers,reactions,conversationStates:states,
            localTurns:turns.filter(t=>t.providerUsed==='local_language').length,
            aiTurns:turns.filter(t=>t.providerUsed==='openrouter'||t.providerUsed==='gemini').length,
            fallbackTurns:turns.filter(t=>t.providerUsed==='deterministic_fallback').length,
            consistencyRejected:turns.filter(t=>t.consistencyAccepted===false).length,
            softFlagCount:softFlags.length,
            softFlags,
          };
          console.log('LIVE_KNT_SUMMARY '+JSON.stringify(summary));
          NODE
