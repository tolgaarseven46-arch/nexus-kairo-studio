name: One-time project state value downstream coverage

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-value-downstream-coverage.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 54. Value downstream coverage audit — 2026-08-31\n- Deep values audit focused on `protectivePressure`, which is calculated by `valueEngine` but is not consumed as a separate pressure by `behaviorIntegrationEngine`. This was treated as an audit candidate rather than automatically labeled a bug.\n- Added `kairaValueDownstreamCoverageContracts.test.ts` covering all eight CharacterTab value dimensions: honesty/deception, fairness/unfairness, loyalty/betrayal, compassion/harm, freedom/coercion, privacy/privacy-violation, respect/disrespect and responsibility/irresponsibility.\n- Every value dimension measurably changes final integrated `pressures.values` when its matching semantic context is present. Therefore the value sliders are behaviorally live at the final integration boundary; no product behavior patch was needed.\n- Compassion also changes both `protectivePressure` and `moralObjection`; because `moralObjection` is part of final aggregate value pressure, the absence of a dedicated `protectivePressure` consumer is not by itself a silent no-op. The same principle applies to aggregate architecture generally: a raw intermediate signal need not be transported separately when its intended slider semantics remain measurable downstream.\n- The first verification run failed before tests because the temporary generator helper interpolated `key` while generating the test source. The helper escaping was corrected and the second run passed targeted contracts, TypeScript, full regression and production build. No product code changed during this audit.\n- Permanent coverage contract commit: `25f2fc4` (`test(kaira): lock value downstream coverage`).\n- Temporary verification workflow and generator helper were removed after the successful run.\n- Next deep-audit candidate: temperament runtime semantics. `attentionPersistence` produces an intermediate `persistence` output that may not feed live chat state, and `recoverySpeed` may be ineffective because the current live-turn call supplies `minutesSinceEvent: 0`. These must be verified at the actual `droitChatService` consumption boundary before any patch.\n'''
          if '## 54. Value downstream coverage audit — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record value downstream coverage audit"
          git pull --rebase origin main
          git push origin main
