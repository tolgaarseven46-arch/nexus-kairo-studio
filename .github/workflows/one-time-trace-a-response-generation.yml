name: one-time trace A response generation
'on':
  push:
    branches:
      - diag/trace-a-response-generation-2026-09-11
permissions:
  contents: read
jobs:
  trace-a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run live seeded-history forbidden-question/advice trace
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, uuid, sys

          base = "https://nexus-kairo-studio.onrender.com"
          uid = f"trace_a_{uuid.uuid4().hex[:10]}"
          session = "session_" + uid

          # Rich same-session context without consuming provider calls for setup.
          # More than 8 turns ensures the production session-working-memory seam
          # has older context to retrieve while the final turn remains isolated.
          history = [
            {"sender":"user","text":"Mert benim eski iş arkadaşım, geçen hafta bana borcunu sonunda ödedi."},
            {"sender":"droit","text":"iyi olmuş sonunda kapatmışsınız o işi"},
            {"sender":"user","text":"Kedimin adı Köpük."},
            {"sender":"droit","text":"Köpük güzel isimmiş"},
            {"sender":"user","text":"Köpük geceleri kapının önünde uyuyor."},
            {"sender":"droit","text":"kapıyı sahiplenmiş baya"},
            {"sender":"user","text":"Yarın sabah önemli bir toplantım var."},
            {"sender":"droit","text":"anladım"},
            {"sender":"user","text":"Toplantı dokuzda başlıyor."},
            {"sender":"droit","text":"tamam"},
            {"sender":"user","text":"O yüzden erken kalkacağım."},
            {"sender":"droit","text":"hee"},
          ]

          final_message = "Yarın erken kalkacağımı unutma; bana soru sorma ve tavsiye de verme, sadece kısa bir tepki ver."
          payload = {
            "userId": uid,
            "userName": "Tolga",
            "userMessage": final_message,
            "history": history,
            "provider": "gemini",
            "kairaInstanceId": "reference",
            "kairaInstanceType": "reference",
            "sessionId": session,
            "requestId": "trace-a-final-" + uuid.uuid4().hex[:10],
          }
          req = urllib.request.Request(
            base + "/api/chat",
            data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
            headers={"Content-Type":"application/json"},
            method="POST",
          )

          try:
            with urllib.request.urlopen(req, timeout=150) as r:
              raw = r.read().decode("utf-8")
              out = json.loads(raw)
          except urllib.error.HTTPError as e:
            body = e.read().decode("utf-8", errors="replace")
            print(f"TRACE_A_HTTP_ERROR status={e.code} body={body[:5000]}")
            with open("trace-a-live.json", "w", encoding="utf-8") as f:
              json.dump({"status":"http_error","httpStatus":e.code,"body":body,"finalUserMessage":final_message,"seededHistory":history}, f, ensure_ascii=False, indent=2)
            sys.exit(1)

          kdm = out.get("kdm") or {}
          plan = kdm.get("responsePlan") or out.get("responsePlan") or {}
          reply = str(out.get("reply") or out.get("response") or "").strip()
          provider = out.get("providerUsed") or kdm.get("providerUsed") or out.get("activeAiProviderUsed")

          print("TRACE_A_FINAL_USER=" + final_message)
          print("TRACE_A_FINAL_REPLY=" + reply.replace("\n", " "))
          print("TRACE_A_ALLOW_QUESTION=" + repr(plan.get("allowQuestion")))
          print("TRACE_A_ALLOW_ADVICE=" + repr(plan.get("allowAdvice")))
          print("TRACE_A_PROVIDER_USED=" + repr(provider))
          print("TRACE_A_RESPONSE_PLAN=" + json.dumps(plan, ensure_ascii=False, sort_keys=True))

          artifact = {
            "status":"success",
            "userId":uid,
            "seededHistory":history,
            "finalUserMessage":final_message,
            "finalReply":reply,
            "allowQuestion":plan.get("allowQuestion"),
            "allowAdvice":plan.get("allowAdvice"),
            "providerUsed":provider,
            "responsePlan":plan,
          }
          with open("trace-a-live.json", "w", encoding="utf-8") as f:
            json.dump(artifact, f, ensure_ascii=False, indent=2)

          if plan.get("allowQuestion") is not False or plan.get("allowAdvice") is not False:
            print("TRACE_A_INVALID_PLAN")
            sys.exit(2)
          if not reply:
            print("TRACE_A_EMPTY_REPLY")
            sys.exit(3)
          print("TRACE_A_LIVE_CAPTURE_PASS")
          PY
      - name: Upload Trace A artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-a-live-response
          path: trace-a-live.json
          if-no-files-found: error
