name: one-time trace F discourse realization
'on':
  push:
    branches:
      - diag/trace-a-response-generation-2026-09-11
permissions:
  contents: read
jobs:
  trace-f:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run live third-party thread counterfactual trace
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, uuid, sys

          base = "https://nexus-kairo-studio.onrender.com"

          def post_json(path, payload, timeout=150):
            req = urllib.request.Request(base + path, data=json.dumps(payload, ensure_ascii=False).encode("utf-8"), headers={"Content-Type":"application/json"}, method="POST")
            try:
              with urllib.request.urlopen(req, timeout=timeout) as r:
                return {"ok": True, "status": r.status, "data": json.loads(r.read().decode("utf-8"))}
            except urllib.error.HTTPError as e:
              return {"ok": False, "status": e.code, "body": e.read().decode("utf-8", errors="replace")}

          opener = "Mert işten ayrılmayı düşünüyor, müdürüyle çok kavga etmiş."
          lu = post_json("/api/language-understanding", {
            "userMessage": opener,
            "userName": "Tolga",
            "characterName": "KAIRO",
            "history": [],
            "provider": "openrouter",
          })
          print("TRACE_F_LU=" + json.dumps(lu, ensure_ascii=False, sort_keys=True)[:7000])
          if not lu.get("ok"):
            with open("trace-f-live.json", "w", encoding="utf-8") as f:
              json.dump({"status":"language_understanding_error","lu":lu}, f, ensure_ascii=False, indent=2)
            sys.exit(1)

          lu_data = lu["data"]
          interp = lu_data.get("interpretation") or lu_data.get("semanticInterpretation")
          if not interp:
            print("TRACE_F_NO_INTERPRETATION")
            sys.exit(2)

          final_message = "peki sence ne yapmalı?"
          histories = {
            "with_thread": [
              {"sender":"user","participantName":"Tolga","text":opener,"semanticInterpretation":interp},
              {"sender":"droit","participantName":"KAIRO","text":"anladım, baya gerilmiş işler"},
            ],
            "without_thread": [],
          }
          results = {"opener": opener, "openerInterpretation": interp, "finalMessage": final_message, "cases": {}}

          for label, history in histories.items():
            uid = f"trace_f_{label}_{uuid.uuid4().hex[:8]}"
            payload = {
              "userId": uid,
              "userName": "Tolga",
              "userMessage": final_message,
              "history": history,
              "provider": "openrouter",
              "kairaInstanceId": "reference",
              "kairaInstanceType": "reference",
              "sessionId": "session_" + uid,
              "requestId": "trace-f-" + label + "-" + uuid.uuid4().hex[:8],
            }
            out = post_json("/api/chat", payload)
            case = {"history": history, "http": out}
            if out.get("ok"):
              data = out["data"]
              kdm = data.get("kdm") or {}
              case.update({
                "reply": str(data.get("reply") or data.get("response") or "").strip(),
                "providerUsed": data.get("providerUsed") or kdm.get("providerUsed") or data.get("activeAiProviderUsed"),
                "responsePlan": kdm.get("responsePlan") or data.get("responsePlan") or {},
                "discourseState": kdm.get("discourseState") or data.get("discourseState"),
                "dialogueDecision": kdm.get("dialogueDecision") or data.get("dialogueDecision"),
              })
            results["cases"][label] = case
            print("TRACE_F_" + label.upper() + "=" + json.dumps(case, ensure_ascii=False, sort_keys=True)[:9000])

          with open("trace-f-live.json", "w", encoding="utf-8") as f:
            json.dump(results, f, ensure_ascii=False, indent=2)
          print("TRACE_F_CAPTURE_COMPLETE")
          PY
      - name: Upload Trace F artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-f-live-response
          path: trace-f-live.json
          if-no-files-found: error
