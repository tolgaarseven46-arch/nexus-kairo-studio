name: one-time trace CD response generation
'on':
  push:
    branches:
      - diag/trace-a-response-generation-2026-09-11
permissions:
  contents: read
jobs:
  trace-cd:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Run live same-stimulus different-state trace
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, uuid, time

          base = "https://nexus-kairo-studio.onrender.com"

          def get_json(path):
            with urllib.request.urlopen(base + path, timeout=60) as r:
              return json.loads(r.read().decode("utf-8"))

          runtime = get_json("/api/runtime-info")
          print("RUNTIME_INFO=" + json.dumps(runtime, ensure_ascii=False, sort_keys=True))

          message = "bugün biraz yoğunum"
          cases = {
            "neutral_close": {
              "calmness": 75, "anger": 5, "stress": 20, "happiness": 70, "confidence": 75, "surprise": 5,
              "reactionMode": "neutral",
              "relationship": {"warmth": 78, "trust": 80, "hurtScore": 0, "conflictScore": 0, "repairProgress": 0, "conversationState": "active", "interactionCount": 50, "familiarityDays": 45}
            },
            "irritated_familiar": {
              "calmness": 45, "anger": 42, "stress": 45, "happiness": 45, "confidence": 70, "surprise": 10,
              "reactionMode": "irritated",
              "relationship": {"warmth": 56, "trust": 58, "hurtScore": 8, "conflictScore": 15, "repairProgress": 0, "conversationState": "active", "interactionCount": 25, "familiarityDays": 20}
            },
            "hurt_distancing": {
              "calmness": 38, "anger": 24, "stress": 58, "happiness": 30, "confidence": 62, "surprise": 8,
              "reactionMode": "hurt",
              "relationship": {"warmth": 38, "trust": 42, "hurtScore": 48, "conflictScore": 31, "repairProgress": 0, "conversationState": "distancing", "interactionCount": 50, "familiarityDays": 45}
            },
            "repairing": {
              "calmness": 52, "anger": 18, "stress": 42, "happiness": 42, "confidence": 66, "surprise": 6,
              "reactionMode": "repairing",
              "relationship": {"warmth": 47, "trust": 50, "hurtScore": 30, "conflictScore": 20, "repairProgress": 35, "repairAttempts": 2, "conversationState": "repairing", "interactionCount": 50, "familiarityDays": 45}
            },
          }

          results = {"runtimeInfo": runtime, "message": message, "cases": {}}

          for name, state in cases.items():
            uid = f"trace_cd_{name}_{uuid.uuid4().hex[:8]}"
            attempts = []
            accepted = None
            for attempt in range(1, 4):
              payload = {
                "userId": uid,
                "userName": "Tolga",
                "userMessage": message,
                "history": [],
                "dynamicState": state,
                "provider": "openrouter",
                "kairaInstanceId": "reference",
                "kairaInstanceType": "reference",
                "sessionId": "session_" + uid,
                "requestId": f"trace-cd-{name}-{attempt}-" + uuid.uuid4().hex[:8],
              }
              req = urllib.request.Request(base + "/api/chat", data=json.dumps(payload, ensure_ascii=False).encode("utf-8"), headers={"Content-Type":"application/json"}, method="POST")
              try:
                with urllib.request.urlopen(req, timeout=150) as r:
                  out = json.loads(r.read().decode("utf-8"))
                kdm = out.get("kdm") or {}
                plan = kdm.get("responsePlan") or out.get("responsePlan") or {}
                reply = str(out.get("reply") or out.get("response") or "").strip()
                entry = {
                  "status":"success", "reply":reply,
                  "providerUsed":out.get("providerUsed") or kdm.get("providerUsed") or out.get("activeAiProviderUsed"),
                  "responsePlan":plan,
                  "reactionMode": (kdm.get("nextDynamicState") or {}).get("reactionMode") or (kdm.get("trace") or {}).get("currentMood",{}).get("reactionMode"),
                  "relationship": (kdm.get("nextDynamicState") or {}).get("relationship") or (kdm.get("trace") or {}).get("relationship"),
                }
                attempts.append(entry)
                accepted = entry
                break
              except urllib.error.HTTPError as e:
                body = e.read().decode("utf-8", errors="replace")
                attempts.append({"status":"http_error","httpStatus":e.code,"body":body})
                time.sleep(2)
            results["cases"][name] = {"seedState":state,"attempts":attempts,"accepted":accepted}
            if accepted:
              print(f"TRACE_CD_{name.upper()}_REPLY={accepted['reply'].replace(chr(10),' ')}")
              print(f"TRACE_CD_{name.upper()}_PROVIDER={accepted['providerUsed']!r}")
              print(f"TRACE_CD_{name.upper()}_PLAN=" + json.dumps(accepted["responsePlan"], ensure_ascii=False, sort_keys=True))
            else:
              print(f"TRACE_CD_{name.upper()}_NO_ACCEPTED_REPLY=" + json.dumps(attempts, ensure_ascii=False))

          with open("trace-cd-live.json", "w", encoding="utf-8") as f:
            json.dump(results, f, ensure_ascii=False, indent=2)
          print("TRACE_CD_CAPTURE_COMPLETE")
          PY
      - name: Upload Trace CD artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-cd-live-response
          path: trace-cd-live.json
          if-no-files-found: error
