name: one-time generated-reply semantic probe
'on':
  push:
    branches:
      - diag/trace-a-response-generation-2026-09-11
permissions:
  contents: read
jobs:
  semantic-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Classify leaked reply through canonical language understanding
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          base = "https://nexus-kairo-studio.onrender.com"
          samples = [
            "yoğunken yazman bile fazla aslında, kendine dön biraz bugün",
            "hı anladım kolay gelsin sana",
            "yoğunken yazman da ayrı değerli, tamamdır",
          ]
          rows = []
          for text in samples:
            payload = {"userMessage": text, "userName":"KAIRO", "characterName":"Tolga", "history":[], "provider":"openrouter"}
            req = urllib.request.Request(base + "/api/language-understanding", data=json.dumps(payload, ensure_ascii=False).encode("utf-8"), headers={"Content-Type":"application/json"}, method="POST")
            with urllib.request.urlopen(req, timeout=150) as r:
              out = json.loads(r.read().decode("utf-8"))
            interp = out.get("interpretation") or out.get("semanticInterpretation") or {}
            event = out.get("event") or {}
            row = {"text":text, "interpretation":interp, "event":event, "semanticSource":out.get("semanticSource")}
            rows.append(row)
            print("SEMANTIC_PROBE=" + json.dumps(row, ensure_ascii=False, sort_keys=True))
          with open("generated-reply-semantic-probe.json", "w", encoding="utf-8") as f:
            json.dump(rows, f, ensure_ascii=False, indent=2)
          PY
      - name: Upload semantic probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-reply-semantic-probe
          path: generated-reply-semantic-probe.json
          if-no-files-found: error
