name: One-time grounded recall fulfillment repair

on:
  push:
    branches:
      - audit/dialogue-fulfillment-obligation-coverage

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: audit/dialogue-fulfillment-obligation-coverage
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply typed fulfillment repair
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/services/kairoDialogueDecisionEngine.ts')
          s = p.read_text(encoding='utf-8')

          old_type = '''export interface DialogueObligation {\n  type: "answer_or_clarify";\n  satisfactionCriteria: {\n'''
          new_type = '''export type DialogueObligationType =\n  | "answer_or_clarify"\n  | "grounded_recall";\n\nexport interface DialogueObligation {\n  type: DialogueObligationType;\n  satisfactionCriteria: {\n'''
          if old_type not in s:
              raise SystemExit('expected DialogueObligation type block not found')
          s = s.replace(old_type, new_type, 1)

          old_attach = '''function attachDecisionOwnedObligation(plan: DialogueDecisionPlan): DialogueDecisionPlan {\n  if (plan.move !== "answer_or_clarify") return plan;\n  return {\n    ...plan,\n    obligation: {\n      type: "answer_or_clarify",\n      satisfactionCriteria: {\n        forbiddenResponseClasses: ["acknowledgement_only"],\n        allowedResolutions: [\n          "fulfill_now",\n          "clarify",\n          "decline_explicit",\n          "defer_explicit",\n        ],\n      },\n    },\n  };\n}\n'''
          new_attach = '''function attachDecisionOwnedObligation(plan: DialogueDecisionPlan): DialogueDecisionPlan {\n  if (plan.move !== "answer_or_clarify" && plan.move !== "grounded_recall") return plan;\n  return {\n    ...plan,\n    obligation: {\n      type: plan.move,\n      satisfactionCriteria: {\n        forbiddenResponseClasses: ["acknowledgement_only"],\n        allowedResolutions: [\n          "fulfill_now",\n          "clarify",\n          "decline_explicit",\n          "defer_explicit",\n        ],\n      },\n    },\n  };\n}\n'''
          if old_attach not in s:
              raise SystemExit('expected attachDecisionOwnedObligation block not found')
          s = s.replace(old_attach, new_attach, 1)

          old_issue = '''  if (\n    plan.obligation?.satisfactionCriteria.forbiddenResponseClasses.includes("acknowledgement_only") &&\n    KAIRA_SHORT_ACK_RE.test(reply.trim())\n  ) {\n    issues.push(\n      "DialogueDecision obligation karşılanmadı: answer_or_clarify yalnız acknowledgement ile kapatılamaz",\n    );\n  }\n'''
          new_issue = '''  const obligationType = plan.obligation?.type;\n  if (\n    obligationType &&\n    plan.obligation.satisfactionCriteria.forbiddenResponseClasses.includes("acknowledgement_only") &&\n    KAIRA_SHORT_ACK_RE.test(reply.trim())\n  ) {\n    issues.push(\n      `DialogueDecision obligation karşılanmadı: ${obligationType} yalnız acknowledgement ile kapatılamaz`,\n    );\n  }\n'''
          if old_issue not in s:
              raise SystemExit('expected obligation issue block not found')
          s = s.replace(old_issue, new_issue, 1)
          p.write_text(s, encoding='utf-8')

          Path('src/services/kairaGroundedRecallFulfillmentRegression.test.ts').write_text('''import { describe, expect, it } from "vitest";\nimport {\n  findDialogueDecisionIssues,\n  planDialogueResponse,\n} from "./kairoDialogueDecisionEngine";\n\nconst recallDecision = () =>\n  planDialogueResponse(\n    [],\n    "Mert yarın ne yapacaktı?",\n    "Tolga",\n    {\n      intent: "information_request",\n      discourseAct: "recall_request",\n      socialRoutine: "none",\n      repairSignal: "none",\n      adviceRequested: false,\n      target: "third_party",\n    } as any,\n  );\n\ndescribe("grounded recall fulfillment regression", () => {\n  it("gives grounded recall a decision-owned fulfillment contract", () => {\n    const decision = recallDecision();\n    expect(decision.move).toBe("grounded_recall");\n    expect(decision.obligation?.type).toBe("grounded_recall");\n    expect(decision.obligation?.satisfactionCriteria.forbiddenResponseClasses).toContain(\n      "acknowledgement_only",\n    );\n  });\n\n  it("rejects acknowledgement-only recall delivery", () => {\n    const decision = recallDecision();\n    for (const reply of ["tamam", "peki", "aynen", "anladım"]) {\n      expect(findDialogueDecisionIssues(reply, decision)).toContain(\n        "DialogueDecision obligation karşılanmadı: grounded_recall yalnız acknowledgement ile kapatılamaz",\n      );\n    }\n    expect(findDialogueDecisionIssues("Mert için doğrulanmış bir plan yok.", decision)).not.toContain(\n      "DialogueDecision obligation karşılanmadı: grounded_recall yalnız acknowledgement ile kapatılamaz",\n    );\n  });\n\n  it("does not give pure social routines a fulfillment obligation", () => {\n    const decision = planDialogueResponse(\n      [],\n      "tamam",\n      "Tolga",\n      {\n        intent: "general_chat",\n        discourseAct: "none",\n        socialRoutine: "agreement",\n        repairSignal: "none",\n        adviceRequested: false,\n      } as any,\n    );\n    expect(decision.move).toBe("complete_social_routine");\n    expect(decision.obligation).toBeUndefined();\n    expect(findDialogueDecisionIssues("aynen", decision)).toEqual([]);\n  });\n});\n''', encoding='utf-8')

          Path('docs/adr/0059-dialogue-fulfillment-obligation-coverage.md').write_text('''# ADR-0059 — Dialogue fulfillment obligation coverage\n\n## Status\nAccepted\n\n## Context\n`DialogueDecision` owns the semantic WHAT of a turn and downstream validators are not allowed to invent independent fulfillment rules. `answer_or_clarify` already carried an explicit decision-owned obligation that prevents acknowledgement-only delivery, but `grounded_recall` did not. This left a substantive recall request able to pass final validation as `tamam`, `peki`, `aynen` or `anladım` even though grounded recall already has deterministic content/fallback semantics.\n\nAn API-free characterization on current `main` reproduced the gap: the recall obligation was undefined and acknowledgement-only delivery produced no issue, while the pure-social control remained valid. The rest of the suite stayed green.\n\n## Decision\n- Generalize `DialogueObligation.type` to cover `answer_or_clarify` and `grounded_recall`.\n- Both substantive moves forbid `acknowledgement_only` closure through the same decision-owned fulfillment contract.\n- `findDialogueDecisionIssues` consumes the obligation type generically instead of hard-coding `answer_or_clarify`.\n- Pure social routines remain obligation-free.\n- Existing grounded-recall claim ledger and deterministic fallback remain the sole content authority for recall; this change adds no second WHAT authority.\n- No raw-text reparse, phrase-specific classifier, provider call, or live smoke is introduced.\n\n## Consequences\nA grounded recall can no longer silently collapse to a generic acknowledgement at final delivery. Existing answer obligations retain their exact behavior and social-only turns remain unchanged.\n\n## Verification\nAPI-free deterministic coverage includes the original red characterization, a dedicated regression, existing final-delivery obligation regression, full test suite, TypeScript and production build.\n''', encoding='utf-8')

          state = Path('PROJECT_STATE.md')
          st = state.read_text(encoding='utf-8')
          note = '''\n\n## 2026-09-06 — Bounded downstream repair: grounded recall fulfillment\n- PR #111 sonrası downstream `DialogueDecision → final delivery` taramasında ilk yeni sistemik boşluk API-siz doğrulandı: `grounded_recall` deterministic WHAT/fallback sahibi olmasına rağmen decision-owned fulfillment obligation taşımıyordu.\n- Red characterization: grounded recall obligation `undefined`; acknowledgement-only (`tamam/peki/aynen/anladım`) final validator tarafından reddedilmiyordu; pure-social kontrol doğru biçimde geçiyordu.\n- ADR-0059 ilkesi: substantive recall ve answer hareketleri fulfillment contract'ını DialogueDecision'dan alır; downstream validator yalnız bu typed contract'ı tüketir.\n- Raw-text reparse, yeni semantic authority veya provider/API çağrısı eklenmez. Gerçek provider kabulü yalnız kullanıcı gerçek sohbet testinde yapılacaktır.\n'''
          if '## 2026-09-06 — Bounded downstream repair: grounded recall fulfillment' not in st:
              state.write_text(st.rstrip() + note + '\n', encoding='utf-8')

      - name: Run focused deterministic tests
        run: npx vitest run src/services/kairaGroundedRecallFulfillmentCharacterization.test.ts src/services/kairaGroundedRecallFulfillmentRegression.test.ts src/services/kairaFinalDeliveryObligationRegression.test.ts src/services/kairoDialogueDecisionEngine.test.ts
      - name: Run full tests
        run: npm test -- --run
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-grounded-recall-fulfillment-repair.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/kairoDialogueDecisionEngine.ts src/services/kairaGroundedRecallFulfillmentCharacterization.test.ts src/services/kairaGroundedRecallFulfillmentRegression.test.ts docs/adr/0059-dialogue-fulfillment-obligation-coverage.md PROJECT_STATE.md .github/workflows/one-time-grounded-recall-fulfillment-repair.yml
          git commit -m "fix(kaira): preserve grounded recall fulfillment obligation"
          git push origin HEAD:audit/dialogue-fulfillment-obligation-coverage
