name: Kaira Live Conversation Probe

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run-kaira-phase1-live-probe.ts"
      - ".github/workflows/kaira-live-conversation-probe.yml"
  workflow_dispatch:

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAIRA_LIVE_PROVIDER: openrouter
      KAIRA_LIVE_BASE_URL: https://nexus-kairo-studio.onrender.com

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify deployed main runtime
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl --fail --silent --show-error https://nexus-kairo-studio.onrender.com/api/runtime-info; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run Phase 1 live conversation canary
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/run-kaira-phase1-live-probe.ts artifacts/kaira-phase1-live-probe.json
