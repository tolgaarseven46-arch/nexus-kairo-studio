name: One-time project state preference overstimulation

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-preference-overstimulation.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 52. Preference overstimulation downstream wiring — 2026-08-31\n- Deep preference audit verified novelty, complexity, depth, playfulness and competition already reach final integrated behavior through `engagementDrive` and/or `depthDrive`; they are not key-level no-ops.\n- The audit found one genuine dropped preference signal: `overstimulationPressure`. The preference engine correctly detected when incoming intensity exceeded Kaira's stable intensity preference, but behavior integration never consumed the signal and the later personality bridge could not preserve its intended avoidance semantics.\n- `behaviorIntegrationEngine` now reduces preference engagement in proportion to overstimulation pressure and selects a short response when overstimulation is high. This models lower eagerness / shorter participation under excessive intensity without turning a preference mismatch into a boundary violation, social distance, or disengagement.\n- Calm/low-intensity contexts do not create overstimulation behavior, so a low intensity preference is not a general short-answer command.\n- Added `kairaPreferenceOverstimulationWiringContracts.test.ts` to verify CharacterTab intensity mapping, contextual overstimulation differentiation, reduced final engagement, short-response behavior under actual excessive intensity, unchanged distance, continued conversation, and no overstimulation behavior in calm context.\n- Targeted contracts, TypeScript, full regression and production build all passed.\n- Integration commit: `dd265e3` (`fix(kaira): wire preference overstimulation downstream`).\n- Temporary migration workflow and helper script were removed after integration.\n- Motivation and social follow-up audit found no additional obvious dropped final signals after recognition, compliance and disclosure wiring. Next audit focus should move to the next CharacterTab fine-tune family and continue using final integrated behavior as the acceptance boundary.\n'''
          if '## 52. Preference overstimulation downstream wiring — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record preference overstimulation wiring"
          git pull --rebase origin main
          git push origin main
