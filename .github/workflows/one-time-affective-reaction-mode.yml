name: One-time affective reaction mode migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-affective-reaction-mode.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reaction mode and clean helpers
        run: |
          node scripts/one-time-affective-reaction-mode.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-affective-reaction-mode.mjs
          git rm .github/workflows/one-time-affective-reaction-mode.yml
          git add src/types/nexus.ts src/services/kdmConsistencyEngine.ts src/services/relationshipBehaviorService.ts
          git commit -m "feat(kaira): add canonical affective reaction mode"
          git push
