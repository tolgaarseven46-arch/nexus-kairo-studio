name: One-time Autonomous Final Checkpoint

on:
  push:
    branches:
      - docs/autonomous-life-final-checkpoint

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/autonomous-life-final-checkpoint
          fetch-depth: 0
