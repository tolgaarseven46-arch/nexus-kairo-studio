name: One-time semantic stop state integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record state and clean helper
        shell: bash
        run: |
          node scripts/record-semantic-stop-state.mjs
          rm scripts/record-semantic-stop-state.mjs
          rm .github/workflows/one-time-record-semantic-stop-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md scripts/record-semantic-stop-state.mjs .github/workflows/one-time-record-semantic-stop-state.yml
          git commit -m "docs(kaira): record semantic stop audit"
          git push
