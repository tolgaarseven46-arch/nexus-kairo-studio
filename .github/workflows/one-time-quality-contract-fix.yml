name: One-time Quality Contract Fix

on:
  push:
    branches:
      - fix/conversation-quality-social-moves

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[quality-contract-aligned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/conversation-quality-social-moves
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Apply authority-contract alignment
        run: python .github/scripts/one_time_quality_contract_fix.py
      - name: Verify focused and authority contracts
        run: |
          npm test -- --run src/services/kairaSemanticConsumerAuthorityContracts.test.ts src/services/conversationQualityMechanismRegression.test.ts
          npx tsc --noEmit
      - name: Commit and clean harness
        run: |
          git rm .github/workflows/one-time-quality-contract-fix.yml
          git rm .github/scripts/one_time_quality_contract_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(chat): align target reconciliation with semantic authority [quality-contract-aligned]'
          git push origin HEAD:fix/conversation-quality-social-moves
