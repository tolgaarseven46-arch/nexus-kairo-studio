name: One-time Patch Claim Provenance
on:
  push:
    branches:
      - feat/claim-world-event-provenance
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/claim-world-event-provenance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply provenance patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_claim.py
          python /tmp/patch_claim.py
      - run: npx vitest run src/services/claimProvenance.test.ts src/services/kairaClaimProvenanceRegression.test.ts src/services/worldModelReportedClaimPersistence.test.ts src/services/kairoDialogueChaosEngine.test.ts src/services/kairoDialogueDecisionEngine.test.ts
      - run: npx tsc --noEmit
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/kairoDialogueChaosEngine.ts src/services/kairoDialogueDecisionEngine.ts src/services/worldModelEventStore.ts src/services/kairoDialogueChaosEngine.test.ts
          git commit -m "feat(claim): separate immutable provenance from world truth"
          git push origin HEAD:feat/claim-world-event-provenance
