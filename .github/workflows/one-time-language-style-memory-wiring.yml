name: One-time learned language HOW wiring
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-language-style-memory-wiring.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire learned language HOW signal and clean helpers
        run: |
          node scripts/one-time-language-style-memory-wiring.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-language-style-memory-wiring.mjs
          git rm .github/workflows/one-time-language-style-memory-wiring.yml
          git add server.ts src/services/kdmPersistenceService.ts
          git commit -m "feat(kaira): wire learned language HOW into AI and KNT"
          git push
