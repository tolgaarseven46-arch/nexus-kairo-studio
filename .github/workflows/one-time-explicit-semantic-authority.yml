name: One-time explicit semantic authority
# rerun-with-stop-talking-fix

on:
  push:
    paths:
      - ".github/workflows/one-time-explicit-semantic-authority.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Add explicit semantic authority contracts
        run: node scripts/addExplicitSemanticAuthorityContracts.mjs
      - name: Apply explicit stop-talking fix
        run: node scripts/applyExplicitStopTalkingFix.mjs
      - name: Targeted contracts
        run: npx vitest run src/services/kairaExplicitSemanticAuthorityContracts.test.ts src/services/semanticEventEngine.test.ts src/services/behaviorIntegrationEngine.test.ts src/services/kairaCrossFamilyAuthorityContracts.test.ts
      - name: TypeScript
        run: npm run lint
      - name: Full regression
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit product and contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/behaviorIntegrationEngine.ts src/services/kairaExplicitSemanticAuthorityContracts.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(kaira): honor explicit stop-talking command"
          git pull --rebase origin main
          git push origin main
