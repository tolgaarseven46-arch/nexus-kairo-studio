          '''  discourseFacets: SemanticDiscourseFacets;\n  uncertainty: InterpretationUncertainty;''',
          '''  discourseFacets: SemanticDiscourseFacets;\n  /** Structured world-memory semantics; optional for legacy/fallback producers. */\n  worldMemory?: SemanticWorldMemorySemantics;\n  uncertainty: InterpretationUncertainty;''')

