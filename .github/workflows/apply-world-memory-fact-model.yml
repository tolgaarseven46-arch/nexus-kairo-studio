      - uses: actions/checkout@v4
        with:
          ref: fix/world-memory-evidence-eligibility
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply canonical fact/query wiring
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

