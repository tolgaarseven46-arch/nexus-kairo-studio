name: One-time spontaneity observability wiring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-spontaneity-observability.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire controlled spontaneity observability and clean helpers
        run: |
          node scripts/one-time-spontaneity-observability.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-spontaneity-observability.mjs
          git rm .github/workflows/one-time-spontaneity-observability.yml
          git add server.ts src/services/droitChatService.ts
          git commit -m "feat(kaira): expose controlled spontaneity observability"
          git push
