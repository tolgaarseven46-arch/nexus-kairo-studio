name: One-time project state conversation authority

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-conversation-authority.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 30. Conversation state authority non-mutation — 2026-08-31\n- `conversationStateAuthority` artık distancing/repairing/disengaged durumlarında `responsePersonality` üzerinde trait mutasyonu yapmaz. Gelen personality nesnesini aynı referansla döndürür; yalnız `state`, `locked` ve `reason` metadata'sı üretir.\n- Non-active state WHAT/WHETHER kapanışları tek canonical yerde kalır: `BehaviorContract` + `KairaResponsePlan`. Disengaged durumda konuşmayı sürdürme/soru/mizah/yakınlık izinleri personality clamp ile değil plan/contract ile kapatılır.\n- SpeechIdentity HOW-only katmanı dynamic state'i doğrudan görür ve hiçbir izni açamaz; response personality'yi state authority içinde ayrıca kısmanın semantik gerekçesi kalmadı.\n- Canlı local-language yolu canonical `responsePlan` alır; mizah/soru/continue izinlerini oradan uygular.\n- State→behavior seam artık state lock metadata ile canonical BehaviorContract tutarlılığını doğrular; `humor=0` gibi gizli personality mutation invariantı yoktur.\n- `kairaConversationAuthorityNonMutationContracts.test.ts` kalıcı `test:contracts` suite'ine eklendi. Legacy runtime-removal contract da replacement trait mutation'ını yasaklayacak şekilde güncellendi.\n- Entegrasyon commit'i: `fa3f9b0` (`refactor(kaira): make conversation authority non-mutating`). Non-mutation contract, TypeScript, 501/501 test ve production build başarıyla geçti. Geçici migration workflow/script kaldırıldı.\n- Sonraki audit adayı: bu servis artık yalnız state-lock projection ürettiği için `conversationStateAuthority` adı/katmanı sadeleştirilebilir; ancak observability ve response metadata tüketicileri repo çapında doğrulanmadan kaldırılmayacak.\n'''
          if '## 30. Conversation state authority non-mutation — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record non-mutating conversation authority"
          git pull --rebase origin main
          git push origin main
