name: One-time beta continuity fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply bounded beta fixes
        run: node scripts/oneTimeBetaContinuityFix.mjs
      - name: Commit fix and self-clean
        run: |
          rm -f scripts/oneTimeBetaContinuityFix.mjs .github/workflows/one-time-beta-continuity-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(kaira): tighten beta emotional and short-ack continuity"
          git push
