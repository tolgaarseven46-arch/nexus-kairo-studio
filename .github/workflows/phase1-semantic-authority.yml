name: Phase1 Semantic Authority Wiring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase1-semantic-authority.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire canonical SemanticEvent through server and KDM
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('server.ts')
          s = server.read_text()
          anchor = 'import { analyzeKdmInteraction } from "./src/services/kdmConsistencyEngine";\n'
          add = anchor + 'import { resolveCanonicalSemanticEvent } from "./src/services/semanticEventAuthority";\n'
          if 'resolveCanonicalSemanticEvent' not in s:
              s = s.replace(anchor, add, 1)

          old = '      suppressRecentMemory = false,\n      sessionId: incomingSessionId,\n'
          new = '      suppressRecentMemory = false,\n      semanticEvent: incomingSemanticEvent,\n      sessionId: incomingSessionId,\n'
          if old in s and 'semanticEvent: incomingSemanticEvent' not in s:
              s = s.replace(old, new, 1)

          old = '      safePersonality = personality as DroitPersonalityTraits,\n      kdmStart = now(),\n      kdm = analyzeKdmInteraction(\n        normalizeKdmSemanticAliases(userMessage),\n        safePersonality,\n        effective,\n      ),\n'
          new = '      safePersonality = personality as DroitPersonalityTraits,\n      canonicalSemantic = resolveCanonicalSemanticEvent(userMessage, incomingSemanticEvent),\n      kdmStart = now(),\n      kdm = analyzeKdmInteraction(\n        userMessage,\n        safePersonality,\n        effective,\n        canonicalSemantic.event,\n      ),\n'
          if old not in s:
              raise SystemExit('server KDM call anchor not found')
          s = s.replace(old, new, 1)

          old = '        kdm: { trace: kdm.trace, dynamicState: kdm.nextDynamicState },\n'
          new = '        kdm: { trace: kdm.trace, dynamicState: kdm.nextDynamicState, semanticEvent: canonicalSemantic.event, semanticSource: canonicalSemantic.source },\n'
          if old not in s:
              raise SystemExit('local response anchor not found')
          s = s.replace(old, new, 1)

          old = '      kdm: { trace: kdm.trace, dynamicState: kdm.nextDynamicState },\n'
          new = '      kdm: { trace: kdm.trace, dynamicState: kdm.nextDynamicState, semanticEvent: canonicalSemantic.event, semanticSource: canonicalSemantic.source },\n'
          if old not in s:
              raise SystemExit('ai response anchor not found')
          s = s.replace(old, new, 1)

          server.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git diff --cached --quiet && exit 0
          git commit -m "refactor(kdm): wire canonical semantic event through server"
          git push
