name: One-time project state response style alias

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-response-style-alias.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 35. Response style personality passthrough alias removal — 2026-08-31\n- Canlı `server.ts` içindeki `responseStylePersonality = responsePersonality` passthrough alias'ı kaldırıldı; bu değişken hiçbir transform veya policy uygulamıyor, yalnız aynı referansı yeniden adlandırıyordu.\n- HOW katmanı tüketicileri (`computeKairoSpeechIdentity`, `tryLocalKairoReply`) artık doğrudan `responsePersonality` kullanır.\n- KDM relationship/emotion reducer girdisi değişmedi: `analyzeKdmInteraction(...)` yalnız `basePersonality` kullanır; per-turn response overlay KDM'e girmez.\n- Base personality ownership, world-state appraisal ve conversation-state-lock architecture contract markerları gerçek runtime sınırlarına göre güncellendi.\n- Entegrasyon commit'i: `d1786f1` (`refactor(kaira): remove response style personality alias`). Ownership contract, TypeScript, full regression ve production build başarıyla geçti.\n- Geçici alias-removal workflow/script kaldırıldı.\n- Sonraki audit adayı: `responsePersonality = (incomingResponsePersonality || personality)` fallback'ı bilinçli backward compatibility mi, yoksa sessiz/implicit API davranışı mı? Client/server contract ve call-site'lar koddan doğrulanmadan değiştirilmeyecek.\n'''
          if '## 35. Response style personality passthrough alias removal — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record response style personality alias removal"
          git pull --rebase origin main
          git push origin main
