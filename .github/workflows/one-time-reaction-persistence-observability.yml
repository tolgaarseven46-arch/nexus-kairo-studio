name: One-time reaction persistence observability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-reaction-persistence-observability.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reaction persistence and observability
        run: |
          node scripts/one-time-reaction-persistence-observability.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-reaction-persistence-observability.mjs
          git rm .github/workflows/one-time-reaction-persistence-observability.yml
          git add src/services/kdmConsistencyEngine.ts src/components/studio/tabs/TestLabTab.tsx
          git commit -m "fix(kaira): persist and expose qualitative reaction state"
          git push
