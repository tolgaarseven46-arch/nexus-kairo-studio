name: One-time project state fine-tune normalization

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-finetune-normalization.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 45. Fine-tune profile hydration normalization — 2026-08-31\n- `CharacterTab` fine-tune ayarlarını `kairo_character_finetune_v2` localStorage kaydına yazıyor ve `droitChatService` aynı kaydı runtime personality/motivation/value/preference/social/boundary/expression zincirinde tüketiyor. Önceden hydrate edilen obje parse edildikten sonra sayı/range doğrulaması yapılmıyordu.\n- Lightweight `fineTuneProfileNormalizer.ts` eklendi. Yalnız finite number değerleri kabul eder, tüm değerleri 0..100 aralığına clamp eder; string/null/non-finite alanları profile sokmaz.\n- Aynı canonical normalizer hem `CharacterTab` hydrate yolunda hem `droitChatService.readFineTuneProfile()` runtime boundary'sinde kullanılır. Böylece eski/bozuk localStorage değeri hem UI slider state'ini hem client behavior matematiğini zehirleyemez.\n- Fine-tune registry ve `personalityTendencyEngine` tarafından kullanılan `personality.cognition.deciveness` yazımı incelendi. UI ve engine aynı persisted key'i kullandığı için mevcut davranışta bağlantı kopuğu yoktur. Key localStorage contract'ının parçası olduğundan compatibility migration olmadan rename edilmedi ve normalizer testi legacy key'in aynen korunduğunu doğrular.\n- `fineTuneProfileNormalizer.test.ts` range clamp, invalid/non-finite drop ve persisted `deciveness` compatibility davranışını kalıcı olarak test eder. Personality tendency ve temperament targeted testleriyle birlikte geçti.\n- Entegrasyon commit'i: `4784dcf` (`fix(kaira): normalize persisted fine-tune profiles`). Targeted contractlar, TypeScript, full regression ve production build başarıyla geçti.\n- Geçici migration workflow/script kaldırıldı.\n- Sonraki audit adayı: CharacterTab'daki LAYERS fine-tune key registry ile her runtime engine'in beklediği key seti karşılaştırılacak; aynı isimde görünmeyen veya UI'da olup hiçbir runtime engine tarafından tüketilmeyen parametre varsa sessiz no-op slider olarak işaretlenecek.\n'''
          if '## 45. Fine-tune profile hydration normalization — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record fine-tune profile normalization"
          git pull --rebase origin main
          git push origin main
