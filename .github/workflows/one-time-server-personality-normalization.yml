name: One-time server personality normalization

on:
  push:
    paths:
      - ".github/workflows/one-time-server-personality-normalization.yml"
      - "scripts/applyServerPersonalityNormalization.mjs"
      - "src/services/droitPersonalityNormalizer.ts"
      - "src/services/droitPersonalityNormalizer.test.ts"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize server personality boundary
        run: node scripts/applyServerPersonalityNormalization.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Personality boundary contracts
        run: npm test -- --run src/services/droitPersonalityNormalizer.test.ts src/services/kairaBasePersonalityOwnershipContracts.test.ts
      - name: TypeScript check
        run: npm run lint
      - name: Full tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit integration
        run: |
          if git diff --quiet -- server.ts src/services/kairaBasePersonalityOwnershipContracts.test.ts; then
            echo "server personality boundary already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/kairaBasePersonalityOwnershipContracts.test.ts
          git commit -m "fix(kaira): normalize server personality boundary"
          git pull --rebase origin main
          git push origin main
