name: Temporary Morphology Proof

on:
  push:
    branches:
      - codex/pre-gemini-language-foundation
    paths:
      - scripts/probe-turkish-morphology.mjs
      - .github/workflows/temporary-morphology-proof.yml

jobs:
  morphology-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install isolated morphology candidate
        run: npm install --no-save --package-lock=false --ignore-scripts nlptoolkit-morphologicalanalysis@1.0.20
      - name: Fetch analyzer data files for isolated proof
        run: |
          BASE=https://raw.githubusercontent.com/StarlangSoftware/TurkishMorphologicalAnalysis-Js/master
          curl -fsSL $BASE/turkish_dictionary.txt -o turkish_dictionary.txt
          curl -fsSL $BASE/turkish_finite_state_machine.xml -o turkish_finite_state_machine.xml
          curl -fsSL $BASE/turkish_misspellings.txt -o turkish_misspellings.txt
          curl -fsSL $BASE/turkish_morphological_lexicon.txt -o turkish_morphological_lexicon.txt
          curl -fsSL $BASE/suffixes.txt -o suffixes.txt
          curl -fsSL $BASE/pronunciations.txt -o pronunciations.txt
      - name: Run frozen morphology proof
        run: node scripts/probe-turkish-morphology.mjs
