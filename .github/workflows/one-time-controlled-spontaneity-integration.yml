name: One-time controlled spontaneity integration
# retry: compose into response-plan instruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-controlled-spontaneity-integration.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate controlled spontaneity and clean helpers
        run: |
          node scripts/one-time-controlled-spontaneity-integration.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-controlled-spontaneity-integration.mjs
          git rm .github/workflows/one-time-controlled-spontaneity-integration.yml
          git add server.ts
          git commit -m "feat(kaira): integrate controlled spontaneity"
          git push
