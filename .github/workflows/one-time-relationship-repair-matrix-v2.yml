name: One-time Relationship Repair Matrix V2

on:
  push:
    branches:
      - diag/relationship-repair-matrix

permissions:
  contents: write

jobs:
  matrix:
    if: ${{ !contains(github.event.head_commit.message, '[repair-matrix-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: diag/relationship-repair-matrix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run pure reducer adversarial matrix
        run: npx tsx .github/scripts/relationshipRepairMatrix.ts
      - name: Self-remove diagnostic
        run: |
          git rm .github/workflows/one-time-relationship-repair-matrix-v2.yml
          git rm .github/scripts/relationshipRepairMatrix.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove relationship repair matrix v2 [repair-matrix-cleanup]'
          git push origin HEAD:diag/relationship-repair-matrix
