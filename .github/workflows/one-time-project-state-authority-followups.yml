name: One-time project state authority followups

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-authority-followups.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section25 = '''\n\n## 25. HOW-only konuşma kimliği / mizah izni sınırı — 2026-08-30\n- `KairoSpeechIdentity` HOW-only sözleşmesine uygun hale getirildi: `speech.humorLevel` artık `allowHumor` iznini açamaz veya kapatamaz.\n- Canonical mizah izni `continueConversation && BehaviorContract.playfulness === "allowed"` üzerinden belirlenir.\n- `humorLevel` yalnızca izin verilmiş mizahın stil/eğilim/şiddet bilgisidir; WHAT/WHETHER otoritesi değildir.\n- `kairaResponsePlan.test.ts` regression testi active contract + `humorLevel=0` durumunda `plan.allowHumor=true` bekler. Distancing/repairing/disengaged contractları mizahı deterministic olarak bloklamaya devam eder.\n- Düzeltme commit'i: `75147a3` (`fix(kaira): keep humor permission out of HOW-only speech`). Normal CI architecture contracts + tests + TypeScript + production build ile başarıyla geçti.\n- Emoji bütçesi ayrı bir HOW nicelik sınırı olarak ayrıca audit edilecektir; bu fazda mekanik olarak değiştirilmedi.\n'''
          section26 = '''\n\n## 26. Temperament → KDM current-state handoff — 2026-08-30\n- Client `applyTemperamentBeforeKdm(...)` ile hesapladığı `temperamentAdjustedState`i alt davranış katmanlarında kullanırken server KDM'ye ham `dynamicState` gönderiyordu; aynı tur iki farklı current-state üzerinden ilerliyordu.\n- Chat payload artık `dynamicState: temperamentAdjustedState ?? dynamicState` gönderir. Böylece client'taki “KDM öncesi temperament” state'i ile authoritative server KDM'nin başlangıç state'i aynı nesnel durumu temsil eder.\n- Raw state ve adjusted state test-session layer audit içinde ayrı ayrı tutulmaya devam eder; gözlemlenebilirlik kaybolmadı.\n- `kairaTemperamentBeforeKdmContracts.test.ts` kalıcı `test:contracts` architecture suite'ine eklendi.\n- Entegrasyon commit'i: `2260223` (`fix(kaira): hand temperament state into KDM`). Migration workflow'unda contract, TypeScript, full test suite ve production build başarıyla geçti; geçici workflow sonrasında kaldırıldı.\n- Bir sonraki büyük audit sınırı: legacy client `behaviorIntegrationEngine` kararlarının KDM `behaviorProfile` ve relationship state transition'larına doğrudan girmesi. Bu katman sökülmeden önce base personality / integrated policy ownership contract'ı açıkça ayrıştırılmalı.\n'''
          if '## 25. HOW-only konuşma kimliği / mizah izni sınırı — 2026-08-30' not in text:
              text += section25
          if '## 26. Temperament → KDM current-state handoff — 2026-08-30' not in text:
              text += section26
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record authority follow-up fixes"
          git pull --rebase origin main
          git push origin main
