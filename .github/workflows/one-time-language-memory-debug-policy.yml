name: One-time language memory debug policy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply debug policy patch
        run: python scripts/one-time-language-memory-debug-policy.py
      - name: Commit patch and self-clean
        run: |
          rm scripts/one-time-language-memory-debug-policy.py
          rm .github/workflows/one-time-language-memory-debug-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/services/kairoLanguageMemory.ts scripts/one-time-language-memory-debug-policy.py .github/workflows/one-time-language-memory-debug-policy.yml
          git commit -m "fix(kaira): respect memory policy in language debug endpoint"
          git push
