name: One-time Phase3 Checkpoint
on:
  push:
    branches:
      - docs/phase3-production-checkpoint
permissions:
  contents: write
jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase3-production-checkpoint
          fetch-depth: 0
      - name: Append verified Phase 3 checkpoint
        shell: bash
        run: |
          cat >> PROJECT_STATE.md <<'EOF'

