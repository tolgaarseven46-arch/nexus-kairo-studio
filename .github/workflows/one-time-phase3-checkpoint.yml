name: One-time Phase3 Checkpoint
on:
  push:
    branches: [docs/phase3-production-checkpoint]
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase3-production-checkpoint
          fetch-depth: 0
      - name: Append checkpoint
        run: echo '' | base64 -d >> PROJECT_STATE.md
      - name: Commit checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-time-phase3-checkpoint.yml
          git add PROJECT_STATE.md
          git commit -m 'docs: checkpoint phase3 production acceptance'
          git push origin HEAD:docs/phase3-production-checkpoint
# registered
