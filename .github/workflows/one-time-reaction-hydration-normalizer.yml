name: One-time reaction hydration normalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-reaction-hydration-normalizer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve reaction and lifecycle state through hydration
        run: |
          node scripts/one-time-reaction-hydration-normalizer.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-time-reaction-hydration-normalizer.mjs
          git rm .github/workflows/one-time-reaction-hydration-normalizer.yml
          git add src/services/kdmPersistenceService.ts
          git commit -m "fix(kaira): preserve reaction lifecycle through hydration"
          git push
