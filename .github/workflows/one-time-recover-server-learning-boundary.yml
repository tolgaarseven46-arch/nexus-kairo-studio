name: One-time recover server learning boundary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore server and fix statement boundary
        run: python scripts/recover_server_learning_boundary.py
      - name: Commit recovery and self-clean
        run: |
          rm scripts/recover_server_learning_boundary.py
          rm .github/workflows/one-time-recover-server-learning-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts scripts/recover_server_learning_boundary.py .github/workflows/one-time-recover-server-learning-boundary.yml
          git commit -m "fix(kaira): recover server and finalize local learning boundary"
          git push
