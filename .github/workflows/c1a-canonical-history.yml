name: C1a Canonical History Migration

on:
  push:
    branches:
      - chatgpt/c1-single-semantic-authority
    paths:
      - .github/scripts/c1a-canonical-history.mjs
      - .github/workflows/c1a-canonical-history.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Apply C1a migration
        run: node .github/scripts/c1a-canonical-history.mjs

      - name: Focused authority tests
        run: npx vitest run src/services/kairaCanonicalSemanticHistoryAuthorityContracts.test.ts src/services/discourseStateReducer.test.ts src/services/kairaCurrentTurnDialogueAuthorityContracts.test.ts src/services/kairaSemanticConsumerAuthorityContracts.test.ts

      - name: TypeScript check
        run: npm run lint

      - name: Commit migration and remove one-time machinery
        run: |
          set -euo pipefail
          rm -f .github/scripts/c1a-canonical-history.mjs .github/workflows/c1a-canonical-history.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(c1a): use persisted canonical semantics for history'
          git push origin HEAD:chatgpt/c1-single-semantic-authority
