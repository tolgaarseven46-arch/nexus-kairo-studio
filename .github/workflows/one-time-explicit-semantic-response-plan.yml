name: One-time explicit semantic response-plan seam

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch server seam and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')
          old = 'behaviorContract = buildBehaviorContract(kdm.nextDynamicState, kdm.trace),'
          new = 'behaviorContract = buildBehaviorContract(kdm.nextDynamicState, kdm.trace, canonicalSemantic.event),'
          if old not in s:
              raise SystemExit('server behavior-contract seam not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/one-time-explicit-semantic-response-plan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts .github/workflows/one-time-explicit-semantic-response-plan.yml
          git commit -m "refactor(kaira): pass canonical semantic event to behavior contract"
          git push
