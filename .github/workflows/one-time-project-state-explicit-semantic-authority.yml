name: One-time project state explicit semantic authority

on:
  push:
    paths:
      - ".github/workflows/one-time-project-state-explicit-semantic-authority.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('PROJECT_STATE.md')
          text = p.read_text()
          section = '''\n\n## 65. Explicit semantic authority + stop-talking fix — 2026-08-31\n- Audited explicit user semantic commands against maximal personality, motivation, preference, social and expression pressure. Added permanent `kairaExplicitSemanticAuthorityContracts.test.ts`.\n- The semantic parser correctly distinguishes `stopQuestions` from `stopTalking`: a request such as `soru sorma artık` suppresses question generation while leaving the conversation open.\n- The audit found a real explicit-command leak for `stopTalking`: messages such as `sus artık` were recognized and already disabled humor/questions and shortened the response, but `continueConversation` could remain `true` under strong approach/engagement signals.\n- Fixed `behaviorIntegrationEngine.ts` narrowly: `continueConversation` is now false whenever `semanticEvent.stopTalking` is true. This does not force a persistent relationship disengage state; it only honors the explicit stop command at the integrated decision boundary.\n- Targeted semantic/integration/cross-family contracts, TypeScript, full regression and production build all passed after the fix.\n- Permanent product + contract commit: `38914b4` (`fix(kaira): honor explicit stop-talking command`).\n- Temporary verification workflow and helper scripts were removed after the successful run.\n- Next audit focus: value-vs-boundary overlap and repair reopening under competing warmth/goal/expression signals.\n'''
          if '## 65. Explicit semantic authority + stop-talking fix — 2026-08-31' not in text:
              text += section
          p.write_text(text)
          PY
      - name: Commit project state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(kaira): record explicit semantic authority fix"
          git pull --rebase origin main
          git push origin main
