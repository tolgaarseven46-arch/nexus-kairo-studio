name: One-time effective dialogue prompt patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align prompt with final question authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          old_early = '''    const dialogueDecisionInstruction =\n      buildDialogueDecisionInstruction(dialogueDecision);\n'''
          if old_early not in s:
              raise SystemExit('early dialogue instruction marker not found')
          s = s.replace(old_early, '', 1)
          old_late = '''      responsePlan = buildKairaResponsePlan(behaviorContract, dialogueDecision, speech),\n      responsePlanInstruction = kairaResponsePlanInstruction(responsePlan),\n      enforcementRules = {'''
          new_late = '''      responsePlan = buildKairaResponsePlan(behaviorContract, dialogueDecision, speech),\n      responsePlanInstruction = kairaResponsePlanInstruction(responsePlan),\n      dialogueDecisionInstruction = buildDialogueDecisionInstruction(\n        dialogueDecision,\n        responsePlan.allowQuestion,\n      ),\n      enforcementRules = {'''
          if old_late not in s:
              raise SystemExit('late response plan marker not found')
          s = s.replace(old_late, new_late, 1)
          p.write_text(s)
          PY
          npm install
          npx vitest run src/services/kairoDialogueDecisionEngine.test.ts src/services/kairaResponsePlan.test.ts src/services/kairaEmotionalQuestionPermissionContracts.test.ts
          npx tsc --noEmit
          npm test
          npm run build
          rm .github/workflows/one-time-dialogue-prompt-permission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts .github/workflows/one-time-dialogue-prompt-permission.yml
          git commit -m "fix(kaira): align dialogue prompt with final question authority"
          git push
